# Lint and format config for this operator, for golangci-lint v2.14 (the
# toolchain image's). `make lint` runs the linters, `make fmt-check` the
# formatters; any finding fails `make check`.
#
# This is the config kubebuilder v4.16.0 scaffolds, so its own scaffolding
# (`kubebuilder create api`, `create webhook`) lints clean. One change: its
# `logcheck` linter is gone. logcheck is a module plugin that needs a custom
# golangci-lint build (`.custom-gcl.yml`); the toolchain image ships the stock
# binary. Changing this file is the Standard's job, not a task's.
version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      # kubebuilder markers on API types and RBAC markers on reconcilers are
      # long single lines, and reconcilers of different kinds look alike.
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
