# Runs the quality contract on every pull request and on main. The rule of
# main requires a passing check whose name starts with "check" before a merge.
name: check

on:
  push:
    branches: [main]
  pull_request:

# The job reads the repository and nothing else of it.
permissions:
  contents: read

jobs:
  check:
    # The check a merge waits for is this job's name.
    name: check
    # GitHub's own runners take the job unless the organization names others,
    # and they run it in the factory's toolchain image. Both are Actions
    # variables of the organization, which the operator sets.
    runs-on: ${{ vars.THEOS_CI_RUNS_ON || 'ubuntu-latest' }}
    container: ${{ vars.THEOS_CI_IMAGE_BASE }}
    timeout-minutes: 60
    steps:
      - name: The toolchain image is named
        if: ${{ vars.THEOS_CI_IMAGE_BASE == '' }}
        run: |
          echo "::error::The Actions variable THEOS_CI_IMAGE_BASE names no image. The check runs in the factory's toolchain image, which the operator names for the organization."
          exit 1
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run hello
        run: sh hello.sh
