name: Report from an install
description: Something went wrong, or could be better, on an install of theos
labels: [source/user]
body:
  - type: input
    id: reporter
    attributes:
      label: Reported by
      description: The install's name, e.g. team-a
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: theos version
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
