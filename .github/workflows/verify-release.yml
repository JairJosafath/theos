name: Verify Release

# A release is checked, twice, on Kind clusters of its own, building nothing.
# Release dispatches it on main for every minor it publishes (vX.Y.0, #1105);
# a patch, or a release to check again, runs on demand (Actions → Verify
# Release → Run workflow, or `gh workflow run verify-release.yml -f
# tag=vX.Y.Z`), after Release has published the tag. "install" installs the published chart from GHCR into a fresh Kind
# cluster, as a new device would; "upgrade" installs the previous release (the
# highest published release below this one, hack/previous-release.sh: a tag
# whose release failed is skipped) the same way and then `helm upgrade`s it to
# this one, as a device that already runs a release would. The first release
# has no previous one: the upgrade is skipped and says so.
#
# Both follow the same steps: Agent Sandbox, the ghcr pull secret made from
# GITHUB_TOKEN (packages: read reads the private packages Release pushed), the
# agent images pulled and loaded into Kind, then `helm install` of
# oci://ghcr.io/<owner>/c4factory/charts/c4-factory with project webshop. They
# wait for the seed's repositories, both runners, the manager and the UI, then
# apply the installed release's own webshop sample and wait for orders-api's
# repository. Then they follow docs/getting-started.md for the first app: the
# `ghcr` pull Secret in webshop and its `default` ServiceAccount patch (proved
# by pulling agent-go through it), and config/samples/first-app (on the chart's
# catalog and Agents; an older tag's samples pinned to the release: the
# agent-go tag and the template refs from its templates/versions.txt), until
# orders-cli is scaffolded and its Crew is Idle. The Agent isn't run: CI has no
# Claude token.
#
# install takes the guide's samples: the dispatched ref's, so dispatching on
# main checks the guide against a release. A tag
# without config/samples/first-app skips that part and says so. upgrade takes
# the previous release's own first-app when it has one, else the guide's. A
# release whose chart has no catalog (v0.3.0 and older) takes the newest
# samples that still made their own catalog and Agents, as such a device did.
#
# upgrade then notes the objects, Gitea's repositories and Secrets gitea-admin
# and gitea-runner, `helm upgrade`s with the same values and checks that the
# CRDs are the new chart's, that every earlier object is still there with its
# phase and its Ready condition, that the new manager logs no reconcile error
# in its first two minutes, and that the Secrets and the repositories (each
# with its earlier head commit) are unchanged.
#
# The evidence is an artifact per check and the job summary; a failure of a
# dispatch on main files (or comments on) the issue
# "Release vX.Y.Z fails its check". A dispatch on another branch tests that
# branch, and its run is the report.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to check, e.g. v0.2.0
        required: true
      from:
        description: The release to upgrade from, e.g. v0.3.0; empty, the highest published release below tag
        required: false
        default: ""

permissions: {}

jobs:
  plan:
    permissions:
      contents: read
    name: Find the previous release
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      # For hack/previous-release.sh: main's, or the dispatched ref's.
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROM_INPUT: ${{ inputs.from }}
        run: |
          for t in "$TAG" $FROM_INPUT; do
            case "$t" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $t" >&2; exit 1 ;; esac
          done
          # The highest published release below TAG, or nothing. A failed
          # lookup fails the plan, never an upgrade from nothing.
          prev=$(hack/previous-release.sh "$TAG")
          skipped=$(hack/previous-release.sh --skipped "$TAG")
          # Dispatched with from: the path a given device takes, or the same
          # release again to try the check's own steps.
          if [ -n "$FROM_INPUT" ]; then
            prev=$FROM_INPUT skipped=
            [ "$prev" != "$TAG" ] || echo "::notice::from is $TAG itself: the upgrade check upgrades $TAG to $TAG"
          fi
          checks=$(jq -cn --arg tag "$TAG" '[{check: "install", from: $tag, name: "Install the release on Kind"}]')
          if [ -z "$prev" ]; then
            echo "::notice::$TAG is the first release: there is no published one before it to upgrade from, so the upgrade check is skipped"
            echo "No release before $TAG: the upgrade check is skipped." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "$TAG upgrades from $prev." | tee -a "$GITHUB_STEP_SUMMARY"
            checks=$(jq -c --arg prev "$prev" '. + [{check: "upgrade", from: $prev, name: ("Upgrade from " + $prev + " on Kind")}]' <<<"$checks")
          fi
          if [ -n "$skipped" ]; then
            echo "Skipped, tagged but never released: ${skipped//$'\n'/, }." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "checks=$checks" >>"$GITHUB_OUTPUT"

  verify-release:
    needs: plan
    permissions:
      contents: read
      packages: read
      issues: write
    name: ${{ matrix.name }}
    # On self-hosted runners (make gh-runner) only runner 1 of a device carries
    # c4factory-kind, so a device makes one Kind cluster at a time.
    runs-on: ${{ vars.RUNS_ON == 'self-hosted' && fromJSON('["self-hosted", "c4factory-kind"]') || vars.RUNS_ON || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      # A self-hosted runner (make gh-runner) shares the device's Docker and
      # memory with the Kind pool: one cluster at a time.
      max-parallel: ${{ vars.RUNS_ON && 1 || 2 }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    # A cluster of its own: on a self-hosted runner it shares the device's
    # Docker with the Kind pool.
    env:
      CHECK: ${{ matrix.check }}
      KIND_CLUSTER_NAME: release-${{ matrix.check }}
      KUBECTL: kubectl --context kind-release-${{ matrix.check }}
      AGENT_SANDBOX: https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.4/sandbox.yaml
      # TAG is the release checked; FROM the one installed first: TAG itself,
      # or for upgrade the previous release.
      TAG: ${{ needs.plan.outputs.tag }}
      FROM: ${{ matrix.from }}
      EVIDENCE: evidence
      # What this workflow gives up so the release fits a hosted runner (two
      # CPUs, 7 GB); the failure issue repeats it.
      TURNED_OFF: >-
        the go runner runs without its Go build cache (runners.go.goCache) and
        requests 100m CPU and 128Mi instead of its defaults; on a hosted runner,
        the preinstalled .NET, Android, GHC and CodeQL are removed for disk.
    steps:
      - name: Name the versions and the registry
        run: |
          echo "VERSION=${TAG#v}" >>"$GITHUB_ENV"
          echo "FROM_VERSION=${FROM#v}" >>"$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/c4factory" >>"$GITHUB_ENV"
          echo "GITEA_PORT=3000" >>"$GITHUB_ENV"
          # The values the upgrade repeats.
          echo "VALUES=$RUNNER_TEMP/values.yaml" >>"$GITHUB_ENV"

      # The installed release's own sample: its templates are pinned to the
      # refs that release's seed pushes.
      - name: Clone the installed release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.FROM }}
          persist-credentials: false

      # The guide's samples: the dispatched ref's (main's), and
      # their history for a release whose chart has no catalog.
      - name: Clone the guide's samples
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: guide
          # Whole: the history's blobs need no credentials later.
          fetch-depth: 0
          persist-credentials: false

      - name: Name the guide's samples
        env:
          GUIDE_REF: ${{ github.ref_name }}
        run: |
          samples= ref=
          if [ "$CHECK" = upgrade ] && [ -d config/samples/first-app ]; then
            samples=config/samples/first-app ref=$FROM
          elif [ -d guide/config/samples/first-app ]; then
            samples=guide/config/samples/first-app ref=$GUIDE_REF
          fi
          # A chart without the catalog and Agents (0.3.0 and older) takes the
          # newest samples that made their own: the commit before the one that
          # removed first-app/catalog.yaml, when the chart took them over.
          if [ -n "$samples" ] && [ ! -f "$samples/catalog.yaml" ] && ! grep -q '^catalog:' dist/chart/values.yaml; then
            removed=$(git -C guide log -1 --format=%H -- config/samples/first-app/catalog.yaml)
            if [ -n "$removed" ]; then
              mkdir -p "$RUNNER_TEMP/legacy"
              git -C guide archive "$removed^" config/samples/first-app | tar -x -C "$RUNNER_TEMP/legacy"
              samples=$RUNNER_TEMP/legacy/config/samples/first-app ref=$(git -C guide rev-parse --short "$removed^")
            fi
          fi
          if [ -n "$samples" ]; then
            echo "GUIDE=run" >>"$GITHUB_ENV"
            echo "SAMPLES=$samples" >>"$GITHUB_ENV"
            echo "SAMPLES_REF=$ref" >>"$GITHUB_ENV"
            echo "first-app: $samples, from $ref"
          else
            skip="$GUIDE_REF has no config/samples/first-app that $FROM's chart can run"
            echo "GUIDE=skipped" >>"$GITHUB_ENV"
            echo "SAMPLES_REF=$GUIDE_REF" >>"$GITHUB_ENV"
            echo "GUIDE_SKIPPED=$skip" >>"$GITHUB_ENV"
            echo "::notice::$skip: the getting-started check is skipped"
          fi

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install kind and Helm
        run: |
          if ! command -v kind >/dev/null; then
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/kind
          fi
          command -v helm >/dev/null || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
          kind version
          helm version

      # A self-hosted runner may still have the one a cancelled run left.
      - name: Create kind cluster
        run: |
          kind delete cluster --name "$KIND_CLUSTER_NAME"
          kind create cluster --name "$KIND_CLUSTER_NAME" --wait 120s

      - name: Install Agent Sandbox
        run: |
          $KUBECTL apply --server-side -f "$AGENT_SANDBOX"
          # A CRD applied a moment ago may have no status.conditions yet, and
          # wait fails on it at once instead of waiting; try again until it has.
          for i in $(seq 30); do
            $KUBECTL wait --for=condition=Established crd --all --timeout=60s && break
            [ "$i" -lt 30 ] || exit 1
            sleep 2
          done
          $KUBECTL -n agent-sandbox-system rollout status deployment --timeout=300s

      # The pull secret covers the chart's pods; the agent images run in
      # Sandboxes outside the chart, so they are loaded (dist/chart/README.md,
      # "Private images"), both releases' for the upgrade. Each one leaves
      # Docker once Kind has it, for disk.
      - name: Pull the release's images
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          for ns in c4-factory-system gitea webshop; do
            $KUBECTL create namespace "$ns"
          done
          for ns in c4-factory-system gitea; do
            $KUBECTL -n "$ns" create secret docker-registry ghcr --docker-server=ghcr.io \
              --docker-username="$ACTOR" --docker-password="$TOKEN"
          done
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          for version in $(printf '%s\n' "$FROM_VERSION" "$VERSION" | sort -u); do
            for name in agent-base agent-go; do
              docker pull "$REGISTRY/$name:$version"
              kind load docker-image --name "$KIND_CLUSTER_NAME" "$REGISTRY/$name:$version"
              docker rmi "$REGISTRY/$name:$version"
            done
          done
          df -h /

      - name: Install the chart
        run: |
          cat >"$VALUES" <<'EOF'
          gitea:
            createNamespace: false
            projects: [webshop]
          global:
            imagePullSecrets: [{name: ghcr}]
          manager:
            imagePullSecrets: [{name: ghcr}]
          runners:
            go:
              goCache: ""
              resources:
                requests: {cpu: 100m, memory: 128Mi}
          EOF
          helm install c4-factory "oci://$REGISTRY/charts/c4-factory" --version "$FROM_VERSION" \
            --kube-context "kind-$KIND_CLUSTER_NAME" -n c4-factory-system --wait --timeout 15m -f "$VALUES"

      - name: Wait for the seed, the runners, the manager and the UI
        run: |
          $KUBECTL -n c4-factory-system rollout status deployment/c4-factory-controller-manager --timeout=300s
          $KUBECTL -n c4-factory-system rollout status deployment/c4-factory-ui --timeout=300s
          $KUBECTL -n gitea port-forward service/gitea "$GITEA_PORT:3000" >/dev/null 2>&1 &
          user=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.username}' | base64 -d)
          pass=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.password}' | base64 -d)
          echo "::add-mask::$pass"
          api() { curl -fsS -u "$user:$pass" "http://localhost:$GITEA_PORT/api/v1/$1"; }
          for i in $(seq 1 30); do api version >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 60); do
            api orgs/templates >/dev/null 2>&1 && api orgs/webshop >/dev/null 2>&1 &&
              [ "$(api orgs/templates/repos | jq length)" -gt 0 ] && break
            sleep 5
          done
          echo "templates: $(api orgs/templates/repos | jq -r '[.[].name] | sort | join(" ")')"
          api orgs/webshop >/dev/null
          for i in $(seq 1 60); do
            runners=$(api admin/actions/runners | jq -r '[.runners[] | select(.status != "offline") | .labels[].name] | sort | join(" ")')
            [ "$runners" = "base go" ] && break
            sleep 5
          done
          echo "runners: $runners"
          [ "$runners" = "base go" ]

      - name: Scaffold orders-api
        run: |
          $KUBECTL apply -k config/samples
          for i in $(seq 1 60); do
            phase=$($KUBECTL -n webshop get container orders-api -o jsonpath='{.status.phase}')
            [ "$phase" = Ready ] || [ "$phase" = Failed ] && break
            sleep 5
          done
          $KUBECTL -n webshop get container orders-api -o wide
          [ "$phase" = Ready ]
          user=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.username}' | base64 -d)
          pass=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.password}' | base64 -d)
          curl -fsS -u "$user:$pass" "http://localhost:$GITEA_PORT/api/v1/repos/webshop/orders-api/contents" |
            jq -r '.[].path'

      # docs/getting-started.md, "Registry login and the pull secret": the
      # agents' pods run as the project's default ServiceAccount. A pod with
      # imagePullPolicy Always proves it pulls agent-go from GHCR, though Kind
      # has the image loaded.
      - name: "Getting started: the project's pull secret"
        if: env.GUIDE == 'run'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          $KUBECTL -n webshop create secret docker-registry ghcr --docker-server=ghcr.io \
            --docker-username="$ACTOR" --docker-password="$TOKEN"
          $KUBECTL -n webshop patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr"}]}'
          $KUBECTL -n webshop run pull-check --image="$REGISTRY/agent-go:$FROM_VERSION" --image-pull-policy=Always \
            --restart=Never --command -- true
          $KUBECTL -n webshop wait pod/pull-check --for=jsonpath='{.status.phase}'=Succeeded --timeout=10m ||
            { $KUBECTL -n webshop describe pod pull-check | tail -20; exit 1; }
          $KUBECTL -n webshop delete pod pull-check

      # docs/getting-started.md, "The model and the Crew", with the samples
      # named above. Since the chart installs the catalog and the Agents they
      # pin nothing; older samples are set to the installed release (the
      # agent-go tag and the template refs of its templates/versions.txt), and
      # the release's own samples must already say so. Main's samples need a
      # release whose chart has the catalog and Agents (after 0.3.0).
      - name: "Getting started: the first app"
        if: env.GUIDE == 'run'
        run: |
          samples="$RUNNER_TEMP/first-app"
          cp -r "$SAMPLES" "$samples"
          if [ -f "$samples/agents.yaml" ]; then
            sed -i -E "s#image: .*/agent-go:.*#image: $REGISTRY/agent-go:$FROM_VERSION#" "$samples/agents.yaml"
          fi
          if [ -f "$samples/catalog.yaml" ]; then
            awk 'NR == FNR { ref[$1] = $2; next }
              /url: .*\/templates\// { name = $2; sub(/.*\/templates\//, "", name) }
              /^ *ref:/ && (name in ref) { sub(/ref: .*/, "ref: " ref[name]); name = "" }
              { print }' templates/versions.txt "$SAMPLES/catalog.yaml" >"$samples/catalog.yaml"
          fi
          diff -ru "$SAMPLES" "$samples" | tee "$RUNNER_TEMP/first-app.diff" || true
          if [ "$SAMPLES_REF" = "$FROM" ] && [ -s "$RUNNER_TEMP/first-app.diff" ]; then
            echo "::error::$FROM's config/samples/first-app is not pinned to $FROM (diff above)"
            exit 1
          fi
          $KUBECTL apply -k "$samples"
          $KUBECTL -n webshop wait container/orders-cli --for=jsonpath='{.status.phase}'=Ready --timeout=5m ||
            { $KUBECTL -n webshop describe container orders-cli | tail -30; exit 1; }
          user=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.username}' | base64 -d)
          pass=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.password}' | base64 -d)
          # Gitea may list a repository pushed a moment ago as empty.
          for i in $(seq 1 30); do
            files=$(curl -fsS -u "$user:$pass" "http://localhost:$GITEA_PORT/api/v1/repos/webshop/orders-cli/contents" |
              jq -r '.[].path' || true)
            grep -qx go.mod <<<"$files" && break
            sleep 2
          done
          echo "$files"
          grep -qx go.mod <<<"$files"
          $KUBECTL -n webshop wait crew/orders-cli --for=jsonpath='{.status.phase}'=Idle --timeout=5m ||
            { $KUBECTL -n webshop get crew orders-cli -o yaml | tail -30; exit 1; }
          $KUBECTL -n webshop get crew orders-cli -o wide

      # docs/getting-started.md, "Without a token": the chart's Agent stand-in
      # plans the tag's config/samples/brief/stand-in.yaml from the catalog, its
      # Container scaffolds, and its Crew starts a Task for the issue the Brief
      # filed. The Brief loop on the published chart, with no Claude token. A
      # release without the sample or the Agent skips it and says so.
      - name: "Getting started: a Brief without a token"
        if: matrix.check == 'install' && env.GUIDE == 'run'
        run: |
          sample=guide/config/samples/brief/stand-in.yaml
          if [ ! -f "$sample" ] || ! $KUBECTL -n webshop get agent stand-in >/dev/null 2>&1; then
            echo "::notice::$TAG has no config/samples/brief/stand-in.yaml or Agent stand-in: the Brief check is skipped"
            echo "No stand-in Brief in $TAG: the Brief check is skipped." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          brief=$($KUBECTL apply -f "$sample" -o jsonpath='{.metadata.name}')
          get() { $KUBECTL -n webshop get brief "$brief" -o jsonpath="$1"; }
          for i in $(seq 1 90); do
            phase=$(get '{.status.phase}')
            case $phase in Planned | Failed | NeedsInput) break ;; esac
            sleep 10
          done
          echo "Brief $brief: ${phase:-no phase}"
          [ "$phase" = Planned ] || { $KUBECTL -n webshop get brief "$brief" -o yaml | tail -40; exit 1; }
          get '{range .status.choices[*]}- {@}{"\n"}{end}'
          container=$(get '{.status.created[?(@.kind=="Container")].name}')
          crew=$(get '{.status.created[?(@.kind=="Crew")].name}')
          issue=$(get '{.status.issues[0].number}')
          $KUBECTL -n webshop wait "container/$container" --for=jsonpath='{.status.phase}'=Ready --timeout=5m ||
            { $KUBECTL -n webshop describe container "$container" | tail -30; exit 1; }
          task=
          for i in $(seq 1 60); do
            task=$($KUBECTL -n webshop get tasks -l "c4.factory.io/crew=$crew,c4.factory.io/issue=$issue" -o name)
            [ -n "$task" ] && break
            sleep 10
          done
          [ -n "$task" ] || { $KUBECTL -n webshop get crew "$crew" -o yaml | tail -30; exit 1; }
          echo "Crew $crew started $task for issue $issue"
          $KUBECTL -n webshop get briefs,containers,crews,tasks -o wide

      # What a device has before it upgrades: every c4 object with its phase
      # and Ready condition, Gitea's repositories with their head commits, and
      # a hash of each generated Secret. The script stays for the check after.
      - name: "Upgrade: note what the previous release made"
        if: matrix.check == 'upgrade'
        run: |
          cat >"$RUNNER_TEMP/snapshot.sh" <<'EOF'
          set -euo pipefail
          out=$1
          mkdir -p "$out"
          # kind namespace name phase Ready
          $KUBECTL get c4,c4catalog -A -o json | jq -r '.items[] | [.kind, .metadata.namespace, .metadata.name,
            (.status.phase // "-"), ((.status.conditions // []) | map(select(.type == "Ready")) | .[0].status // "-")] | @tsv' |
            sort >"$out/objects.tsv"
          for s in gitea-admin gitea-runner; do
            echo "$s $($KUBECTL -n gitea get secret "$s" -o json | jq -cS .data | sha256sum | cut -c1-16)"
          done >"$out/secrets.txt"
          user=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.username}' | base64 -d)
          pass=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.password}' | base64 -d)
          echo "::add-mask::$pass"
          api() { curl -fsS -u "$user:$pass" "http://localhost:$GITEA_PORT/api/v1/$1"; }
          # repository default-branch head
          api "repos/search?limit=50" | jq -r '.data[] | [.full_name, .default_branch] | @tsv' | sort |
            while read -r repo branch; do
              sha=$(api "repos/$repo/branches/$branch" | jq -er .commit.id)
              echo "$repo $branch $sha"
            done >"$out/repos.txt"
          EOF
          bash "$RUNNER_TEMP/snapshot.sh" "$EVIDENCE/before"
          cat "$EVIDENCE/before/objects.tsv" "$EVIDENCE/before/secrets.txt" "$EVIDENCE/before/repos.txt"

      - name: "Upgrade: helm upgrade to the release"
        if: matrix.check == 'upgrade'
        run: |
          # Pulled once: the CRD check renders the same chart.
          helm pull "oci://$REGISTRY/charts/c4-factory" --version "$VERSION" --untar -d "$RUNNER_TEMP/chart"
          helm upgrade c4-factory "$RUNNER_TEMP/chart/c4-factory" \
            --kube-context "kind-$KIND_CLUSTER_NAME" -n c4-factory-system --wait --timeout 15m -f "$VALUES"
          $KUBECTL -n c4-factory-system rollout status deployment/c4-factory-controller-manager --timeout=300s
          $KUBECTL -n c4-factory-system rollout status deployment/c4-factory-ui --timeout=300s
          $KUBECTL -n gitea rollout status deployment/gitea --timeout=300s
          date -u +%s >"$RUNNER_TEMP/upgraded-at"
          # Gitea's pod may have rolled, and the earlier port-forward with it.
          echo "GITEA_PORT=3001" >>"$GITHUB_ENV"
          $KUBECTL -n gitea port-forward service/gitea 3001:3000 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/v1/version >/dev/null 2>&1 && break; sleep 2; done
          helm --kube-context "kind-$KIND_CLUSTER_NAME" -n c4-factory-system history c4-factory

      # What the release's chart renders, not its config/crd/bases: v0.3.0's
      # chart shipped a crews CRD older than its bases.
      - name: "Upgrade: the CRDs are the release's"
        if: matrix.check == 'upgrade'
        run: |
          chart=$RUNNER_TEMP/chart/c4-factory
          only=()
          for f in "$chart"/templates/crd/*.yaml; do only+=(--show-only "templates/crd/${f##*/}"); done
          helm template c4-factory "$chart" -n c4-factory-system -f "$VALUES" "${only[@]}" >"$EVIDENCE/crds.yaml"
          echo "$(grep -c '^kind: CustomResourceDefinition' "$EVIDENCE/crds.yaml") CRDs in $TAG's chart"
          # kubectl diff exits 1 when applying them would change what the
          # cluster has.
          if $KUBECTL diff -f "$EVIDENCE/crds.yaml" >"$EVIDENCE/crd.diff"; then
            echo "The CRDs are $TAG's."
          else
            cat "$EVIDENCE/crd.diff"
            echo "::error::The CRDs after the upgrade are not $TAG's (diff above)"
            exit 1
          fi

      # Two minutes of the new manager: the earlier objects keep their phase
      # and Ready, and it logs no reconcile error. Conflicts (the object has
      # been modified) are retried at once and not counted.
      - name: "Upgrade: the earlier objects still run"
        if: matrix.check == 'upgrade'
        run: |
          left=$(( $(cat "$RUNNER_TEMP/upgraded-at") + 120 - $(date -u +%s) ))
          [ "$left" -gt 0 ] && sleep "$left"
          $KUBECTL -n c4-factory-system logs deployment/c4-factory-controller-manager --all-containers \
            >"$EVIDENCE/manager.log" 2>&1
          bash "$RUNNER_TEMP/snapshot.sh" "$EVIDENCE/after"
          fail=0
          # Every earlier object, by kind, namespace and name: the chart's hooks
          # (GitProviders, the catalog) are recreated on every upgrade.
          while IFS=$'\t' read -r kind ns name phase ready; do
            now=$(awk -F'\t' -v k="$kind" -v n="$ns" -v m="$name" '$1 == k && $2 == n && $3 == m' "$EVIDENCE/after/objects.tsv")
            if [ -z "$now" ]; then
              echo "::error::$kind $ns/$name is gone after the upgrade"; fail=1; continue
            fi
            IFS=$'\t' read -r _ _ _ phase2 ready2 <<<"$now"
            if [ "$phase2" != "$phase" ] || { [ "$ready" = True ] && [ "$ready2" != True ]; }; then
              echo "::error::$kind $ns/$name was phase $phase, Ready $ready; after the upgrade phase $phase2, Ready $ready2"
              fail=1
            fi
          done <"$EVIDENCE/before/objects.tsv"
          errors=$(grep 'Reconciler error' "$EVIDENCE/manager.log" | grep -v 'the object has been modified' || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            echo "::error::The manager logged $(wc -l <<<"$errors") reconcile errors in its first two minutes after the upgrade (above)"
            fail=1
          fi
          if ! diff -u "$EVIDENCE/before/secrets.txt" "$EVIDENCE/after/secrets.txt"; then
            echo "::error::The upgrade changed Secret gitea-admin or gitea-runner (hashes above)"
            fail=1
          fi
          # Every earlier repository is still there and still has its earlier
          # head commit; the seed may add template tags on top.
          user=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.username}' | base64 -d)
          pass=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.password}' | base64 -d)
          echo "::add-mask::$pass"
          while read -r repo branch sha; do
            if ! curl -fsS -u "$user:$pass" "http://localhost:$GITEA_PORT/api/v1/repos/$repo/git/commits/$sha" >/dev/null; then
              echo "::error::Gitea repository $repo lost commit $sha of $branch in the upgrade"
              fail=1
            fi
          done <"$EVIDENCE/before/repos.txt"
          diff -u "$EVIDENCE/before/objects.tsv" "$EVIDENCE/after/objects.tsv" || true
          diff -u "$EVIDENCE/before/repos.txt" "$EVIDENCE/after/repos.txt" || true
          exit "$fail"

      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$EVIDENCE"
          cd "$EVIDENCE"
          {
            echo "== free -m"; free -m
            echo "== df -h /"; df -h /
          } >runner.txt 2>&1
          $KUBECTL get nodes -o wide >nodes.txt 2>&1 || true
          $KUBECTL get pods -A -o wide >pods.txt 2>&1 || true
          $KUBECTL get deployments,statefulsets,jobs -A >workloads.txt 2>&1 || true
          $KUBECTL get events -A --sort-by=.lastTimestamp >events.txt 2>&1 || true
          $KUBECTL top node >top.txt 2>&1 || true
          $KUBECTL -n webshop get projects,gitproviders,softwaresystems,containers,datastores,relationships -o wide >webshop.txt 2>&1 || true
          $KUBECTL -n webshop get container orders-api -o yaml >orders-api.yaml 2>&1 || true
          if [ "$GUIDE" = run ]; then
            $KUBECTL -n webshop get agents,crews -o wide >first-app.txt 2>&1 || true
            $KUBECTL -n webshop get container orders-cli -o yaml >orders-cli.yaml 2>&1 || true
            $KUBECTL -n webshop get crew orders-cli -o yaml >crew-orders-cli.yaml 2>&1 || true
            cp "$RUNNER_TEMP/first-app.diff" first-app.diff 2>/dev/null || true
          fi
          helm --kube-context "kind-$KIND_CLUSTER_NAME" -n c4-factory-system status c4-factory >helm-status.txt 2>&1 || true
          helm --kube-context "kind-$KIND_CLUSTER_NAME" -n c4-factory-system history c4-factory >helm-history.txt 2>&1 || true
          user=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.username}' 2>/dev/null | base64 -d || true)
          pass=$($KUBECTL -n gitea get secret gitea-admin -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)
          curl -fsS -u "$user:$pass" "http://localhost:$GITEA_PORT/api/v1/repos/search?limit=50" 2>/dev/null |
            jq -r '.data[].full_name' | sort >gitea-repos.txt || echo "(Gitea did not answer)" >gitea-repos.txt
          if [ "${{ job.status }}" != success ]; then
            mkdir -p logs
            $KUBECTL get pods -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name 2>/dev/null |
              while read -r ns pod; do
                $KUBECTL -n "$ns" logs "$pod" --all-containers --tail=200 >"logs/$ns.$pod.log" 2>&1 || true
              done
          fi
          # Short of memory or disk: an OOMKilled or Evicted pod, under 512 MB
          # available, or under 2 GB of disk left.
          mem=$(free -m | awk '/^Mem:/ {print $7}')
          disk=$(df -BM --output=avail / | tail -1 | tr -dc 0-9)
          killed=$(cat pods.txt events.txt | grep -cE 'OOMKilled|Evicted' || true)
          echo "Runner: ${mem} MB of memory available, ${disk} MB of disk left, ${killed} OOMKilled or Evicted." >pressure.txt
          if [ "$killed" -gt 0 ] || [ "$mem" -lt 512 ] || [ "$disk" -lt 2048 ]; then
            echo "SHORT=true" >>"$GITHUB_ENV"
          fi
          {
            if [ "$CHECK" = upgrade ]; then
              echo "## Release $TAG, upgraded from $FROM: ${{ job.status }}"
              echo
              echo "Chart \`oci://$REGISTRY/charts/c4-factory\` $FROM_VERSION on Kind, then \`helm upgrade\` to $VERSION" \
                "with the same values. $(cat pressure.txt)"
              echo
              echo "### Before and after the upgrade"
              for f in objects.tsv secrets.txt repos.txt; do
                echo "\`$f\`:"; echo '```diff'; diff -u before/$f after/$f 2>&1 || true; echo '```'
              done
              echo "### Helm history"; echo '```'; cat helm-history.txt; echo '```'
            else
              echo "## Release $TAG: ${{ job.status }}"
              echo
              echo "Chart \`oci://$REGISTRY/charts/c4-factory\` $VERSION on Kind. $(cat pressure.txt)"
            fi
            echo
            echo "### Gitea repositories"; echo '```'; cat gitea-repos.txt; echo '```'
            echo "### webshop"; echo '```'; cat webshop.txt; echo '```'
            echo "### Getting started"
            echo
            if [ "$GUIDE" = run ]; then
              echo "The guide's first app, from \`$SAMPLES\` of $SAMPLES_REF set to $FROM_VERSION," \
                "through the \`ghcr\` pull Secret on ServiceAccount \`webshop/default\`." \
                "The Agent isn't run: CI has no Claude token, so the check stops before a Task."
              echo; echo '```'; cat first-app.txt; echo '```'
              if [ -s first-app.diff ]; then
                echo "Set to the release:"; echo '```diff'; cat first-app.diff; echo '```'
              fi
            else
              echo "Skipped: $GUIDE_SKIPPED."
            fi
            echo "### Pods"; echo '```'; cat pods.txt; echo '```'
          } | tee summary.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.TAG }}-${{ matrix.check }}
          path: ${{ env.EVIDENCE }}

      # Only a dispatch on main speaks for the release; a dispatch on another branch tests that branch, and its run
      # is the report.
      - name: File the failure
        if: failure() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release $TAG fails its check"
          {
            if [ "$CHECK" = upgrade ]; then
              echo "*Verify Release* installed the published chart $FROM_VERSION on Kind, upgraded it to $VERSION and it failed: $RUN_URL"
            else
              echo "*Verify Release* installed the published chart $VERSION on Kind and it failed: $RUN_URL"
            fi
            echo
            echo "The evidence (kubectl get output, Gitea's repositories, the pods' logs) is the run's artifact \`release-$TAG-$CHECK\`."
            echo
            if [ "${SHORT:-}" = true ]; then
              echo "**The runner ran short of memory or disk.** $(cat "$EVIDENCE/pressure.txt")"
            else
              cat "$EVIDENCE/pressure.txt" || echo "The workflow measured no memory or disk numbers."
            fi
            echo
            echo "To fit, the workflow turned off: $TURNED_OFF"
          } >body.md
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md \
              --label status/ready --label priority/urgent --label kind/bug --label source/dev
          fi

      - name: Delete kind cluster
        if: always() && runner.environment == 'self-hosted'
        run: kind delete cluster --name "$KIND_CLUSTER_NAME"
