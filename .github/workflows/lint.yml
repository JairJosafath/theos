name: Lint

# Go sources, the linter's configuration and the YAML that make validate-yaml
# checks (with the templates and tools it renders them with), and what the
# shell tests of hack/ read (make test-hack), and every Markdown file and
# docs/** (#148: the link check runs in the Shell tests job, and a pull request
# that changes only documents must still start it; on such a change the Lint
# job's steps select nothing and Shell tests selects doc-links alone). It runs
# on pull requests to main too, with the same paths, so lint and the shell
# tests answer before hack/lib/github.sh land (hack/check-workflows.sh).
# Every run is partial, against main (#127): each job runs its part of make
# check (CHECK_STEPS), each step only when the change can have broken it
# (hack/check.sh). The linter reads the packages gta selects; validate-yaml
# and the shell tests run when one of their inputs changed. Nothing here runs
# every step: only a release does, Release's own first job (release.yml).
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .custom-gcl.yml
      - Makefile
      - PROJECT
      - '**/*.yaml'
      - dist/chart/**
      - templates/**
      - hack/**
      - dev
      - ui/Dockerfile
      - '**/*.md'
      - 'docs/**'
      - .claude/skills/**
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .custom-gcl.yml
      - Makefile
      - PROJECT
      - '**/*.yaml'
      - dist/chart/**
      - templates/**
      - hack/**
      - dev
      - ui/Dockerfile
      - '**/*.md'
      - 'docs/**'
      - .claude/skills/**
      - .github/workflows/**
  workflow_dispatch:

# One group per pull request, where a new push cancels the run in progress, and
# one per commit on main: a push to main is compared with the head before it,
# so each push needs its own run, and a pending run GitHub dropped for a newer
# push would leave its change unchecked until a release (#127;
# hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # What a run is compared with: a pull request with its base branch, a push
  # to main with main's head before the push, a manual run with main. When
  # that commit is not in the clone (a forced push), the change can't be
  # known and every step runs.
  TEST_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: make check diffs against the merge base with
          # TEST_BASE (hack/lib/change.sh).
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Check linter configuration
        run: make lint-config
      # This job's part of make check: manifests and generate when what they
      # read changed, the linter on the packages the change affects, and
      # validate-yaml when one of its inputs changed.
      - name: Lint and validate the YAML
        run: make check CHECK_STEPS="generate lint validate-yaml"
        env:
          # hack/k8s-openapi.sh lists the Kubernetes schemas through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      # make manifests regenerated the CRDs, the role and the chart's copies of
      # them when what they are made from changed; a stale committed one shows
      # as a change here (#1689).
      - name: Generated files are committed
        run: make check-generated

  test-hack:
    permissions:
      contents: read
    name: Shell tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: make check diffs against the merge base with
          # TEST_BASE (hack/lib/change.sh).
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      # When a file the shell tests read changed (hack/check-cache.sh says
      # which those are); the step says so when it skips them. Three of them
      # scan the whole repository, and each runs by itself when a file it
      # reads changed and the shell tests don't: the links of the Markdown,
      # the license header of every Go file, and the table of the files Go
      # tests read. Without them a Go file with no license header passed here.
      - name: Run the shell tests
        run: make check CHECK_STEPS="test-hack doc-links license-headers readers"
