name: Lint

# Only Go sources and the linter's own configuration can change the result.
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .custom-gcl.yml
      - Makefile
      - .github/workflows/lint.yml
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
