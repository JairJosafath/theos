name: Lint

# Go sources, the linter's configuration and the YAML that make validate-yaml
# checks (with the templates and tools it renders them with), and what the
# shell tests of hack/ read (make test-hack). It runs on pull requests to main
# too, with the same paths, so vet, lint and the shell tests answer before
# hack/lib/github.sh land (hack/check-workflows.sh).
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .custom-gcl.yml
      - Makefile
      - PROJECT
      - '**/*.yaml'
      - dist/chart/**
      - templates/**
      - hack/**
      - dev
      - ui/Dockerfile
      - docs/getting-started.md
      - .claude/skills/**
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .custom-gcl.yml
      - Makefile
      - PROJECT
      - '**/*.yaml'
      - dist/chart/**
      - templates/**
      - hack/**
      - dev
      - ui/Dockerfile
      - docs/getting-started.md
      - .claude/skills/**
      - .github/workflows/**
  workflow_dispatch:

# One group per branch or pull request. On main a running run finishes, so
# main keeps getting a verdict, and GitHub cancels the older pending ones when
# a newer push comes; on a pull request a new push cancels the run in
# progress too (hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
      - name: Validate the YAML
        run: make validate-yaml
        env:
          # hack/k8s-openapi.sh lists the Kubernetes schemas through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      # make validate-yaml regenerated the CRDs, the role and the chart's copies
      # of them; a stale committed one shows as a change here (#1689).
      - name: Generated files are committed
        run: make check-generated

  test-hack:
    permissions:
      contents: read
    name: Shell tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Run the shell tests
        run: make test-hack
