name: Lint

# Go sources, the linter's configuration and the YAML that make validate-yaml
# checks (with the templates and tools it renders them with).
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .custom-gcl.yml
      - Makefile
      - '**/*.yaml'
      - dist/chart/**
      - templates/**
      - hack/validate-yaml.sh
      - hack/k8s-openapi.sh
      - .github/workflows/lint.yml
  workflow_dispatch:

# One pending run per branch: a running one finishes, so main keeps getting a
# verdict, and GitHub cancels the older pending ones when a newer push comes
# (hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
      - name: Validate the YAML
        run: make validate-yaml
        env:
          # hack/k8s-openapi.sh lists the Kubernetes schemas through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
