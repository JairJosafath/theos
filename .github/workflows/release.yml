name: Release

# A pushed vX.Y.Z tag publishes c4factory, so a device installs it without
# building anything: the operator, UI, seed, toolchain, agent and runner images to
# ghcr.io/<owner>/c4factory/<name>:X.Y.Z, and the Helm chart, versioned X.Y.Z,
# to oci://ghcr.io/<owner>/c4factory/charts and to a GitHub release for the tag.
# One job builds the images in order with the local Docker daemon, so the agent
# and runner images build on the toolchains just built. It runs no tests:
# releases are cut from main. The release's notes are hack/release-notes.sh's
# draft from the pull requests merged since the previous release, the newest
# published one below the tag (hack/previous-release.sh): a tag whose release
# failed is not a release. The maintainer edits them on the release.
# The tag must be dist/chart/Chart.yaml's version and the release
# docs/getting-started.md installs, or nothing is built (hack/release.sh
# --check); hack/release.sh X.Y.Z bumps both, merges and tags.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    name: Build and publish
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The whole history and its tags: the release notes list the pull
          # requests merged since the previous release's tag.
          fetch-depth: 0

      # The Go toolchain's warm build cache makes it several GB, and the agent
      # and runner images build on it. A self-hosted runner (make gh-runner)
      # builds on the device's Docker, which has room and none of this.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Name the version and the registry
        run: |
          if [ "$PUBLISH" = true ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-dryrun; fi
          # The tag must be the version the chart and the guide name (#370):
          # docs/getting-started.md at the tag installs that release.
          if [ "$PUBLISH" = true ] && ! hack/release.sh --check "$GITHUB_REF_NAME" 2>refused; then
            while read -r line; do echo "::error::$line"; done <refused
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/c4factory" >>"$GITHUB_ENV"

      - name: Build the images
        run: |
          set -x
          docker build -t "$REGISTRY/operator:$VERSION" --build-arg VERSION="$VERSION" .
          docker build -t "$REGISTRY/ui:$VERSION" --build-arg VERSION="$VERSION" ui
          docker build -t "$REGISTRY/seed:$VERSION" -f hack/seed/Dockerfile .
          docker build -t "$REGISTRY/base:$VERSION" hack/toolchain-base
          docker build -t "$REGISTRY/go:$VERSION" hack/toolchain-go
          for tc in base go; do
            docker build -t "$REGISTRY/agent-$tc:$VERSION" --build-arg BASE="$REGISTRY/$tc:$VERSION" -f hack/agent/Dockerfile .
            docker build -t "$REGISTRY/gitea-runner-$tc:$VERSION" --build-arg BASE="$REGISTRY/$tc:$VERSION" -f hack/runner/Dockerfile .
          done
          docker images "$REGISTRY/*"

      - name: Install Helm
        run: |
          make install-helm
          echo "$PWD/bin" >>"$GITHUB_PATH"

      - name: Package the chart
        run: |
          make helm-lint
          helm package dist/chart --version "$VERSION" --app-version "$VERSION" --destination .
          helm template c4-factory "c4-factory-$VERSION.tgz" >rendered.yaml
          grep "image: \"$REGISTRY/operator:$VERSION\"" rendered.yaml
          grep "image: \"$REGISTRY/ui:$VERSION\"" rendered.yaml

      - name: Push the images and the chart
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          for name in operator ui seed base go agent-base agent-go gitea-runner-base gitea-runner-go; do
            docker push "$REGISTRY/$name:$VERSION"
          done
          helm push "c4-factory-$VERSION.tgz" "oci://$REGISTRY/charts"
          helm show chart "oci://$REGISTRY/charts/c4-factory" --version "$VERSION"

      - name: Create the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed lookup fails the release, never notes from the start.
          prev=$(hack/previous-release.sh "$GITHUB_REF_NAME")
          echo "The notes list what merged since ${prev:-the start of history}."
          REPO=$GITHUB_REPOSITORY hack/release-notes.sh "$GITHUB_REF_NAME" "$prev" >notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" "c4-factory-$VERSION.tgz" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
