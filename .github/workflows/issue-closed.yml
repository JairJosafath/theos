name: Issue closed

# A closed issue carries no status/* label. hack/lib/github.sh close and
# duplicate drop them themselves; this catches the rest, such as a merged pull
# request's Closes #N or the close button. Then the plans' parents this issue
# finishes close (hack/lib/github.sh parents --apply N): close runs that too,
# and a close made with this workflow's token starts no workflow, so a parent's
# own parent closes inside that same run.
on:
  issues:
    types: [closed]

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  unstatus:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Drop the issue's status labels
        run: hack/lib/github.sh closed "$ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          THEOS_GITHUB_REPO: ${{ github.repository }}
      - name: Close the plans' parents it finishes
        run: hack/lib/github.sh parents --apply "$ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          THEOS_GITHUB_REPO: ${{ github.repository }}
