# Temporary (#311): find why the local Gitea exits on the runner. Removed before merge.
name: Diag 311
on:
  push:
    branches: [fix/311-main-is-red-tests]
    paths: [.github/workflows/diag-311.yml, hack/gitea-local.sh]
permissions: {}
jobs:
  starts:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: make test-gitea 10 times, each from a fresh .gitea-local
        run: |
          for i in $(seq 1 10); do
            echo "::group::run $i"
            make test-gitea
            hack/gitea-local.sh stop
            rm -rf .gitea-local
            echo "::endgroup::"
            echo "run $i passed"
          done
