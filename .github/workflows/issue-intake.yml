name: Issue intake

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  intake:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Label the issue by its source
        run: hack/lib/github.sh intake "$ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          THEOS_GITHUB_REPO: ${{ github.repository }}
