name: Test Chart

# Installs the Helm chart (dist/chart) into a fresh Kind cluster, as a device
# would: Agent Sandbox, then `helm install` with Gitea and project webshop, on
# images built here, since the code isn't published yet. Checks
# that the seed made its organizations and webshop's credentials, the chart made
# GitProvider webshop/gitea, the three runners registered, the manager and UI are
# ready, and the admission policy refuses a Project named unlike its namespace.
# The go runner runs on the base runner image without its Go cache and with
# the base runner's requests: the Go toolchain is several GB, Release builds
# it, and a hosted runner's two-CPU node has no room for its 500m. The image
# runner runs with the same small requests, for the same node.
# A Kind cluster and the image builds take minutes, so like every workflow that
# needs Kind it runs only on demand (Actions → Test Chart → Run workflow). The
# chart stays checked offline by `make validate-yaml` (helm lint) in `make check`.
on:
  workflow_dispatch:

permissions: {}

jobs:
  test-chart:
    permissions:
      contents: read
    name: Run on Ubuntu
    # On self-hosted runners (make gh-runner) only runner 1 of a device carries
    # c4factory-kind, so a device makes one Kind cluster at a time.
    runs-on: ${{ vars.RUNS_ON == 'self-hosted' && fromJSON('["self-hosted", "c4factory-kind"]') || vars.RUNS_ON || 'ubuntu-latest' }}
    # A cluster and image tags of its own: on a self-hosted runner (make
    # gh-runner) it shares the device's Docker with the Kind pool and its :dev
    # images.
    env:
      IMG: c4factory/operator:chart-test
      UI_IMG: c4factory/ui:chart-test
      SEED_IMG: c4factory/seed:chart-test
      RUNNER_IMG: c4factory/gitea-runner-base:chart-test
      RUNNER_IMAGE_IMG: c4factory/gitea-runner-image:chart-test
      KIND_CLUSTER_NAME: chart-test
      AGENT_SANDBOX: https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.4/sandbox.yaml
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: make helm-lint

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      # A self-hosted runner may still have the one a cancelled run left.
      - name: Create kind cluster
        run: |
          kind delete cluster
          kind create cluster --wait 120s

      - name: Build and load the images
        run: |
          docker build -t "$IMG" .
          docker build -t "$UI_IMG" ui
          docker build -t "$SEED_IMG" -f hack/seed/Dockerfile .
          docker build -t c4factory/base:chart-test hack/toolchain-base
          docker build -t "$RUNNER_IMG" --build-arg BASE=c4factory/base:chart-test -f hack/runner/Dockerfile .
          docker build -t "$RUNNER_IMAGE_IMG" -f hack/runner/Dockerfile.image .
          # The chart doesn't run the agent, but Release builds it; its Go stage
          # fails here, not at a tag, when its ignore file drops a file c4agent needs.
          docker build --target build -f hack/agent/Dockerfile .
          kind load docker-image "$IMG" "$UI_IMG" "$SEED_IMG" "$RUNNER_IMG" "$RUNNER_IMAGE_IMG"

      - name: Install Agent Sandbox
        run: |
          kubectl apply -f "$AGENT_SANDBOX"
          # A CRD applied a moment ago may have no status.conditions yet, and
          # wait fails on it at once instead of waiting; try again until it has.
          for i in $(seq 30); do
            kubectl wait --for=condition=Established crd --all --timeout=60s && break
            [ "$i" -lt 30 ] || exit 1
            sleep 2
          done

      - name: Install the chart
        run: |
          kubectl create namespace webshop
          make helm-deploy HELM_EXTRA_ARGS="--timeout 10m \
            --set ui.image.repository=${UI_IMG%:*} --set ui.image.tag=${UI_IMG##*:} \
            --set gitea.seed.image.repository=${SEED_IMG%:*} --set gitea.seed.image.tag=${SEED_IMG##*:} \
            --set runners.base.image.repository=${RUNNER_IMG%:*} --set runners.base.image.tag=${RUNNER_IMG##*:} \
            --set runners.go.image.repository=${RUNNER_IMG%:*} --set runners.go.image.tag=${RUNNER_IMG##*:} \
            --set runners.go.goCache= \
            --set runners.go.resources.requests.cpu=100m \
            --set runners.go.resources.requests.memory=128Mi \
            --set runners.image.image.repository=${RUNNER_IMAGE_IMG%:*} --set runners.image.image.tag=${RUNNER_IMAGE_IMG##*:} \
            --set runners.image.resources.requests.cpu=100m \
            --set runners.image.resources.requests.memory=128Mi \
            --set gitea.projects={webshop}"

      - name: Check the release
        run: |
          make helm-status
          kubectl -n c4-factory-system get deployments,pods
          kubectl -n c4-factory-system rollout status deployment/c4-factory-ui --timeout=120s
          kubectl -n gitea get deployments,pods
          kubectl -n gitea rollout status deployment/gitea-runner-base --timeout=120s
          kubectl -n gitea rollout status deployment/gitea-runner-go --timeout=120s
          kubectl -n gitea rollout status deployment/gitea-runner-image --timeout=120s
          kubectl -n webshop get gitprovider gitea -o jsonpath='{.spec.url}{"\n"}'
          kubectl -n webshop get secret gitea-credentials
          # The seed's organizations and the registered runners, from Gitea's API.
          kubectl -n gitea port-forward service/gitea 3000:3000 >/dev/null &
          trap 'kill %1' EXIT
          user=$(kubectl -n gitea get secret gitea-admin -o jsonpath='{.data.username}' | base64 -d)
          pass=$(kubectl -n gitea get secret gitea-admin -o jsonpath='{.data.password}' | base64 -d)
          api() { curl -fsS -u "$user:$pass" "http://localhost:3000/api/v1/$1"; }
          for i in $(seq 1 30); do api version >/dev/null 2>&1 && break; sleep 1; done
          api orgs/templates | jq -r .username
          api orgs/webshop | jq -r .username
          for i in $(seq 1 24); do
            runners=$(api admin/actions/runners | jq -r '[.runners[] | select(.status != "offline") | .labels[].name] | sort | join(" ")')
            echo "runners: $runners"
            [ "$runners" = "base go image" ] && break
            sleep 5
          done
          [ "$runners" = "base go image" ]
          # A new admission policy takes a few seconds to apply; until then a
          # misnamed Project gets in, so delete it and try again.
          for i in $(seq 1 12); do
            if ! kubectl -n webshop create -f - <<'EOF' 2>err.txt; then
          apiVersion: c4.factory.io/v1alpha1
          kind: Project
          metadata:
            name: not-webshop
          spec: {}
          EOF
              break
            fi
            kubectl -n webshop delete project not-webshop
            sleep 5
          done
          cat err.txt
          grep -q "must be named after its namespace" err.txt

      - name: Show the logs
        if: failure()
        run: |
          kubectl -n c4-factory-system logs deployment/c4-factory-controller-manager --tail=100 || true
          kubectl -n gitea get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl -n gitea logs job/seed --tail=50 || true
          kubectl -n gitea logs deployment/gitea-runner-base --tail=30 || true

      - name: Delete kind cluster
        if: always() && runner.environment == 'self-hosted'
        run: kind delete cluster
