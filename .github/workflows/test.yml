name: Tests

# Unit and envtest suites, then the Gitea integration tests against a local Gitea
# (make test-gitea). They read the Go code, the generated CRDs, the admission
# policy, the templates (the fake Git host serves them) and the seed, so only
# documentation, the UI and the Kind-only parts of the test environment are left out.
# A pull request to main tests only the packages its change affects
# (hack/test-packages.sh against the base branch); its run is the check
# hack/lib/github.sh land waits for (.github/required-checks). A push to main
# tests every package, with the same paths: while yolo mode merges a pull
# request unchecked (hack/lib/github.sh yolo), this run is what shows a red
# main (#1556). A pushed release tag and a manual run test every package too
# (#1522).
on:
  push:
    branches: [main]
    # The paths filter is not evaluated for a pushed tag (GitHub's rule), so
    # every release tag runs.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - hack/gitea-local.sh
      - hack/seed/seed.sh
      - hack/testenv.mk
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - hack/gitea-local.sh
      - hack/seed/seed.sh
      - hack/testenv.mk
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  workflow_dispatch:

# One group per ref: a pull request, main, or a tag. On a pull request and on
# main a new push cancels the run in progress, so only the newest head counts;
# the runners are the owner's devices, and a superseded head of main needs no
# verdict of its own (#1556). A tag's ref is its own, so no release run is
# ever dropped (hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Tests
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The whole history: hack/test-packages.sh diffs against the merge
          # base with the base branch.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      # A pull request tests the packages its change affects, like land's
      # make check; a push to main, a release tag or a manual run tests every
      # package (#1522, #1556).
      # COVER=1: the coverage each package prints stays in the log; a local
      # make test leaves it out (docs/dev/testenv.md).
      # TEST_TIMEOUT: the self-hosted runners share their device with the relay
      # and sit outside its heavy-job queue (their own clones, in containers),
      # so a loaded device runs every package 4 to 10 times slower. The
      # controller suite's slower half took 529 s on a quiet runner and was
      # halfway after 1170 s at a load of 55 to 90, which ran out of the
      # Makefile's 20m (#1504). 60m gives that run 1.5 times its 2300 s, and
      # still ends a hung spec, naming it, 30 s before.
      - name: Running Tests
        env:
          C4_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
          TEST_ALL: ${{ github.event_name != 'pull_request' && '1' || '' }}
          TEST_BASE: origin/${{ github.base_ref || 'main' }}
          TEST_TIMEOUT: 60m
        run: |
          go mod tidy
          COVER=1 make test

      - name: Slowest controller specs
        if: always()
        env:
          C4_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
        run: cat "$C4_SLOWEST_SPECS" 2>/dev/null || echo "The controller suite wrote no report."

      # The Gitea integration tests install the packages they publish with
      # the real npm and uv; without them the install subtests skip, and
      # the self-hosted runners have neither (#1702). No cache: the installs
      # fetch one package each from the local Gitea.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Gitea integration tests
        run: make test-gitea

      - name: Keep the local Gitea's log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitea-local-log
          path: .gitea-local/log/
          if-no-files-found: ignore

      - name: Stop the local Gitea
        if: always()
        run: hack/gitea-local.sh stop
