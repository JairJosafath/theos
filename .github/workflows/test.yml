name: Tests

# Unit and envtest suites, then the Gitea integration tests against a local Gitea
# (make test-gitea). They read the Go code, the generated CRDs, the admission
# policy, the templates (the fake Git host serves them) and the seed, so only
# documentation, the UI and the Kind-only parts of the test environment are left out.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - hack/gitea-local.sh
      - hack/seed/seed.sh
      - hack/testenv.mk
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  workflow_dispatch:

# One group per commit, so no run is ever dropped and every merge commit on
# main gets its own verdict. Pull requests get no run: a run takes about
# twelve minutes, and hack/lib/github.sh land runs make check on the merged
# tree before it merges (hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      # Every package: make test elsewhere tests only those a change affects,
      # and this run after each merge is the one that catches what that missed.
      - name: Running Tests
        env:
          C4_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
          TEST_ALL: 1
        run: |
          go mod tidy
          make test

      - name: Slowest controller specs
        if: always()
        env:
          C4_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
        run: cat "$C4_SLOWEST_SPECS" 2>/dev/null || echo "The controller suite wrote no report."

      - name: Gitea integration tests
        run: make test-gitea

      - name: Keep the local Gitea's log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitea-local-log
          path: .gitea-local/log/
          if-no-files-found: ignore

      - name: Stop the local Gitea
        if: always()
        run: hack/gitea-local.sh stop
