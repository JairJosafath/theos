name: Tests

# Unit and envtest suites, then the Gitea integration tests against a local Gitea
# (make test-gitea). They read the Go code, the generated CRDs, the admission
# policy, the templates (the fake Git host serves them) and the seed, so only
# documentation, the UI and the Kind-only parts of the test environment are left out.
# Of the UI, the fixtures its tests share with Go's stay in: internal/model's
# TestFactoryReportFixture reads ui/src/model/testdata/report, and a pull
# request that changed a UI rule and that report must run it (#66). A later
# pattern wins, so the path comes after '!ui/**'.
# Every run is partial, against main (#127): its part of make check
# (CHECK_STEPS), selected as make check selects on a device, digitalocean/gta
# for the packages (hack/check.sh). A pull request is compared with its base
# branch; its run is the check hack/lib/github.sh land waits for
# (.github/required-checks). A push to main is compared with main's head
# before the push, with the same paths: while yolo mode merges a pull request
# unchecked (hack/lib/github.sh yolo), this run is what shows a red main
# (#1556). A manual run is compared with main. Nothing here tests every
# package: only a release does, Release's own first job (release.yml).
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - ui/src/model/testdata/**
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - hack/gitea-local.sh
      - hack/seed/seed.sh
      - hack/testenv.mk
      - hack/check.sh
      - hack/check-cache.sh
      - hack/test-packages.sh
      - hack/go-test.sh
      - hack/lib/change.sh
      - hack/gta/**
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - ui/src/model/testdata/**
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - hack/gitea-local.sh
      - hack/seed/seed.sh
      - hack/testenv.mk
      - hack/check.sh
      - hack/check-cache.sh
      - hack/test-packages.sh
      - hack/go-test.sh
      - hack/lib/change.sh
      - hack/gta/**
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  workflow_dispatch:

# One group per pull request, where a new push cancels the run in progress, and
# one per commit on main: a push to main is compared with the head before it,
# so each push needs its own run, and a run that a newer push replaced would
# leave its change untested until a release (#127; hack/check-workflows.sh,
# docs/dev/testenv.md). The runs are partial, so each is small.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # What a run is compared with: a pull request with its base branch, a push
  # to main with main's head before the push, a manual run with main. When
  # that commit is not in the clone (a forced push), the change can't be
  # known and every step runs.
  TEST_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}

jobs:
  test:
    permissions:
      contents: read
    name: Tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: make check diffs against the merge base with
          # TEST_BASE (hack/lib/change.sh).
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      # This job's part of make check, each step only when the change since
      # TEST_BASE can have broken it, like land's make check: manifests and
      # generate, fmt, vet, and the tests of the packages gta selects (#127).
      # COVER=1: the coverage each package prints stays in the log; a local
      # make test leaves it out (docs/dev/testenv.md).
      # TEST_TIMEOUT: the self-hosted runners share their device with the relay
      # and sit outside its heavy-job queue (their own clones, in containers),
      # so a loaded device runs every package 4 to 10 times slower. The
      # controller suite's slower half took 529 s on a quiet runner and was
      # halfway after 1170 s at a load of 55 to 90, which ran out of the
      # Makefile's 20m (#1504). 60m gives that run 1.5 times its 2300 s, and
      # still ends a hung spec, naming it, 30 s before.
      # THEOS_TEST_PROCS: the controller suite is the long pole of every run
      # that reaches it, a quarter of an hour in the 2 processes a device
      # runs it in. One of GitHub's runners has 4 CPUs and 16 GiB to itself,
      # and each process takes about a GiB (docs/dev/devices.md), so there it
      # runs in 4. A self-hosted runner shares its device and keeps
      # hack/go-test.sh's default.
      - name: Running Tests
        env:
          THEOS_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
          TEST_TIMEOUT: 60m
          THEOS_TEST_PROCS: ${{ runner.environment == 'github-hosted' && '4' || '' }}
        run: |
          go mod tidy
          COVER=1 make check CHECK_STEPS="generate fmt vet test"

      - name: Slowest controller specs
        if: always()
        env:
          THEOS_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
        run: cat "$THEOS_SLOWEST_SPECS" 2>/dev/null || echo "The controller suite wrote no report."

      # The Gitea integration tests install the packages they publish with
      # the real npm and uv; without them the install subtests skip, and
      # the self-hosted runners have neither (#1702). No cache: the installs
      # fetch one package each from the local Gitea.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # Only when the change reaches the Gitea adapter, the seed or the local
      # Gitea's script (hack/check.sh): the step says so when it skips them.
      - name: Gitea integration tests
        run: make check CHECK_STEPS=test-gitea

      - name: Keep the local Gitea's log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitea-local-log
          path: .gitea-local/log/
          if-no-files-found: ignore

      - name: Stop the local Gitea
        if: always()
        run: hack/gitea-local.sh stop
