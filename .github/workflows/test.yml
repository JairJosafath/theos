name: Tests

# Unit and envtest suites. They read the Go code, the generated CRDs, the admission
# policy and the templates (the fake Git host serves them), so only documentation,
# the UI and the Kind-only parts of the test environment are left out.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Running Tests
        run: |
          go mod tidy
          make test
