name: Tests

# Unit and envtest suites, then the Gitea integration tests against a local Gitea
# (make test-gitea). They read the Go code, the generated CRDs, the admission
# policy, the templates (the fake Git host serves them) and the seed, so only
# documentation, the UI and the Kind-only parts of the test environment are left out.
# It runs on pull requests to main too, with the same paths: the pull request's
# run is the check hack/lib/github.sh land waits for (.github/required-checks).
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - hack/gitea-local.sh
      - hack/seed/seed.sh
      - hack/testenv.mk
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - '!config/ui/**'
      - '!config/samples/**'
      - '!test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/**'
      - hack/boilerplate.go.txt
      - hack/gitea-local.sh
      - hack/seed/seed.sh
      - hack/testenv.mk
      - '!dev'
      - '!.vscode/**'
      - '!.github/**'
      - .github/workflows/test.yml
  workflow_dispatch:

# On main, one group per commit, so no run is ever dropped and every merge
# commit gets its own verdict. On a pull request, one group per pull request,
# and a new push cancels the run in progress: only the newest head counts
# (hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Tests
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      # Every package: make test elsewhere tests only those a change affects,
      # and this run after each merge is the one that catches what that missed.
      # COVER=1: the coverage each package prints stays in the log; a local
      # make test leaves it out (docs/dev/testenv.md).
      # TEST_TIMEOUT: the self-hosted runners share their device with the relay
      # and sit outside its heavy-job queue (their own clones, in containers),
      # so a loaded device runs every package 4 to 10 times slower. The
      # controller suite's slower half took 529 s on a quiet runner and was
      # halfway after 1170 s at a load of 55 to 90, which ran out of the
      # Makefile's 20m (#1504). 60m gives that run 1.5 times its 2300 s, and
      # still ends a hung spec, naming it, 30 s before.
      - name: Running Tests
        env:
          C4_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
          TEST_ALL: 1
          TEST_TIMEOUT: 60m
        run: |
          go mod tidy
          COVER=1 make test

      - name: Slowest controller specs
        if: always()
        env:
          C4_SLOWEST_SPECS: ${{ runner.temp }}/slowest-specs.txt
        run: cat "$C4_SLOWEST_SPECS" 2>/dev/null || echo "The controller suite wrote no report."

      - name: Gitea integration tests
        run: make test-gitea

      - name: Keep the local Gitea's log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitea-local-log
          path: .gitea-local/log/
          if-no-files-found: ignore

      - name: Stop the local Gitea
        if: always()
        run: hack/gitea-local.sh stop
