name: E2E Tests

# The slowest check: it builds every image and the whole Kind environment. Anything
# that ends up in the cluster counts; documentation, the UI, unit tests and lint
# settings don't.
on:
  push:
    branches: [main]
    paths: &paths
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!ui/**'
      - '!config/ui/**'
      - '!.devcontainer/**'
      - '!**/*_test.go'
      - 'test/e2e/**'
      - '!.golangci.yml'
      - '!.custom-gcl.yml'
      - '!hack/evidence.sh'
      - '!hack/ui.mk'
      - '!.github/**'
      - .github/workflows/test-e2e.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

# A newer push to a pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Build the test environment and run the e2e tests
        run: make e2e
