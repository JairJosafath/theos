name: E2E Tests

# The slowest check: it builds every image and the whole Kind environment. It runs
# only on demand (Actions → E2E Tests → Run workflow): on GitHub's runners it costs
# too much and keeps failing, so pull requests and main skip it for now.
on:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    # On self-hosted runners (make gh-runner) only runner 1 of a device carries
    # c4factory-kind, so a device makes one Kind cluster at a time.
    runs-on: ${{ vars.RUNS_ON == 'self-hosted' && fromJSON('["self-hosted", "c4factory-kind"]') || vars.RUNS_ON || 'ubuntu-latest' }}
    # Not c4factory, the first of the Kind pool: on a self-hosted runner (make
    # gh-runner) it shares the device's Docker with the pool.
    env:
      KIND_CLUSTER: ci-e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Build the test environment and run the e2e tests
        run: make e2e

      - name: Delete kind cluster
        if: always() && runner.environment == 'self-hosted'
        run: kind delete cluster --name "$KIND_CLUSTER"
