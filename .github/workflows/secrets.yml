name: Secrets

# gitleaks (make secrets-scan) over every commit of every ref, from a full
# clone, with the false positives .gitleaks.toml allowlists (#52). It runs on
# every pull request to main and every push to main, so a credential in any
# commit of a pull request fails it before the merge: making the repository
# public publishes the whole history, not only main's head.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One group per branch or pull request: on main a running one finishes; on a
# pull request a new push cancels the run in progress (hack/check-workflows.sh).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  gitleaks:
    permissions:
      contents: read
    name: Secrets
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Clone the code with its whole history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Scan the history for secrets
        run: make secrets-scan
