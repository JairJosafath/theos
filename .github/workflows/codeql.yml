name: CodeQL

# CodeQL's code scanning of the Go code and of the UI's TypeScript (#51,
# docs/openssf.md). It runs on pushes to main and pull requests to main that
# change them, so a finding answers before a change lands, and every Monday,
# so a new query finds what is already there. Its alerts are under the
# repository's Security tab, and a pull request shows the ones it brings.
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - 'ui/**'
      - .github/workflows/codeql.yml
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - 'ui/**'
      - .github/workflows/codeql.yml
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

# One group per branch or pull request: on main a running one finishes, so
# main keeps getting a verdict; on a pull request a new push cancels the run
# in progress (hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  go:
    permissions:
      contents: read
      security-events: write
    name: CodeQL Go
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Start CodeQL for Go
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: autobuild

      - name: Analyze the Go code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go

  typescript:
    permissions:
      contents: read
      security-events: write
    name: CodeQL TypeScript
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start CodeQL for TypeScript
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze the UI's code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
