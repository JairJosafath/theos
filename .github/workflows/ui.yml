name: UI

# The UI is self-contained in ui/.
on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - .github/workflows/ui.yml
  workflow_dispatch:

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    name: Typecheck, lint, test and build
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # A self-hosted runner keeps its npm cache on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
