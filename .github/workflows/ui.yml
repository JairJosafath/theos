name: UI

# The UI is self-contained in ui/. It runs on pull requests to main too, with
# the same paths (hack/check-workflows.sh).
on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - .github/workflows/ui.yml
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - .github/workflows/ui.yml
  workflow_dispatch:

# One group per branch or pull request. On main a running run finishes, so
# main keeps getting a verdict, and GitHub cancels the older pending ones when
# a newer push comes; on a pull request a new push cancels the run in
# progress too (hack/check-workflows.sh, docs/dev/testenv.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    name: UI
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # A self-hosted runner keeps its npm cache on a volume (make gh-runner).
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          node scripts/check-native.mjs

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
