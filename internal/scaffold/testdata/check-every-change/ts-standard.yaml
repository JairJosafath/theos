# Runs the quality contract on every pull request and on main. The branch
# protection of main requires a passing "check" context before a merge.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: go
    env:
      # The runner's /tmp is in memory. npm's cache on its disk stalls the
      # node, and with it the whole cluster.
      npm_config_cache: /tmp/npm-cache
    steps:
      - name: Check out
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" \
            fetch -q --depth 1 "${{ gitea.server_url }}/${{ gitea.repository }}.git" "${{ gitea.sha }}"
          git checkout -q FETCH_HEAD
      # A change to only the changelog, docs/ or images has nothing for the
      # steps below to verify: the job passes without them, so the required
      # "check" context still reports and the change merges. Any other file,
      # a first push, or a base git can't fetch or compare runs them as always.
      - name: What the change touches
        id: changes
        env:
          TOKEN: ${{ gitea.token }}
          URL: ${{ gitea.server_url }}/${{ gitea.repository }}.git
          BASE: ${{ gitea.event.pull_request.base.sha || gitea.event.before }}
        run: |
          code=true
          case $BASE in
          *[!0]*)
            if git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth 1 "$URL" "$BASE" &&
              files=$(git diff --no-renames --name-only "$BASE" HEAD) && [ -n "$files" ] &&
              ! printf '%s\n' "$files" | grep -qvE '^CHANGELOG\.md$|^docs/|\.(png|jpg|gif|svg)$'; then
              code=false
              echo "Only the changelog, docs/ or images changed; skipping the checks."
            fi
            ;;
          esac
          echo "code=$code" >>"$GITHUB_OUTPUT"
      - name: Credentials for the package registries
        if: steps.changes.outputs.code == 'true'
        # The factory's packages (other apps of this project) come from the
        # owner's npm registry and PyPI index, the Git host's own unless the
        # GitProvider's spec.packages names others: then the operator sets
        # these Actions variables and secrets, and empty ones mean the host.
        # npm sends the scope to the registry through ~/.npmrc; uv logs in to
        # the index's host with ~/.netrc. A package the registry lacks fails
        # here instead of being asked of npmjs.org or pypi.org.
        env:
          NPM_SCOPE: ${{ vars.C4_NPM_SCOPE }}
          NPM_REGISTRY: ${{ vars.C4_NPM_REGISTRY }}
          NPM_TOKEN: ${{ secrets.C4_NPM_TOKEN }}
          PYPI_INDEX: ${{ vars.C4_PYPI_INDEX }}
          PYPI_TOKEN: ${{ secrets.C4_PYPI_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          OWNER: ${{ gitea.repository_owner }}
          ACTOR: ${{ gitea.actor }}
          TOKEN: ${{ gitea.token }}
        run: |
          registry=${NPM_REGISTRY:-$SERVER/api/packages/$OWNER/npm/}
          registry=${registry%/}/
          index=${PYPI_INDEX:-$SERVER/api/packages/$OWNER/pypi/simple}
          host=${index#*://}
          umask 077
          printf '%s:registry=%s\n//%s:_authToken=%s\n' "${NPM_SCOPE:-@c4factory}" "$registry" "${registry#*://}" "${NPM_TOKEN:-$TOKEN}" > "$HOME/.npmrc"
          printf 'machine %s\nlogin %s\npassword %s\n' "${host%%/*}" "$ACTOR" "${PYPI_TOKEN:-$TOKEN}" > "$HOME/.netrc"
      - name: make check
        if: steps.changes.outputs.code == 'true'
        run: make check
