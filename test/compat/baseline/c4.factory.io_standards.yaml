---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: standards.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    - c4catalog
    kind: Standard
    listKind: StandardList
    plural: standards
    singular: standard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.supportedFrameworks
      name: Frameworks
      type: string
    - jsonPath: .spec.template.ref
      name: Ref
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Standard is a catalog entry: the coding rules and checks of a Container. It is
          rendered as a layer right after the Framework. It is owned by the Project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the template, and the Container types and Frameworks
              it supports
            properties:
              checksBeforeRelease:
                description: |-
                  checksBeforeRelease says the Standard's templates can run the full check
                  only before a release: a light check on each change when a Container asks
                  for checks BeforeRelease, and the full one on a release-check/** branch.
                  Without it, its Containers run the full check on every change.
                type: boolean
              description:
                description: description says what this entry adds to a Container.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name.
                maxLength: 100
                type: string
              protectedPaths:
                description: |-
                  protectedPaths are the Standard's files that agents must not change, such as
                  the check contract and lint configuration: a file path, or a directory ending
                  in "/". The Git host refuses to merge pull requests that change them, next to
                  the paths the platform always protects (.gitea/, .devcontainer/, .c4factory.yaml).
                items:
                  pattern: ^[^/*?\[\]][^*?\[\]]*$
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              supportedFrameworks:
                description: supportedFrameworks lists the Frameworks, by name, whose
                  code this Standard can check.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              supportedTypes:
                description: supportedTypes lists the Container types this entry can
                  scaffold.
                items:
                  description: ContainerType is the fixed list of application shapes
                    a Container can take.
                  enum:
                  - static-site
                  - service
                  - job
                  - worker
                  - mobile-app
                  - cli
                  - extension
                  - operator
                  - function
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              template:
                description: template is the repository and pinned ref to scaffold
                  from.
                properties:
                  ref:
                    description: ref is a tag or a full commit SHA, never a branch.
                    maxLength: 255
                    minLength: 1
                    type: string
                  url:
                    description: url of the template's Git repository.
                    pattern: ^https?://
                    type: string
                required:
                - ref
                - url
                type: object
            required:
            - supportedFrameworks
            - supportedTypes
            - template
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
