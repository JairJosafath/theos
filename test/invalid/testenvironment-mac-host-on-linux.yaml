# expect: mac is for an EC2 Mac instanceType
apiVersion: theos.factory.io/v1beta1
kind: TestEnvironment
metadata:
  name: gpu
  namespace: webshop
spec:
  description: A GPU machine on AWS with a Mac's host settings.
  aws:
    region: eu-west-1
    instanceType: g5.xlarge
    mac:
      keepHostHours: 48
    imageId: ami-0123456789abcdef0
    subnetId: subnet-0123456789abcdef0
    credentialsSecretRef:
      name: gpu-aws
  limits:
    budgetUSDPerDay: 10
