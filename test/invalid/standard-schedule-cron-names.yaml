# expect: spec.schedules[0].cron in body should match '^[0-9*/,-]+( [0-9*/,-]+){4}$'
apiVersion: theos.factory.io/v1beta1
kind: Standard
metadata:
  name: go-standard
  namespace: webshop
spec:
  displayName: Go quality standard
  supportedTypes: [cli]
  supportedFrameworks: [go-cli]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/go-standard
    ref: v1.7.0
  schedules:
    - name: dependencies
      cron: "0 6 * * MON"
      goal: Update the dependencies that have a new minor or patch version.
