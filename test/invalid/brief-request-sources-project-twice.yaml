# expect: at most one request source per Jira site and project: an item is read once
apiVersion: theos.factory.io/v1beta1
kind: Brief
metadata:
  name: cel-lens
  namespace: webshop
spec:
  idea: A linter for CEL rules.
  requestSources:
  - name: support
    jira:
      site: https://acme.atlassian.net
      cloudID: 00000000-0000-4000-8000-000000000000
      project: SHOP
      label: factory
    credentialsSecretRef: {name: acme-jira}
  - name: shop
    jira:
      site: https://Acme.atlassian.net
      cloudID: 00000000-0000-4000-8000-000000000000
      project: shop
      label: shop
    credentialsSecretRef: {name: acme-jira}
