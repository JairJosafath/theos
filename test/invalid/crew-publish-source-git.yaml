# expect: path must have no '.', '..' or '.git' folder in it
apiVersion: c4.factory.io/v1beta1
kind: Crew
metadata:
  name: engine
  namespace: webshop
spec:
  containerRef:
    name: engine
  implementer:
    name: claude-implementer
  reviewer:
    name: claude-reviewer
  tagReleases: true
  publishReleases:
    github:
      repository: acme/cel-lens
      tokenSecretRef:
        name: cel-lens-github
    source:
      path: .git/hooks
