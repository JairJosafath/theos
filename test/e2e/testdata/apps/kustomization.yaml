# The e2e fixture: one Go Container scaffolded from the seeded templates.
# Needs `make gitea seed runner-go agent-sandbox agent-image-go` first. The stand-in
# Task in tasks/ is applied by the e2e test itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
- namespace.yaml
- project.yaml
- factory.yaml
- story.yaml
