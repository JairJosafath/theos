# Who uses what, and what it is made of: one sample Go command-line tool for the e2e agent loop.
apiVersion: c4.factory.io/v1alpha1
kind: Person
metadata:
  name: tool-user
spec:
  displayName: Tool user
  description: Someone who runs the sample tool.
---
apiVersion: c4.factory.io/v1alpha1
kind: SoftwareSystem
metadata:
  name: sample-tools
spec:
  displayName: Sample tools
  description: A sample Go command-line tool for the e2e agent loop.
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: tool-user-uses-sample-tools
spec:
  source: {kind: Person, name: tool-user}
  target: {kind: SoftwareSystem, name: sample-tools}
  description: Runs the tool
---
apiVersion: c4.factory.io/v1alpha1
kind: Container
metadata:
  name: hello-cli
spec:
  softwareSystemRef:
    name: sample-tools
  displayName: Hello CLI
  description: A sample Go command-line tool for the e2e agent loop.
  type: cli
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: go-cli
  standardRef:
    name: go-standard
  deploymentRef:
    name: gitea-release