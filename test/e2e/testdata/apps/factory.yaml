# Where repositories go, the Go catalog, and the Agents that do Tasks.
# Templates are pinned to tags pushed by the seed job (templates/versions.txt).
apiVersion: c4.factory.io/v1alpha1
kind: GitProvider
metadata:
  name: gitea
spec:
  provider: gitea
  url: http://gitea.gitea.svc.cluster.local:3000
  owner: apps
  credentialsSecretRef:
    name: gitea-credentials
---
apiVersion: c4.factory.io/v1alpha1
kind: Framework
metadata:
  name: go-cli
spec:
  displayName: Go command-line program
  description: A Go program with a testable entry point, internal packages and a version flag.
  supportedTypes: [cli]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/go-cli
    ref: v1.0.0
---
apiVersion: c4.factory.io/v1alpha1
kind: Standard
metadata:
  name: go-standard
spec:
  displayName: Go quality standard
  description: Strict golangci-lint, gofumpt, race-checked tests, role guides for agents and the make check CI.
  supportedTypes: [cli]
  supportedFrameworks: [go-cli]
  # The quality contract: agents fix the code, not the rules it is checked by.
  protectedPaths: [AGENTS.md, Makefile, .golangci.yml, .editorconfig, docs/style/, docs/agents/]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/go-standard
    ref: v1.1.1
---
apiVersion: c4.factory.io/v1alpha1
kind: Deployment
metadata:
  name: gitea-release
spec:
  displayName: Release files on a Gitea release
  description: On a version tag, CI runs make dist and attaches the files in dist/ to the release.
  supportedTypes: [cli]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/gitea-release
    ref: v1.0.0
---
# Claude Code on the Go toolchain. Needs Secret claude-credentials with
# CLAUDE_CODE_OAUTH_TOKEN: make claude-secret CLAUDE_TOKEN=...
apiVersion: c4.factory.io/v1alpha1
kind: Agent
metadata:
  name: claude
spec:
  displayName: Claude Code (Go)
  description: Implements and reviews Go programs.
  image: c4factory/agent-go:dev
  credentialsSecretRef:
    name: claude-credentials
  maxRounds: 4
  timeoutMinutes: 90
  # A CPU limit keeps a Go build from taking every core of the
  # Kind node. A Task reviews each round after implementing it, so the
  # implementer's 4 serves both roles.
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 6Gi}
---
# A stand-in that makes a scripted change and approves it: proves the loop
# without spending tokens.
apiVersion: c4.factory.io/v1alpha1
kind: Agent
metadata:
  name: stand-in
spec:
  displayName: Stand-in agent
  description: Adds a line to STAND-IN.md; asks for changes once, then approves.
  image: c4factory/agent-go:dev
  maxRounds: 2
  timeoutMinutes: 15
  # Its implement rounds still run make check, the Go build and tests.
  resources:
    requests: {cpu: "1"}
    limits: {cpu: "4"}
  env:
    - name: C4AGENT_FAKE
      value: "1"
    - name: C4AGENT_FAKE_CHANGES_FIRST
      value: "true"
