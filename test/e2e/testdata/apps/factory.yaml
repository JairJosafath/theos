# Where repositories go, the hello-world page catalog, and the stand-in Agent that does Tasks.
# Templates are pinned to tags pushed by the seed job (templates/versions.txt).
apiVersion: c4.factory.io/v1alpha1
kind: GitProvider
metadata:
  name: gitea
spec:
  provider: gitea
  url: http://gitea.gitea.svc.cluster.local:3000
  owner: apps
  credentialsSecretRef:
    name: gitea-credentials
---
apiVersion: c4.factory.io/v1alpha1
kind: Framework
metadata:
  name: hello-html
spec:
  displayName: Hello world page
  description: An index.html that says hello, world, and the make check that greps it.
  supportedTypes: [static-site]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/hello-html
    ref: v1.0.0
---
apiVersion: c4.factory.io/v1alpha1
kind: Standard
metadata:
  name: hello-html-standard
spec:
  displayName: Hello world page standard
  description: The agents' role guides for the hello-world page.
  supportedTypes: [static-site]
  supportedFrameworks: [hello-html]
  # The quality contract: agents fix the code, not the rules it is checked by.
  protectedPaths: [Makefile]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/hello-html-standard
    ref: v1.0.0
---
# A stand-in that makes a scripted change and approves it: proves the loop
# without spending tokens. Every Agent here runs on the stand-in and names no
# credentials Secret; the suite's BeforeSuite fails otherwise (test/e2e/standin).
apiVersion: c4.factory.io/v1alpha1
kind: Agent
metadata:
  name: stand-in
spec:
  displayName: Stand-in agent
  description: Adds a line to STAND-IN.md; asks for changes once, then approves.
  image: c4factory/agent-base:dev
  harness: stand-in
  maxRounds: 2
  timeoutMinutes: 15
  # Its implement rounds still run make check.
  resources:
    requests: {cpu: 100m}
    limits: {cpu: "1"}
  env:
    - name: C4AGENT_FAKE_CHANGES_FIRST
      value: "true"
