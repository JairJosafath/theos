version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
        # The layering in docs/architecture.md. Business rules stay pure.
        business-rules-are-pure:
          files:
            - "**/internal/model/**"
            - "**/internal/scaffold/**"
          deny:
            - pkg: k8s.io
              desc: business rules must not import Kubernetes (docs/architecture.md)
            - pkg: sigs.k8s.io
              desc: business rules must not import controller-runtime or other Kubernetes libraries (docs/architecture.md)
            - pkg: net/http
              desc: business rules must not do I/O over HTTP; that belongs in an adapter, internal/adapters (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/api
              desc: business rules take plain values; controllers convert resources (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: business rules must not depend on controllers (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/adapters
              desc: business rules must not depend on adapters (docs/architecture.md)
        model-is-the-bottom:
          files:
            - "**/internal/model/**"
          deny:
            - pkg: github.com/JairJosafath/theos/internal/scaffold
              desc: model is the lowest layer; scaffold builds on it (docs/architecture.md)
        # internal/taskfacts reads the API's Task for the operator and for a
        # devcontainer's command (#142, #204): the API's types, apimachinery
        # and internal/model, and nothing of controller-runtime, the
        # controllers or the adapters, so the command links without the operator.
        taskfacts-stays-light:
          files:
            - "**/internal/taskfacts/**"
          deny:
            - pkg: sigs.k8s.io/controller-runtime
              desc: taskfacts is linked by commands that run without the operator; it must not import controller-runtime (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: taskfacts must not depend on controllers (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/adapters
              desc: taskfacts must not depend on adapters (docs/architecture.md)
        # Argo CD's adapter talks to the cluster; the Git host's, the
        # releases', the chat's, Linear's and Jira's adapters don't.
        adapters-stay-out-of-kubernetes:
          files:
            - "**/internal/adapters/gitea/**"
            - "**/internal/adapters/git/**"
            - "**/internal/adapters/github/**"
            - "**/internal/adapters/gitlab/**"
            - "**/internal/adapters/jira/**"
            - "**/internal/adapters/linear/**"
            - "**/internal/adapters/matrix/**"
            - "**/internal/adapters/packages/**"
            - "**/internal/adapters/slack/**"
          deny:
            - pkg: k8s.io
              desc: adapters must not import Kubernetes (docs/architecture.md)
            - pkg: sigs.k8s.io
              desc: adapters must not import controller-runtime (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/api
              desc: adapters take plain values (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: adapters must not depend on controllers (docs/architecture.md)
        ports-are-plain-go:
          files:
            - "**/internal/ports/**"
          deny:
            - pkg: k8s.io
              desc: ports are plain Go; the controllers convert resources (docs/architecture.md)
            - pkg: sigs.k8s.io
              desc: ports are plain Go (docs/architecture.md)
            - pkg: net/http
              desc: ports do no I/O; that belongs in an adapter (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/api
              desc: ports take plain values (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/adapters
              desc: ports must not depend on adapters (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: ports must not depend on controllers (docs/architecture.md)
        adapters-take-plain-values:
          files:
            - "**/internal/adapters/**"
          deny:
            - pkg: github.com/JairJosafath/theos/api
              desc: adapters take plain values (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: adapters must not depend on controllers (docs/architecture.md)
        controllers-take-ports:
          files:
            - "**/internal/controller/**"
            - "**/internal/sessionclient/**"
            - "**/internal/chatbot/**"
            - "!$test"
          deny:
            - pkg: github.com/JairJosafath/theos/internal/adapters
              desc: controllers take ports; only cmd/main.go builds adapters, and tests wire them onto fakes (docs/architecture.md)
        runner-has-no-cluster-access:
          files:
            - "**/internal/agentrunner/**"
            - "**/cmd/theos-agent/**"
          deny:
            - pkg: k8s.io
              desc: the sandbox runner has no Kubernetes credentials; it reports through its termination message (docs/architecture.md)
            - pkg: sigs.k8s.io
              desc: the sandbox runner has no Kubernetes credentials (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/api
              desc: the runner takes plain values from its environment (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: the runner must not depend on controllers (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/adapters
              desc: the runner uses git and its token only; the operator talks to the Git host API (docs/architecture.md)
        test-environment-tool-stands-alone:
          files:
            - "**/cmd/theos-env/**"
          deny:
            - pkg: k8s.io
              desc: theos-env runs in sandboxes and test environments, which have no Kubernetes credentials (docs/plans/done/test-environments.md)
            - pkg: sigs.k8s.io
              desc: theos-env needs no cluster access (docs/plans/done/test-environments.md)
            - pkg: github.com/JairJosafath/theos/api
              desc: theos-env takes plain values from its environment (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: theos-env must not depend on controllers (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/adapters
              desc: theos-env talks to the environment it leased alone, never to the Git host or a provider (docs/architecture.md)
        model-proxy-stands-alone:
          files:
            - "**/internal/modelproxy/**"
            - "**/cmd/model-proxy/**"
          deny:
            - pkg: k8s.io
              desc: the model proxy reads one Secret file and forwards to one upstream; it needs no cluster access (docs/architecture.md)
            - pkg: sigs.k8s.io
              desc: the model proxy needs no cluster access (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/api
              desc: the model proxy knows no resources; it takes its flags and one Secret file (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/controller
              desc: the model proxy must not depend on controllers (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal/adapters
              desc: the model proxy talks to the Claude API only, never to the Git host (docs/architecture.md)
        model-proxy-handler-is-a-leaf:
          files:
            - "**/internal/modelproxy/**"
          deny:
            - pkg: github.com/JairJosafath/theos/internal
              desc: the model proxy's handler uses the standard library only (docs/architecture.md)
        oci-is-plain-go:
          files:
            - "**/internal/oci/**"
          deny:
            - pkg: k8s.io
              desc: internal/oci pushes and copies images over go-containerregistry; it needs no cluster access (docs/architecture.md)
            - pkg: sigs.k8s.io
              desc: internal/oci needs no cluster access (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/api
              desc: internal/oci takes plain values; its callers convert resources (docs/architecture.md)
            - pkg: github.com/JairJosafath/theos/internal
              desc: internal/oci is a leaf; adapters use it, it uses none of ours (docs/architecture.md)
        api-stands-alone:
          files:
            - "**/api/**"
          deny:
            - pkg: github.com/JairJosafath/theos/internal
              desc: API types must not import internal packages (docs/architecture.md)
    gosec:
      excludes:
        # Counts, rounds and issue numbers go from int into the API's int32
        # fields, as Kubernetes API conventions ask; none comes near 2^31.
        - G115
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Table tests repeat literals on purpose.
      - linters:
          - goconst
        path: _test\.go
      # Tests run on fixtures: fake tokens, temporary files, httptest servers
      # and fake git objects. gosec guards the code that ships.
      - linters:
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
