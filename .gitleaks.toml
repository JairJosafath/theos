# gitleaks (make secrets-scan, the Secrets workflow; #52): its default rules,
# and the findings checked and found to be no secret.
[extend]
useDefault = true

[allowlist]
description = "Checked false positives (#52)"
paths = [
  # CDK asset names in the CloudFormation adapter's fixtures: the SHA-256 of a
  # bundle used as an S3 object key ("objectKey", "S3Key"), not a credential.
  '''internal/adapters/cloudformation/testdata/aws-[a-z0-9-]+/[^/]+\.(assets|template)\.json''',
]
