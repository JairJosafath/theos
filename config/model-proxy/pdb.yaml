# A rollout or a node drain keeps one proxy serving, so agents' streams go on.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-proxy
  namespace: system
  labels:
    app.kubernetes.io/name: c4-model-proxy
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c4-model-proxy
