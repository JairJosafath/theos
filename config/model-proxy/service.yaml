apiVersion: v1
kind: Service
metadata:
  name: model-proxy
  namespace: system
  labels:
    app.kubernetes.io/name: c4-model-proxy
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: c4-model-proxy
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
