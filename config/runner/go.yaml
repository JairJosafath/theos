# The Go and Node runner: the Gitea runner on the Go and Node toolchain
# (hack/toolchain-go), labelled go, for Containers written in Go or TypeScript.
# It has uv too, so a Python project checks and releases here as well.
# `make runner-go` builds it and applies this, it is applied by that target alone.
# Its init container registers with the token the seed Job stores in Secret
# gitea/gitea-runner; the runner container, where jobs run, never gets it.
# config/runner/network-policy.yaml fences it.
#
# Jobs keep their Go build cache on the node (/var/cache/c4factory/go/ci), so a
# job compiles only what changed since the last. Only this runner mounts it:
# Go trusts what it reads from its cache, and agent sandboxes, which run
# untrusted code, share a sibling of their own (the operator's
# --sandbox-go-cache). c4-go-cache (hack/toolchain-go) seeds it from the image's
# warm cache and keeps it under 8 GB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-go-env
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: c4factory-testenv
data:
  # Read by the runner for every job (env_file in hack/runner/config.yaml).
  job.env: |
    GOCACHE=/cache/go/build
    GOLANGCI_LINT_CACHE=/cache/go/golangci-lint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner-go
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: c4factory-testenv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner-go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner-go
        app.kubernetes.io/part-of: c4factory-testenv
        # The CI fence selects it: config/runner/network-policy.yaml.
        app.kubernetes.io/component: ci-runner
    spec:
      automountServiceAccountToken: false
      initContainers:
        # Registers the runner, writing /data/.runner: the only container given
        # the registration token, which the jobs in the runner container must
        # not read (hack/runner/register.sh).
        - name: register
          image: c4factory/gitea-runner-go:dev
          imagePullPolicy: Never
          command: [c4-runner-register]
          env:
            - name: GITEA_INSTANCE
              value: http://gitea.gitea.svc.cluster.local:3000
            - name: RUNNER_TOKEN
              valueFrom: {secretKeyRef: {name: gitea-runner, key: token}}
            - name: RUNNER_LABELS
              value: go:host
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
        - name: go-cache
          image: c4factory/gitea-runner-go:dev
          imagePullPolicy: Never
          command: [c4-go-cache, /cache/go]
          volumeMounts:
            - name: go-cache
              mountPath: /cache/go
      containers:
        - name: runner
          image: c4factory/gitea-runner-go:dev
          imagePullPolicy: Never
          # A job takes at most 4 of the node's cores, so a build can't starve etcd,
          # the API server and Gitea: docs/dev/devices.md, "CPU on the cluster device".
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "4", memory: 6Gi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: work
              mountPath: /data/work
            - name: tmp
              mountPath: /tmp
            - name: go-cache
              mountPath: /cache/go
            - name: job-env
              mountPath: /etc/gitea-runner/job.env
              subPath: job.env
        # Keeps the cache under its bound between jobs; Go drops nothing for five days.
        - name: go-cache-trim
          image: c4factory/gitea-runner-go:dev
          imagePullPolicy: Never
          command: [sh, -c, "while sleep 3600; do c4-go-cache /cache/go; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: go-cache
              mountPath: /cache/go
      volumes:
        - name: data
          emptyDir: {}
        # Checkouts and test output in memory, to spare the disk: disk
        # writes stall etcd on a laptop. The build cache is on the node (above).
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: go-cache
          hostPath: {path: /var/cache/c4factory/go/ci, type: DirectoryOrCreate}
        - name: job-env
          configMap: {name: gitea-runner-go-env}
