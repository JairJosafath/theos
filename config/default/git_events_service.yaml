# The receiver of Gitea's deliveries: each GitProvider's organization hook
# POSTs to http://theos-git-events.theos-system.svc:8082/git-events/<namespace>/<name>,
# signed with that GitProvider's own Secret, which the operator makes
# (docs/plans/git-events.md, decision 10). The chart's copy is
# dist/chart/templates/git-events.
apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: theos
    app.kubernetes.io/managed-by: kustomize
  name: git-events
  namespace: system
spec:
  ports:
  - name: http
    port: 8082
    protocol: TCP
    targetPort: git-events
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: theos
