# The CEL Lens story: agents build a CEL language server and a VS Code extension
# from a backlog of Gitea issues. Needs `make gitea seed runner-go agent-sandbox
# agent-image-go` first, and for the real agents `make claude-secret
# CLAUDE_NAMESPACE=cel-lens CLAUDE_TOKEN=...`. Then `make cel-lens-backlog` files
# the issues, and crews/ puts the Crews to work.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cel-lens
resources:
- namespace.yaml
- project.yaml
- factory.yaml
- story.yaml
