apiVersion: c4.factory.io/v1alpha1
kind: Task
metadata:
  name: bg-eraser-v1
  namespace: toolbox
spec:
  containerRef: {name: bg-eraser}
  agentRef: {name: claude}
  goal: |
    Build version 1 of Background Eraser: remove photo backgrounds on the phone.
    - Pick a photo; cut out the person automatically.
    - Refine by hand: erase and restore brushes with adjustable size, zoom and
      pan, undo and redo.
    - Replace the background: transparent, a solid colour, or a blur of the original.
    - Export PNG (transparent) or JPEG at the original resolution; save and share.
    Suggested packages: google_mlkit_selfie_segmentation (its model is bundled, so it
    works offline; subject segmentation is NOT offline, don't use it), image,
    image_picker, share_plus. Heavy work stays off the UI thread. Keep the release
    manifest free of the INTERNET permission.
