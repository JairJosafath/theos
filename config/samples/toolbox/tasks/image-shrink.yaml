apiVersion: c4.factory.io/v1alpha1
kind: Task
metadata:
  name: image-shrink-v1
  namespace: toolbox
spec:
  containerRef: {name: image-shrink}
  agentRef: {name: claude}
  goal: |
    Build version 1 of Image Shrink: shrink photos for forms and messages.
    - Pick one or more images from the gallery (system picker, no storage permission).
    - Three ways to shrink: a quality slider, a maximum width/height, or a target
      file size in KB (search the quality that gets under it, and say when even the
      lowest quality can't).
    - Output as JPEG, PNG or WebP; option to strip EXIF metadata (location), on by default.
    - Before/after preview with original size, new size and percent saved.
    - Save results to the gallery and share them through the share sheet.
    - Handle cancelled picks, huge images, corrupt files and zero results with
      clear messages; heavy work stays off the UI thread.
    Suggested packages: flutter_image_compress, image, image_picker, share_plus, gal.
    Keep the release manifest free of the INTERNET permission.
