# The toolbox story: agents build six offline tool apps (Pocket Tools). Needs
# `make gitea seed runner agent-sandbox agent-image` first, and, for the real
# agent, `make claude-secret CLAUDE_TOKEN=...`. Tasks live in tasks/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: toolbox
resources:
- namespace.yaml
- project.yaml
- factory.yaml
- story.yaml
