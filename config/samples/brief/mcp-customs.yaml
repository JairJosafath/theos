# MCP Customs, the factory's first real project from outside the factory
# (docs/plans/mcp-customs.md): an entry for the AWS "No Pipeline, No Problem"
# weekend challenge, planned and built by the Crew from these words alone.
# Needs the chart installed with gitea.projects={mcp-customs}, which makes the
# catalog, the Agents and the GitProvider, and Secret claude-credentials,
# which you create yourself.
# Apply with: kubectl apply -f config/samples/brief/mcp-customs.yaml
apiVersion: theos.factory.io/v1beta1
kind: Brief
metadata:
  name: mcp-customs
  namespace: mcp-customs
spec:
  idea: >-
    MCP Customs checks an MCP server before an AI agent may use it. Scanners
    read what a server says; MCP Customs runs it and watches what it does. A
    developer or platform team submits a pinned Go module, npm or PyPI
    package, or a remote URL, on a web page or through an API, and gets pass,
    review or block with a report that says why, and for a package an install
    spec to copy: version, integrity and the approved tool list's hash.

    The check is a Go AWS Lambda durable function (Durable Execution SDK for
    Go v1, provided.al2023, arm64, us-east-2). Code does all that code can
    decide: resolve the package, look up earlier verdicts by the hash of its
    whole resolved dependency set, install it in the sandbox as a recorded
    phase, list tools, resources and prompts, run probes, scan all server text
    (descriptions, full schemas, tool results, resources, prompts) for hidden
    characters (ANSI escapes, Unicode tag and zero-width characters) and known
    injection patterns, and apply every verdict rule. An Amazon Bedrock model,
    through a JSON Schema tool, does only what code can't: it writes realistic
    probe arguments with canaries planted; judges whether behaviour fits the
    server's stated purpose and whether server text instructs the model; and
    when something does not add up, investigates one registered action per
    turn, at most eight: probe again, read the source that opened a
    connection, inspect a download, run again with the clock moved forward,
    ask a human. Server text reaches the model fenced as evidence, never as
    instructions. Each action is one durable operation (Step, Map,
    WaitForCallback, Wait); every model call, clock read and lookup runs
    inside a step.

    The server runs in an AWS Lambda MicroVM. A Go harness runs as root; the
    server runs as an unprivileged user in a home that looks like a
    developer's laptop (fake ~/.ssh, ~/.aws, .npmrc, git history), with no
    Lambda variables and a common MCP client name. Canaries are fresh per run
    and in real formats. All egress goes through the harness: DNS is logged,
    TLS is intercepted with the harness's own CA, hosts the model expects for
    the purpose pass, others get fake answers, and each canary is searched for
    plain, base64, hex and URL-encoded. The harness offers sampling and
    elicitation and records each request. A remote URL is reached only from
    the sandbox, never from the Checker, and its OAuth metadata is linted.

    Rules the model cannot clear: a canary leaving, a write to an agent config
    or shell startup file, an unexplained sampling or elicitation request, or
    hidden characters means block or a human. The model may make a verdict
    stricter, never looser; an error or running out of turns gives review. A
    remote server is at most "attested": this tool list, at this time. A
    server is checked again when a new version is published or a remote tool
    list changes.

    The web page is server-rendered Go (html/template, a little JavaScript)
    behind the same API: submit, watch the steps, read the report with server
    text shown escaped, Approve or Block. Checks, verdicts and tool lists live
    in DynamoDB, reports in S3; all scales to zero. All code is Go, in small
    files and short functions. Two demo servers, Go modules: a weather tool
    with clean descriptions whose results tell the agent to resend with the
    SSH key, and which posts to a host it looks up at runtime only when its
    arguments hold a secret; and a mail tool whose v1.0.1 adds one line that
    copies every message to an outside host.
