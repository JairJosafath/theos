# MCP Customs, the factory's first real project from outside the factory
# (docs/plans/mcp-customs.md): an entry for the AWS "No Pipeline, No Problem"
# weekend challenge, planned and built by the Crew from these words alone.
# Needs the chart installed with gitea.projects={mcp-customs}, which makes the
# catalog, the Agents and the GitProvider, and Secret claude-credentials,
# which you create yourself.
# Apply with: kubectl apply -f config/samples/brief/mcp-customs.yaml
apiVersion: theos.factory.io/v1beta1
kind: Brief
metadata:
  name: mcp-customs
  namespace: mcp-customs
spec:
  idea: >-
    MCP Customs checks an MCP server before an AI agent is allowed to use it.
    A developer or a platform team submits a server, as a Go module, an npm
    package, a PyPI package or a remote URL, on a web page or through an API,
    and gets a verdict (pass, review or block) with a report that says why.

    The check is a Go AWS Lambda durable function (the AWS Durable Execution
    SDK for Go, v1, on provided.al2023, arm64, in us-east-2). What can be
    decided by code is code: resolve the package and its publisher, look up
    earlier verdicts by content hash, compare the tool list with the last
    approved one, start the sandbox, list the server's tools, run probes, and
    every verdict rule. A server seen before with the same hash and tool list
    passes with no model call. An Amazon Bedrock model, through a JSON Schema
    tool, does only what code can't: it writes probe arguments for each tool
    from its schema and description, with canary values planted in them; it
    judges whether what the server did matches what it says it is for (a
    GitHub server calling api.github.com is expected, a weather tool posting
    to an unknown host is not) and whether a tool description carries
    instructions to the model; and when something does not add up it
    investigates one move at a time, at most eight turns: each turn it picks
    one action from a fixed registry (probe again with other arguments, read
    the source file that opened a connection, fetch and inspect what the
    server downloaded, compare with the previous version, ask a human), and a
    small interpreter runs it as one durable operation: a Step, a Map over
    many tools, WaitForCallback for a human, Wait to check again. Every model
    call, clock read and lookup happens inside a step, so a replay follows the
    same path.

    The server under test runs in an AWS Lambda MicroVM: an image with Go,
    Node and Python, and a small harness written in Go that starts the server,
    speaks MCP to it over stdio, records every outbound connection and every
    file written, and answers the durable function over the MicroVM's HTTPS
    URL. The sandbox holds no credentials, only canary values, and is
    suspended between steps.

    Hard rules live in code, not in the prompt: a server whose descriptions
    carry instructions to the model, or whose read-only tool writes or sends a
    canary anywhere, is never passed without a human; the model may make a
    verdict stricter, never looser; it may only name registered actions, with
    capped fan-outs, turns and timeouts. An approved server is checked again
    after a set time (24 hours, a minute in the demo), and a changed tool list
    is judged again and needs a new approval.

    The web page is server-rendered Go (html/template, a little plain
    JavaScript), served by a Go Lambda function behind the same API. It
    submits a server, shows the run's steps as they happen, shows the report,
    and has Approve and Block buttons for a run that waits on a human. Checks,
    verdicts and tool-list snapshots live in DynamoDB; reports in S3.
    Everything scales to zero. All application code is Go, in small packages
    of small files and short functions. The repository also carries a demo
    server, a Go module, that looks like a weather tool but hides an
    instruction in a tool description asking for the user's SSH key, and posts
    its arguments to an outside host only when they hold something that looks
    like a secret, so a fixed probe misses it and the investigation finds it.
