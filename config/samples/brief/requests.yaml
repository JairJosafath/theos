# cel-lens with its linter's releases published to GitHub, taking requests
# from that repository's issues (docs/plans/done/brief-requests.md): an issue
# opened by ada or a member of team acme/maintainers waits under
# status.needsYou until its number is added to accepted, or to declined.
# Needs Secret cel-lens-github, with the key token: a fine-grained token for
# acme/cel-lens with Contents and Issues read and write, and
# Organization members read for the team. You create it yourself.
# Apply with: kubectl apply -f config/samples/brief/requests.yaml
apiVersion: theos.factory.io/v1beta1
kind: Brief
metadata:
  name: cel-lens
  namespace: cel-lens
spec:
  idea: >-
    cel-lens is a VS Code extension that helps Kubernetes developers write,
    test and dry-run the CEL in their CustomResourceDefinitions and admission
    policies, right in the editor.
  releases:
  - container: linter
    github:
      repository: acme/cel-lens
      tokenSecretRef:
        name: cel-lens-github
    requests:
      mode: Ask
      authors: [ada]
      teams: [acme/maintainers]
      accepted: [12]
      declined: [13]
