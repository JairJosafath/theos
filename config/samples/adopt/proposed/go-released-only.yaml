# go-released-only, a repository the factory adopts as it is: nothing is scaffolded or rewritten.
# Read from the repository: Go.
# Look at this: None of the workflows under .github/workflows/ runs on a pull request: nothing checks a change before it merges. Add "pull_request" to the one that tests.
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: billing-core
  namespace: billing
spec:
  displayName: billing-core
---
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: go-released-only
  namespace: billing
spec:
  softwareSystemRef:
    name: billing-core
  displayName: go-released-only
  type: cli
  gitProviderRef:
    name: git
  adopt: true
  checkCommand: go test ./...
---
# Start small: the Crew holds every change for a person. Loosen it rule by
# rule (docs/getting-started.md, "Start small").
apiVersion: theos.factory.io/v1beta1
kind: Crew
metadata:
  name: go-released-only
  namespace: billing
spec:
  containerRef:
    name: go-released-only
  implementer:
    name: implementer
  reviewer:
    name: reviewer
  approval:
  - require: Person
