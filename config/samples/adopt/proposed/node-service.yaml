# node-service, a repository the factory adopts as it is: nothing is scaffolded or rewritten.
# Read from the repository: JavaScript.
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: billing-core
  namespace: billing
spec:
  displayName: billing-core
---
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: node-service
  namespace: billing
spec:
  softwareSystemRef:
    name: billing-core
  displayName: node-service
  type: service
  gitProviderRef:
    name: git
  adopt: true
  checkContexts:
  - "ci / Lint*"
  - "ci / test*"
---
# Start small: the Crew holds every change for a person. Loosen it rule by
# rule (docs/getting-started.md, "Start small").
apiVersion: theos.factory.io/v1beta1
kind: Crew
metadata:
  name: node-service
  namespace: billing
spec:
  containerRef:
    name: node-service
  implementer:
    name: implementer
  reviewer:
    name: reviewer
  approval:
  - require: Person
