# typescript-site, a repository the factory adopts as it is: nothing is scaffolded or rewritten.
# Read from the repository: TypeScript.
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: billing-core
  namespace: billing
spec:
  displayName: billing-core
---
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: typescript-site
  namespace: billing
spec:
  softwareSystemRef:
    name: billing-core
  displayName: typescript-site
  type: static-site
  gitProviderRef:
    name: git
  adopt: true
  checkCommand: npm test
  checkContexts:
  - "CI / build*"
---
# Start small: the Crew holds every change for a person. Loosen it rule by
# rule (docs/getting-started.md, "Start small").
apiVersion: theos.factory.io/v1beta1
kind: Crew
metadata:
  name: typescript-site
  namespace: billing
spec:
  containerRef:
    name: typescript-site
  implementer:
    name: implementer
  reviewer:
    name: reviewer
  approval:
  - require: Person
