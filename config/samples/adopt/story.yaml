# A repository you already have (docs/plans/done/adopt-existing.md, #60): invoices,
# a Rust service the factory never scaffolded and has no Framework for. The
# Container adopts it and names nothing from the catalog. Its check is the
# repository's own: the command an agent runs, and the status checks its CI
# reports, which main will require.
#
# Before applying, the repository's main needs .theos.yaml, which is how its
# owner says this project may work there:
#
#   project: webshop
#   softwareSystem: billing-core
#   container: invoices
#   type: service
#   scaffoldedFrom: []
#
# theos-session adopt writes this file's like from a clone, and that
# .theos.yaml (config/samples/adopt/proposed/ has what it proposes for eight
# repositories).
#
# docs/adopt.md walks it. Apply with:
#   kubectl -n webshop apply -f config/samples/adopt/story.yaml -f config/samples/adopt/crew.yaml
# Then: kubectl -n webshop get container invoices -o jsonpath='{.status.conditions[?(@.type=="Protected")].message}'
# says whether main reports the checks named here, or which it reports instead.
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: billing-core
spec:
  displayName: Billing
  description: Invoices and payments
---
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: invoices
spec:
  softwareSystemRef:
    name: billing-core
  displayName: Invoices
  description: Makes and sends invoices; a Rust service that was here before the factory.
  type: service
  gitProviderRef:
    name: gitea
  # Takes over the repository as it is: nothing is scaffolded or rewritten.
  adopt: true
  # What checks a change, in the agent's workspace. Unset, it is make check.
  checkCommand: cargo test --all
  # The checks main requires, as its CI reports them: the job test of the
  # workflow ci, on every event. Unset, they are check*.
  checkContexts:
  - ci / test*
