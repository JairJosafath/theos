# Who uses what, and what it is made of: the reference application
# (docs/plans/fresh-start.md). A customer uses the storefront, a web app that
# reads the catalog from catalog-api and orders through orders-api; both keep
# their data in the shop-db DataStore, a schema each. orders-api starts each
# payment at the payment provider, an External system the story only names,
# and payments-worker confirms them there and marks the orders paid.
apiVersion: c4.factory.io/v1alpha1
kind: Person
metadata:
  name: customer
spec:
  displayName: Customer
  description: Someone who buys from the shop.
---
apiVersion: c4.factory.io/v1alpha1
kind: SoftwareSystem
metadata:
  name: webshop-core
spec:
  displayName: Webshop Core
  description: Catalog, cart and ordering
  needs:
  - Customers can reorder in two clicks
  - The shop never sees a card number
  kpis:
  - Checkout conversion
  - Orders paid within a minute of checkout
---
apiVersion: c4.factory.io/v1alpha1
kind: SoftwareSystem
metadata:
  name: payment-provider
spec:
  displayName: Payment provider
  description: Takes card payments on its own page and says whether each one went through.
  location: External
---
apiVersion: c4.factory.io/v1alpha1
kind: Container
metadata:
  name: storefront
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Storefront
  description: The shop in the browser, to browse, order, pay and reorder.
  type: static-site
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: react-vite
  standardRef:
    name: ts-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
---
apiVersion: c4.factory.io/v1alpha1
kind: Container
metadata:
  name: catalog-api
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Catalog API
  description: Serves products, prices and stock, by category and by search.
  type: service
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: python-fastapi
  standardRef:
    name: python-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
---
apiVersion: c4.factory.io/v1alpha1
kind: Container
metadata:
  name: orders-api
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Orders API
  description: Keeps customers' accounts, takes and tracks carts, orders and reorders, and starts their payments.
  type: service
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: python-fastapi
  standardRef:
    name: python-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
  operations:
    recovery:
      rpo: 15m
    alerts:
      email: ops@webshop.example
---
# A worker on Kubernetes: python-cli's worker, a loop that stops cleanly on
# SIGTERM, in the image k8s-manifests builds, with no Service. No Container
# names spec.deploy yet: an argoCD DeployTarget (deploytarget-argocd.yaml) can
# take a k8s-manifests Container, and the deploy to a cluster end to end is
# #1072.
apiVersion: c4.factory.io/v1alpha1
kind: Container
metadata:
  name: payments-worker
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Payments worker
  description: Confirms each pending payment with the provider and marks its order paid or failed.
  type: worker
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: python-cli
  standardRef:
    name: python-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
---
apiVersion: c4.factory.io/v1alpha1
kind: DataStore
metadata:
  name: shop-db
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Shop DB
  description: The catalog, accounts, carts and orders, a schema for each API.
  connectorRef:
    name: postgres
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: customer-uses-webshop-core
spec:
  source:
    kind: Person
    name: customer
  target:
    kind: SoftwareSystem
    name: webshop-core
  description: Browses, orders, pays and reorders
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: customer-uses-storefront
spec:
  source:
    kind: Person
    name: customer
  target:
    kind: Container
    name: storefront
  description: Browses, orders and reorders, in the browser
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: storefront-to-catalog-api
spec:
  source:
    kind: Container
    name: storefront
  target:
    kind: Container
    name: catalog-api
  description: Reads products, prices and stock (JSON over HTTP)
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: storefront-to-orders-api
spec:
  source:
    kind: Container
    name: storefront
  target:
    kind: Container
    name: orders-api
  description: Fills the cart, checks out, lists and repeats orders (JSON over HTTP)
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: orders-api-to-catalog-api
spec:
  source:
    kind: Container
    name: orders-api
  target:
    kind: Container
    name: catalog-api
  description: Prices each line at checkout and on reorder
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: catalog-api-to-shop-db
spec:
  source:
    kind: Container
    name: catalog-api
  target:
    kind: DataStore
    name: shop-db
  description: Reads and writes the catalog
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: orders-api-to-shop-db
spec:
  source:
    kind: Container
    name: orders-api
  target:
    kind: DataStore
    name: shop-db
  description: Reads and writes accounts, carts and orders
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: orders-api-to-payment-provider
spec:
  source:
    kind: Container
    name: orders-api
  target:
    kind: SoftwareSystem
    name: payment-provider
  description: Starts a payment for each order and sends the customer to pay
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: payments-worker-to-payment-provider
spec:
  source:
    kind: Container
    name: payments-worker
  target:
    kind: SoftwareSystem
    name: payment-provider
  description: Asks whether each pending payment went through
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: payments-worker-to-orders-api
spec:
  source:
    kind: Container
    name: payments-worker
  target:
    kind: Container
    name: orders-api
  description: Lists pending payments and marks each order paid or failed
