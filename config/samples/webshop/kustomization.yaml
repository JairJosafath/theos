# The webshop, the reference application (docs/plans/fresh-start.md): a
# storefront, catalog-api, orders-api and payments-worker in webshop-core, the
# shop-db DataStore, and a payment provider the story only names. Needs `make
# gitea seed` first, for the template repositories and Secret
# gitea-credentials. brief.yaml, the shop in a customer's words, is applied on
# its own: it needs the Agents.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webshop
resources:
- namespace.yaml
- project.yaml
- factory.yaml
- deploytarget-argocd.yaml
- story.yaml
