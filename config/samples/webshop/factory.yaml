# Where repositories go, and the catalog Containers pick from. Templates are
# pinned to tags pushed by the seed job (templates/versions.txt).
apiVersion: theos.factory.io/v1beta1
kind: GitProvider
metadata:
  name: gitea
spec:
  provider: gitea
  url: http://gitea.gitea.svc.cluster.local:3000
  owner: webshop
  credentialsSecretRef:
    name: gitea-credentials
  # The project's own CI runners: a pool of single-job pods per label the
  # Standards' check workflows run on (go and base), on the Kind test
  # environment's runner images (config/runner). Without the block the
  # project's checks have no runner: the shared runners serve the templates
  # organization only (#1698).
  ci:
    giteaActions:
      # Where a remote TestEnvironment's machines reach this host to run a
      # job labelled env-<name> (docs/plans/test-environments.md, step 8):
      # https:// on port 443 at a public host. The in-cluster url above is
      # none, so remote CI is off until it is set.
      # publicURL: https://git.example.com
      runners:
        - label: base
          image: theos/gitea-runner-base:dev
          size: 1
        - label: go
          image: theos/gitea-runner-go:dev
          size: 1
          goCache: true
        # gitea-release's release job: a Go cache of the pod's own (#1141).
        - label: go-release
          image: theos/gitea-runner-go:dev
          size: 1
          freshGoCache: true
---
apiVersion: theos.factory.io/v1beta1
kind: Framework
metadata:
  name: python-fastapi
spec:
  displayName: Python, FastAPI (uv)
  description: A uv project with FastAPI, ruff, mypy and pytest, and its lock file.
  supportedTypes: [service]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/python-fastapi
    ref: v1.6.0
---
apiVersion: theos.factory.io/v1beta1
kind: Framework
metadata:
  name: react-vite
spec:
  displayName: Web app with pages (React, Vite)
  description: A page in the browser in React and TypeScript, built with Vite into a static site, with a pure module and its unit tests.
  supportedTypes: [static-site]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/react-vite
    ref: v1.0.0
---
apiVersion: theos.factory.io/v1beta1
kind: Framework
metadata:
  name: python-cli
spec:
  displayName: Command-line program (Python, uv)
  description: A command-line program in Python managed with uv, with flags parsed by argparse, a version flag, unit tests and a wheel and sdist for releases; or, as a worker, a long-running process that stops cleanly on SIGTERM; or, as a job, a run that does its work once and exits.
  supportedTypes: [cli, worker, job]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/python-cli
    ref: v1.2.0
---
apiVersion: theos.factory.io/v1beta1
kind: Standard
metadata:
  name: ts-standard
spec:
  displayName: TypeScript quality standard
  description: Strictest typescript-eslint, Prettier, role guides for agents and the make check CI.
  supportedTypes: [extension, static-site, cli]
  supportedFrameworks: [vscode-extension, react-vite, node-cli]
  # The quality contract: agents fix the code, not the rules it is checked by.
  protectedPaths: [AGENTS.md, Makefile, eslint.config.mjs, .prettierrc.json, .prettierignore, .editorconfig, docs/style/, docs/agents/]
  checksBeforeRelease: true
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/ts-standard
    ref: v1.7.0
---
apiVersion: theos.factory.io/v1beta1
kind: Standard
metadata:
  name: python-standard
spec:
  displayName: Python quality standard
  description: Every ruff rule, ruff format, mypy --strict, pytest, role guides for agents and the make check CI.
  supportedTypes: [service, cli, worker, job]
  supportedFrameworks: [python-fastapi, python-cli]
  protectedPaths: [AGENTS.md, Makefile, ruff.toml, mypy.ini, .editorconfig, docs/style/, docs/agents/]
  checksBeforeRelease: true
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/python-standard
    ref: v1.7.0
---
apiVersion: theos.factory.io/v1beta1
kind: Compute
metadata:
  name: small
spec:
  displayName: Small
  description: 50m CPU and 64Mi requested, 250m and 256Mi at most.
  supportedTypes: [service, worker, job, static-site, operator]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/small
    ref: v1.1.0
---
apiVersion: theos.factory.io/v1beta1
kind: Deployment
metadata:
  name: k8s-manifests
spec:
  displayName: Kubernetes manifests
  description: A Dockerfile for the Framework (python-fastapi, python-cli or react-vite) and plain Kubernetes manifests, built with kustomize; a Job for a job.
  supportedTypes: [service, worker, job, static-site]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/k8s-manifests
    ref: v1.9.1
---
apiVersion: theos.factory.io/v1beta1
kind: Connector
metadata:
  name: postgres
spec:
  displayName: PostgreSQL
  description: A Postgres in the devcontainer, and on Kubernetes a Postgres StatefulSet and its connection settings, the password from a Secret.
  supportedTypes: [service, worker, job]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/postgres
    ref: v1.2.0
---
# What the webshop is about: carts, stock and payments, their common mistakes
# and the choices to make. A SoftwareSystem names it in spec.domainRefs.
apiVersion: theos.factory.io/v1beta1
kind: Domain
metadata:
  name: webshop
spec:
  displayName: Webshop
  description: Carts, stock, orders and payments; the practices, the common mistakes and the choices to make in each.
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/webshop-domain
    ref: v1.0.0
