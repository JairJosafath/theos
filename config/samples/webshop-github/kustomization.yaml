# The webshop with orders-api also published on GitHub: its source, release
# and image (deploytarget.yaml), after it ships to the Argo CD in the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webshop
resources:
- ../webshop
- deploytarget.yaml
patches:
- target:
    group: theos.factory.io
    kind: Container
    name: orders-api
  patch: |-
    - op: add
      path: /spec/deploy/-
      value:
        target: webshop-oss
        after: kind-cluster
