# Where orders-cli's releases ship to: a GitHub repository whose releases are
# the deploys (docs/plans/deploy.md). It needs Secret orders-cli-deploy, with
# the key token, a fine-grained token for that repository alone with Contents
# read and write, which you create yourself; Ready says whether GitHub takes
# it. A Container names it in spec.deploy once #1162 lands. Not in
# kustomization.yaml: apply it with
# kubectl apply -n webshop -f deploytarget.yaml.
apiVersion: c4.factory.io/v1alpha1
kind: DeployTarget
metadata:
  name: orders-cli-releases
spec:
  github:
    repository: your-name/orders-cli
  credentialsSecretRef:
    name: orders-cli-deploy
  # development ships each release by itself; production waits for a
  # person's approval unless approval says None.
  tier: development
