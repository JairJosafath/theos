# Who uses what, and what it is made of: the shop's staff use orders-cli, a Go
# command-line tool in webshop-core.
apiVersion: c4.factory.io/v1alpha1
kind: Person
metadata:
  name: staff
spec:
  displayName: Shop staff
  description: Someone who packs and ships the shop's orders.
---
apiVersion: c4.factory.io/v1alpha1
kind: SoftwareSystem
metadata:
  name: webshop-core
spec:
  displayName: Webshop Core
  description: Catalog, cart and ordering
  needs:
  - Customers can reorder in two clicks
  kpis:
  - Checkout conversion
---
apiVersion: c4.factory.io/v1alpha1
kind: Container
metadata:
  name: orders-cli
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Orders CLI
  description: A command-line tool for the shop's staff to work with orders.
  type: cli
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: go-cli
  standardRef:
    name: go-standard
  # Builds the binaries on a Gitea release for each version tag, so a Crew that
  # tags releases (crew-publish.yaml) has a release run to wait on. Named
  # before the first apply: the Container is scaffolded once.
  deploymentRef:
    name: gitea-release
  # When CI runs the full check: EveryChange (the default) or BeforeRelease,
  # once the Standard can (its checksBeforeRelease).
  checks: EveryChange
  # No operations block: only a Framework that reads it (readsOperations:
  # true, the AWS ones) renders what the app promises into its repository;
  # on go-cli the block would only show OperationsApplied=False.
  # Where each release ships once its runs succeed, in order: DeployTarget
  # orders-cli-releases (deploytarget.yaml), a GitHub repository. Until you
  # apply it, Deployed says the target isn't found and nothing ships. The list
  # may change at any time and never scaffolds again; an entry may pin a
  # version (a rollback), come after an earlier entry, and name the version
  # a person approved for a production target.
  deploy:
    - target: orders-cli-releases
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: staff-uses-webshop-core
spec:
  source:
    kind: Person
    name: staff
  target:
    kind: SoftwareSystem
    name: webshop-core
  description: Packs and ships orders
---
apiVersion: c4.factory.io/v1alpha1
kind: Relationship
metadata:
  name: staff-uses-orders-cli
spec:
  source:
    kind: Person
    name: staff
  target:
    kind: Container
    name: orders-cli
  description: Totals and lists orders from a terminal
