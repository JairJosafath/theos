# Picks up orders-cli's Gitea issues labelled status/ready that have an
# "Acceptance criteria" checklist, one at a time: a Task per issue, implemented,
# checked by CI, reviewed and merged.
apiVersion: c4.factory.io/v1alpha1
kind: Crew
metadata:
  name: orders-cli
spec:
  containerRef:
    name: orders-cli
  displayName: Orders CLI crew
  description: Builds orders-cli issue by issue.
  implementer:
    name: implementer
  reviewer:
    name: reviewer
