# Claude Code on the release's Go and Node toolchain image. Both read Secret
# claude-credentials, key CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`),
# which you create in this namespace; no token is kept here. Set the image's tag
# to the release you installed.
apiVersion: c4.factory.io/v1alpha1
kind: Agent
metadata:
  name: claude-implementer
spec:
  displayName: Claude Code, Sonnet (implementer)
  description: Implements one issue at a time, test first, until make check passes.
  image: ghcr.io/jairjosafath/c4factory/agent-go:0.3.0
  harness: claude-code
  model: claude-sonnet-5-5
  credentialsSecretRef:
    name: claude-credentials
  maxRounds: 3
  timeoutMinutes: 90
  # A CPU limit keeps one agent's tests from taking every core of the node.
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "2", memory: 4Gi}
---
# The reviewer: a stronger model, which judges each acceptance criterion.
apiVersion: c4.factory.io/v1alpha1
kind: Agent
metadata:
  name: claude-reviewer
spec:
  displayName: Claude Code, Opus (reviewer)
  description: Reviews each round against the issue's acceptance criteria and the Standard's checklist.
  image: ghcr.io/jairjosafath/c4factory/agent-go:0.3.0
  harness: claude-code
  model: claude-opus-5-5
  credentialsSecretRef:
    name: claude-credentials
  maxRounds: 3
  timeoutMinutes: 45
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}
