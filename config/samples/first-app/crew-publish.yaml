# The Crew of crew.yaml, tagging its releases and publishing each one to a
# GitHub repository once its release runs succeed, with the app's source as of
# its tag (docs/getting-started.md, "Publish releases to GitHub"). It needs
# Secret orders-cli-github, with the key token, which you create yourself. Not
# in kustomization.yaml: apply it in place of crew.yaml with
# kubectl apply -n webshop -f crew-publish.yaml.
apiVersion: theos.factory.io/v1beta1
kind: Crew
metadata:
  name: orders-cli
spec:
  containerRef:
    name: orders-cli
  displayName: Orders CLI crew
  description: Builds orders-cli issue by issue, and releases it.
  implementer:
    name: implementer
  reviewer:
    name: reviewer
  tagReleases: true
  publishReleases:
    github:
      repository: your-name/orders-cli
      tokenSecretRef:
        name: orders-cli-github
    # The app's source, the factory's own files left out, at the repository's
    # root, tagged as the release (v0.2.0); a folder such as cli would take
    # the tag cli/v0.2.0 instead.
    source:
      path: "."
