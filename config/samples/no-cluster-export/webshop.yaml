# What theos export prints for the webshop worked with no cluster
# (docs/no-cluster.md, "Move to a cluster and back"): the samples' webshop
# story, catalog and Crew, every Container scaffolded but payments-worker.
# TestExportSample295 writes it (go test ./internal/nocluster -run
# TestExportSample295 -update) and make validate-yaml checks it.
# Project webshop, exported by theos export from model/model.yaml and model/setup.yaml for a cluster.
# Apply it into the namespace webshop once its GitProvider's Secret exists.
---
# One Project per namespace, named after it.
apiVersion: theos.factory.io/v1beta1
kind: Project
metadata:
  name: webshop
  namespace: webshop
spec:
  displayName: Webshop
  description: An online shop where customers browse, order and reorder.
  # The license every Container in the project is scaffolded with. MIT is this
  # sample's choice, not the factory's: it never picks one.
  license: MIT
---
# Who uses what, and what it is made of: the reference application
# (docs/plans/fresh-start.md). A customer uses the storefront, a web app that
# reads the catalog from catalog-api and orders through orders-api; both keep
# their data in the shop-db DataStore, a schema each. orders-api starts each
# payment at the payment provider, an External system the story only names,
# and payments-worker confirms them there and marks the orders paid.
apiVersion: theos.factory.io/v1beta1
kind: Person
metadata:
  name: customer
  namespace: webshop
spec:
  displayName: Customer
  description: Someone who buys from the shop.
---
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: webshop-core
  namespace: webshop
spec:
  displayName: Webshop Core
  description: Catalog, cart and ordering
  # The webshop Domain (factory.yaml): every Container here is scaffolded with
  # its practices, common mistakes and choices under docs/agents/domain/webshop/.
  domainRefs: [webshop]
  needs:
    - Customers can reorder in two clicks
    - The shop never sees a card number
  kpis:
    - Checkout conversion
    - Orders paid within a minute of checkout
---
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: payment-provider
  namespace: webshop
spec:
  displayName: Payment provider
  description: Takes card payments on its own page and says whether each one went through.
  location: External
---
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: storefront
  namespace: webshop
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Storefront
  description: The shop in the browser, to browse, order, pay and reorder.
  type: static-site
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: react-vite
  standardRef:
    name: ts-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
  # Each release ships to the Argo CD in the cluster the factory runs on
  # (deploytarget-argocd.yaml); status.deploys[] says how far it got.
  deploy:
    - target: kind-cluster
  adopt: true
---
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: catalog-api
  namespace: webshop
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Catalog API
  description: Serves products, prices and stock, by category and by search.
  type: service
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: python-fastapi
  standardRef:
    name: python-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
  # Each release ships to the Argo CD in the cluster the factory runs on
  # (deploytarget-argocd.yaml); status.deploys[] says how far it got.
  deploy:
    - target: kind-cluster
  adopt: true
---
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: orders-api
  namespace: webshop
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Orders API
  description: Keeps customers' accounts, takes and tracks carts, orders and reorders, and starts their payments.
  type: service
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: python-fastapi
  standardRef:
    name: python-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
  # Each release ships to the Argo CD in the cluster the factory runs on
  # (deploytarget-argocd.yaml); status.deploys[] says how far it got.
  deploy:
    - target: kind-cluster
  adopt: true
---
# A worker on Kubernetes: python-cli's worker, a loop that stops cleanly on
# SIGTERM, in the image k8s-manifests builds, with no Service.
apiVersion: theos.factory.io/v1beta1
kind: Container
metadata:
  name: payments-worker
  namespace: webshop
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Payments worker
  description: Confirms each pending payment with the provider and marks its order paid or failed.
  type: worker
  gitProviderRef:
    name: gitea
  frameworkRef:
    name: python-cli
  standardRef:
    name: python-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
  # Each release ships to the Argo CD in the cluster the factory runs on
  # (deploytarget-argocd.yaml); status.deploys[] says how far it got.
  deploy:
    - target: kind-cluster
---
apiVersion: theos.factory.io/v1beta1
kind: DataStore
metadata:
  name: shop-db
  namespace: webshop
spec:
  softwareSystemRef:
    name: webshop-core
  displayName: Shop DB
  description: The catalog, accounts, carts and orders, a schema for each API.
  connectorRef:
    name: postgres
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: customer-uses-webshop-core
  namespace: webshop
spec:
  source:
    kind: Person
    name: customer
  target:
    kind: SoftwareSystem
    name: webshop-core
  description: Browses, orders, pays and reorders
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: customer-uses-storefront
  namespace: webshop
spec:
  source:
    kind: Person
    name: customer
  target:
    kind: Container
    name: storefront
  description: Browses, orders and reorders, in the browser
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: storefront-to-catalog-api
  namespace: webshop
spec:
  source:
    kind: Container
    name: storefront
  target:
    kind: Container
    name: catalog-api
  description: Reads products, prices and stock (JSON over HTTP)
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: storefront-to-orders-api
  namespace: webshop
spec:
  source:
    kind: Container
    name: storefront
  target:
    kind: Container
    name: orders-api
  description: Fills the cart, checks out, lists and repeats orders (JSON over HTTP)
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: orders-api-to-catalog-api
  namespace: webshop
spec:
  source:
    kind: Container
    name: orders-api
  target:
    kind: Container
    name: catalog-api
  description: Prices each line at checkout and on reorder
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: catalog-api-to-shop-db
  namespace: webshop
spec:
  source:
    kind: Container
    name: catalog-api
  target:
    kind: DataStore
    name: shop-db
  description: Reads and writes the catalog
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: orders-api-to-shop-db
  namespace: webshop
spec:
  source:
    kind: Container
    name: orders-api
  target:
    kind: DataStore
    name: shop-db
  description: Reads and writes accounts, carts and orders
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: orders-api-to-payment-provider
  namespace: webshop
spec:
  source:
    kind: Container
    name: orders-api
  target:
    kind: SoftwareSystem
    name: payment-provider
  description: Starts a payment for each order and sends the customer to pay
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: payments-worker-to-payment-provider
  namespace: webshop
spec:
  source:
    kind: Container
    name: payments-worker
  target:
    kind: SoftwareSystem
    name: payment-provider
  description: Asks whether each pending payment went through
---
apiVersion: theos.factory.io/v1beta1
kind: Relationship
metadata:
  name: payments-worker-to-orders-api
  namespace: webshop
spec:
  source:
    kind: Container
    name: payments-worker
  target:
    kind: Container
    name: orders-api
  description: Lists pending payments and marks each order paid or failed
---
# Where repositories go, and the catalog Containers pick from. Templates are
# pinned to tags pushed by the seed job (templates/versions.txt).
apiVersion: theos.factory.io/v1beta1
kind: GitProvider
metadata:
  name: gitea
  namespace: webshop
spec:
  provider: gitea
  url: http://gitea.gitea.svc.cluster.local:3000
  owner: webshop
  credentialsSecretRef:
    name: gitea-credentials
  # The project's own CI runners: a pool of single-job pods per label the
  # Standards' check workflows run on (go and base), on the Kind test
  # environment's runner images (config/runner). Without the block the
  # project's checks have no runner: the shared runners serve the templates
  # organization only (#1698).
  ci:
    giteaActions:
      # Where a remote TestEnvironment's machines reach this host to run a
      # job labelled env-<name> (docs/plans/done/test-environments.md, step 8):
      # https:// on port 443 at a public host. The in-cluster url above is
      # none, so remote CI is off until it is set.
      # publicURL: https://git.example.com
      runners:
        - label: base
          image: theos/gitea-runner-base:dev
          size: 1
        - label: go
          image: theos/gitea-runner-go:dev
          size: 1
          goCache: true
        # gitea-release's release job: a Go cache of the pod's own (#1141).
        - label: go-release
          image: theos/gitea-runner-go:dev
          size: 1
          freshGoCache: true
---
apiVersion: theos.factory.io/v1beta1
kind: Framework
metadata:
  name: python-fastapi
  namespace: webshop
spec:
  displayName: Python, FastAPI (uv)
  description: A uv project with FastAPI, ruff, mypy and pytest, and its lock file.
  supportedTypes: [service]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/python-fastapi
    ref: v1.6.0
---
apiVersion: theos.factory.io/v1beta1
kind: Framework
metadata:
  name: react-vite
  namespace: webshop
spec:
  displayName: Web app with pages (React, Vite)
  description: A page in the browser in React and TypeScript, built with Vite into a static site, with a pure module and its unit tests.
  supportedTypes: [static-site]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/react-vite
    ref: v1.0.0
---
apiVersion: theos.factory.io/v1beta1
kind: Framework
metadata:
  name: python-cli
  namespace: webshop
spec:
  displayName: Command-line program (Python, uv)
  description: A command-line program in Python managed with uv, with flags parsed by argparse, a version flag, unit tests and a wheel and sdist for releases; or, as a worker, a long-running process that stops cleanly on SIGTERM; or, as a job, a run that does its work once and exits.
  supportedTypes: [cli, worker, job]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/python-cli
    ref: v1.2.0
---
apiVersion: theos.factory.io/v1beta1
kind: Standard
metadata:
  name: ts-standard
  namespace: webshop
spec:
  displayName: TypeScript quality standard
  description: Strictest typescript-eslint, Prettier, role guides for agents and the make check CI.
  supportedTypes: [extension, static-site, cli]
  supportedFrameworks: [vscode-extension, react-vite, node-cli]
  # The quality contract: agents fix the code, not the rules it is checked by.
  protectedPaths: [AGENTS.md, Makefile, eslint.config.mjs, .prettierrc.json, .prettierignore, .editorconfig, docs/style/, docs/agents/]
  checksBeforeRelease: true
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/ts-standard
    ref: v1.7.0
---
apiVersion: theos.factory.io/v1beta1
kind: Standard
metadata:
  name: python-standard
  namespace: webshop
spec:
  displayName: Python quality standard
  description: Every ruff rule, ruff format, mypy --strict, pytest, role guides for agents and the make check CI.
  supportedTypes: [service, cli, worker, job]
  supportedFrameworks: [python-fastapi, python-cli]
  protectedPaths: [AGENTS.md, Makefile, ruff.toml, mypy.ini, .editorconfig, docs/style/, docs/agents/]
  checksBeforeRelease: true
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/python-standard
    ref: v1.7.0
  # Upkeep the Standard proposes to the Crews of its Containers (docs/design.md,
  # "Schedules"). Nothing here runs: a Crew takes a proposal by adding it to
  # its own spec.schedules, and may change the time and the words there.
  schedules:
    - name: dependencies
      cron: "0 6 * * 1" # Mondays at 06:00, UTC
      goal: >-
        Update the dependencies in pyproject.toml that have a new minor or patch version, and uv.lock with them. One pull request. Say what you updated, and what you left and why.
---
apiVersion: theos.factory.io/v1beta1
kind: Compute
metadata:
  name: small
  namespace: webshop
spec:
  displayName: Small
  description: 50m CPU and 64Mi requested, 250m and 256Mi at most.
  supportedTypes: [service, worker, job, static-site, operator]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/small
    ref: v1.1.0
---
apiVersion: theos.factory.io/v1beta1
kind: Deployment
metadata:
  name: k8s-manifests
  namespace: webshop
spec:
  displayName: Kubernetes manifests
  description: A Dockerfile for the Framework (python-fastapi, python-cli or react-vite) and plain Kubernetes manifests, built with kustomize; a Job for a job.
  supportedTypes: [service, worker, job, static-site]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/k8s-manifests
    ref: v1.9.1
---
apiVersion: theos.factory.io/v1beta1
kind: Connector
metadata:
  name: postgres
  namespace: webshop
spec:
  displayName: PostgreSQL
  description: A Postgres in the devcontainer, and on Kubernetes a Postgres StatefulSet and its connection settings, the password from a Secret.
  supportedTypes: [service, worker, job]
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/postgres
    ref: v1.2.0
---
# What the webshop is about: carts, stock and payments, their common mistakes
# and the choices to make. A SoftwareSystem names it in spec.domainRefs.
apiVersion: theos.factory.io/v1beta1
kind: Domain
metadata:
  name: webshop
  namespace: webshop
spec:
  displayName: Webshop
  description: Carts, stock, orders and payments; the practices, the common mistakes and the choices to make in each.
  template:
    url: http://gitea.gitea.svc.cluster.local:3000/templates/webshop-domain
    ref: v1.0.0
---
# A Bundle names the catalog entries a team picked together, from factory.yaml:
# a Container may name it instead of the four (docs/plans/done/catalog-bundles.md).
# The webshop's own Containers keep naming their sides.
apiVersion: theos.factory.io/v1beta1
kind: Bundle
metadata:
  name: python-service
  namespace: webshop
spec:
  displayName: Python service
  description: A FastAPI service with the Python Standard, small sizing and plain Kubernetes manifests.
  frameworkRef:
    name: python-fastapi
  standardRef:
    name: python-standard
  computeRef:
    name: small
  deploymentRef:
    name: k8s-manifests
---
# The webshop's Crew and its Agents as a project's model/setup.yaml holds
# them for the lead runtime, a Claude Code session that drives theos
# (docs/plans/lead-runtime.md, decision 6). Not in this sample's
# kustomization: on a cluster the chart makes each project's Agents. The
# same objects move to a cluster unchanged; there the operator honours every
# field, and in a session theos status names each one it does not.
apiVersion: theos.factory.io/v1beta1
kind: Agent
metadata:
  name: implementer
  namespace: webshop
spec:
  description: Implements one issue at a time, test first, until make check passes.
  image: ghcr.io/jairjosafath/theos/agent-go:0.9.0
  harness: claude-code
  model: claude-sonnet-5-5
  maxRounds: 3
  timeoutMinutes: 90
---
apiVersion: theos.factory.io/v1beta1
kind: Agent
metadata:
  name: reviewer
  namespace: webshop
spec:
  description: Reviews each round against the issue's acceptance criteria and the Standard's checklist.
  image: ghcr.io/jairjosafath/theos/agent-go:0.9.0
  harness: claude-code
  model: claude-opus-5-5
  maxRounds: 3
---
# Picks up orders-api's issues labelled status/ready that have an
# "Acceptance criteria" checklist, two at a time.
apiVersion: theos.factory.io/v1beta1
kind: Crew
metadata:
  name: orders-api
  namespace: webshop
spec:
  containerRef:
    name: orders-api
  displayName: Orders API crew
  implementer:
    name: implementer
  reviewer:
    name: reviewer
  parallel: 2
  approval:
    - require: Person
---
# Start small: the Crew holds every change for a person (docs/adopt.md).
apiVersion: theos.factory.io/v1beta1
kind: Crew
metadata:
  name: catalog-api
  namespace: webshop
spec:
  containerRef:
    name: catalog-api
  implementer:
    name: implementer
  reviewer:
    name: reviewer
  approval:
  - require: Person
---
# Start small: the Crew holds every change for a person (docs/adopt.md).
apiVersion: theos.factory.io/v1beta1
kind: Crew
metadata:
  name: storefront
  namespace: webshop
spec:
  containerRef:
    name: storefront
  implementer:
    name: implementer
  reviewer:
    name: reviewer
  approval:
  - require: Person
