---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: briefs.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Brief
    listKind: BriefList
    plural: briefs
    singular: brief
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.round
      name: Round
      type: integer
    - jsonPath: .status.suggestionsWaiting
      name: Suggestions
      type: integer
    - jsonPath: .status.failedWaiting
      name: Failed
      type: integer
    - jsonPath: .status.needsYouWaiting
      name: Needs you
      type: integer
    - jsonPath: .status.apps[*].lastRelease.tag
      name: Releases
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Brief is an app idea in plain words and its follow-up prompts. A planner
          Agent turns each round (the idea, then each batch of new prompts) into the
          model, a Crew per new Container and the first issues, and says in plain
          words what it chose. Deleting a Brief keeps what it made.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the idea, the prompts and the Agents
            properties:
              agents:
                default: {}
                description: agents names the Agents the Brief works with.
                properties:
                  designer:
                    default:
                      name: designer
                    description: designer names the Agent that designs for the Crews.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  implementer:
                    default:
                      name: implementer
                    description: implementer names the Agent that implements the Crews'
                      issues.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  planner:
                    default:
                      name: planner
                    description: planner names the Agent that plans each round.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  reviewer:
                    default:
                      name: reviewer
                    description: reviewer names the Agent that reviews the Crews'
                      work.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              autopilot:
                description: |-
                  autopilot says whether the Brief tends its failed issues by itself, in
                  tending rounds with no new prompt (docs/plans/done/brief-autopilot.md):
                  Off tends nothing; Ask decides them and lists each answer under
                  status.needsYou for a prompt to confirm; On applies them. Unset is the
                  operator's default, Ask.
                enum:
                - "Off"
                - Ask
                - "On"
                type: string
              gitProviderRef:
                default:
                  name: gitea
                description: |-
                  gitProviderRef names the GitProvider that hosts the Brief's repository
                  and the repositories of the Containers it plans.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              idea:
                description: |-
                  idea says in plain words what the app is for and who uses it. It can't
                  change; steer with prompts.
                maxLength: 4000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: idea is immutable; add a prompt
                  rule: self == oldSelf
              parallel:
                description: |-
                  parallel is how many issues each Crew the Brief made works on at once,
                  set on those Crews every reconcile, earlier rounds' included
                  (docs/plans/done/brief-parallel.md). Unset is the operator's default, 3.
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              prompts:
                description: |-
                  prompts are follow-ups in plain words, oldest first. A prompt is only
                  ever appended: an earlier one can't change or go.
                items:
                  maxLength: 2000
                  minLength: 1
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: 'prompts are append-only: an earlier prompt can''t change
                    or go'
                  rule: size(self) >= size(oldSelf) && oldSelf.all(i, p, self[i] ==
                    p)
              releases:
                description: |-
                  releases name the Containers whose releases the person asks for, and the
                  GitHub repository each one's releases are published to. An entry turns
                  releases on for its Container and sets the publishReleases of the Crew
                  the Brief made for it; removing it leaves that Crew as it is.
                items:
                  description: |-
                    BriefRelease is where a Container's releases are published: the fields of a
                    Crew's publishReleases, for the Crew the Brief made for the Container.
                  properties:
                    container:
                      description: container names the Container, a DNS label.
                      maxLength: 63
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: 'container must be a DNS label: lowercase letters,
                          digits and ''-'''
                        rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                    github:
                      description: github is the GitHub repository the releases go
                        to.
                      properties:
                        repository:
                          description: repository is owner/name on github.com.
                          maxLength: 140
                          type: string
                          x-kubernetes-validations:
                          - message: repository must be owner/name
                            rule: self.matches('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')
                        tokenSecretRef:
                          description: |-
                            tokenSecretRef names a Secret in the Crew's namespace whose key token is
                            a fine-grained token for that repository alone, with Contents read and
                            write. The user creates it; the token never leaves the operator.
                          properties:
                            name:
                              description: name of the referenced object.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - repository
                      - tokenSecretRef
                      type: object
                    tagPrefix:
                      description: |-
                        tagPrefix goes before the Crew's tag on the target, such as "cli-" when
                        two Containers publish to one repository: cli-v0.2.0.
                      maxLength: 40
                      pattern: ^[A-Za-z0-9._/-]*$
                      type: string
                  required:
                  - container
                  - github
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - container
                x-kubernetes-list-type: map
            required:
            - idea
            type: object
            x-kubernetes-validations:
            - message: 'prompts are append-only: an earlier prompt can''t change or
                go'
              rule: '!has(oldSelf.prompts) || size(oldSelf.prompts) == 0 || has(self.prompts)'
          status:
            description: status defines the observed state of Brief
            properties:
              apps:
                description: |-
                  apps has a line per Container the Brief made, then one per spec.releases
                  entry naming no Container it made: whether its releases are on, where
                  they are published, the latest one, and a sentence on how they go.
                items:
                  description: |-
                    BriefApp is a Container the Brief made, or one spec.releases names, and how
                    its releases go: copied from the Crew, which holds every fact.
                  properties:
                    container:
                      description: container names the Container.
                      maxLength: 253
                      type: string
                    crew:
                      description: crew names the Container's Crew; empty while it
                        has none.
                      maxLength: 253
                      type: string
                    lastRelease:
                      description: lastRelease is the Crew's latest release.
                      properties:
                        publishState:
                          description: |-
                            publishState is how publishing the release went: Pending, Publishing,
                            Published or Failed; empty when the Crew publishes none.
                          type: string
                        publishedURL:
                          description: publishedURL is the published release.
                          type: string
                        run:
                          description: 'run is how the tag''s CI runs went: Waiting,
                            Running, Succeeded or Failed.'
                          type: string
                        tag:
                          description: tag is the release's version.
                          type: string
                        time:
                          description: time is when the Crew tagged the release.
                          format: date-time
                          type: string
                        url:
                          description: url is the release's page on the Git host.
                          type: string
                      required:
                      - tag
                      type: object
                    message:
                      description: message says in one plain sentence how the app's
                        releases go.
                      maxLength: 1000
                      type: string
                    parallel:
                      description: |-
                        parallel is how many issues the Crew works on at once; 0 while it has
                        no Crew.
                      format: int32
                      maximum: 5
                      minimum: 0
                      type: integer
                    publishTo:
                      description: |-
                        publishTo is the GitHub repository, owner/name, the Crew publishes its
                        releases to; empty when it publishes none.
                      maxLength: 140
                      type: string
                    releases:
                      description: releases is On when the Crew tags releases, else
                        Off.
                      enum:
                      - "On"
                      - "Off"
                      type: string
                  required:
                  - container
                  - releases
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              attention:
                description: |-
                  attention lists what the Brief made that it leaves alone for now, as
                  it may heal by itself, and when it acts if it hasn't; at most 100.
                  Empty while autopilot is Off.
                items:
                  description: |-
                    BriefHealing is an item the Brief watches and leaves alone for now, as it
                    may heal by itself, and when the Brief acts if it hasn't.
                  properties:
                    actsAt:
                      description: |-
                        actsAt is when the Brief acts if it hasn't healed; unset when it acts
                        only once the item changes.
                      format: date-time
                      type: string
                    kind:
                      description: 'kind of the item: Issue, Task, Crew or Container.'
                      enum:
                      - Issue
                      - Task
                      - Crew
                      - Container
                      type: string
                    name:
                      description: name of the item; container#number for an issue.
                      maxLength: 320
                      type: string
                    reason:
                      description: reason says why it is left alone, in a sentence.
                      maxLength: 1000
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              choices:
                description: choices are what the planner chose in the last round,
                  in plain words.
                items:
                  maxLength: 500
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: |-
                  conditions: Planned says whether the last round's plan is applied, and
                  why not. NeedsInput, while True, says in one sentence what the Brief
                  waits for from the person. NeedsYou, while True, says the first of
                  needsYou and how many more.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costMilliUSD:
                description: |-
                  costMilliUSD is what the Brief's planning cost over all rounds, in
                  thousandths of a US dollar.
                format: int64
                type: integer
              created:
                description: created lists the objects the Brief made, over all rounds.
                items:
                  description: BriefObject names an object a Brief created.
                  properties:
                    kind:
                      description: kind of the object, such as Container or Crew.
                      maxLength: 63
                      type: string
                    name:
                      description: name of the object.
                      maxLength: 253
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              failed:
                description: |-
                  failed are the issues handed back to a person in the repositories of
                  the Containers the Brief made, by Container and number; at most 50. A
                  prompt says whether to try them again.
                items:
                  description: |-
                    BriefFailedIssue is an issue handed back to a person (status/needs-human) in
                    the repository of a Container the Brief made, and why.
                  properties:
                    container:
                      description: container is the Container whose repository has
                        the issue.
                      maxLength: 253
                      type: string
                    kind:
                      description: |-
                        kind says why it was handed back: unclear (no acceptance criteria),
                        merged (a Task merged it already), exhausted (agents tried it as often
                        as a Crew does), failed (its last Task failed), blocked (its last
                        Task's agent said it can't start the issue yet, and why), person (a
                        person handed it back) or byHand (a kind/by-hand issue: criteria only a
                        person can do, which a plan may close but never retry).
                      enum:
                      - unclear
                      - merged
                      - exhausted
                      - failed
                      - blocked
                      - person
                      - byHand
                      type: string
                    number:
                      description: number of the issue in its repository.
                      format: int32
                      minimum: 1
                      type: integer
                    reason:
                      description: reason says why in a sentence, such as the failed
                        Task's message.
                      maxLength: 1000
                      type: string
                    title:
                      description: title of the issue.
                      maxLength: 255
                      type: string
                    tries:
                      description: tries is how many Tasks the issue has had.
                      format: int32
                      minimum: 0
                      type: integer
                    url:
                      description: url is the issue's address.
                      type: string
                  required:
                  - container
                  - kind
                  - number
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              failedWaiting:
                description: |-
                  failedWaiting is how many failed issues wait for an answer, those past
                  the 50 listed too.
                format: int32
                type: integer
              history:
                description: history has an entry per round, oldest first; the newest
                  20 are kept.
                items:
                  description: 'BriefRound is one round of planning: the idea, or
                    a batch of new prompts.'
                  properties:
                    choices:
                      description: choices are what the planner chose, in plain words.
                      items:
                        maxLength: 500
                        type: string
                      maxItems: 50
                      type: array
                      x-kubernetes-list-type: atomic
                    costMilliUSD:
                      description: |-
                        costMilliUSD is what the round's planning cost, in thousandths of a
                        US dollar.
                      format: int64
                      type: integer
                    needsInput:
                      description: needsInput is the planner's question, when the
                        round asked for input.
                      maxLength: 1000
                      type: string
                    outcome:
                      description: |-
                        outcome is how the round ended: Applied, PlannerNeedsInput or
                        RoundFailed; Tended for a tending round that applied.
                      enum:
                      - Applied
                      - PlannerNeedsInput
                      - RoundFailed
                      - Tended
                      type: string
                    round:
                      description: round is the round's number, from 1.
                      format: int32
                      minimum: 1
                      type: integer
                    runsWithoutCost:
                      description: |-
                        runsWithoutCost counts the round's planner runs whose agent didn't report
                        what they cost; costMilliUSD leaves them out.
                      format: int32
                      type: integer
                    summary:
                      description: summary says in a few words what the round did.
                      maxLength: 1000
                      type: string
                  required:
                  - round
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              issues:
                description: issues lists the issues the Brief filed, over all rounds.
                items:
                  description: BriefIssue is an issue a Brief filed.
                  properties:
                    "n":
                      description: n is the issue's number in its round's plan, as
                        in its marker.
                      format: int32
                      type: integer
                    number:
                      description: number of the issue in its repository.
                      format: int32
                      minimum: 1
                      type: integer
                    repository:
                      description: repository is the Container's repository, owner/name.
                      maxLength: 140
                      type: string
                    round:
                      description: round is the Brief round that filed the issue.
                      format: int32
                      type: integer
                    title:
                      description: title of the issue.
                      maxLength: 255
                      type: string
                    url:
                      description: url is the issue's address.
                      type: string
                  required:
                  - number
                  - repository
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              lastTendTime:
                description: lastTendTime is when the last tending round started.
                format: date-time
                type: string
              needsYou:
                description: |-
                  needsYou lists what only the person can decide, oldest first, each
                  with what the Brief would do; at most 50. A prompt answers it. Empty
                  while autopilot is Off.
                items:
                  description: |-
                    BriefNeedsYou is an item only the person can decide: the question, what the
                    Brief would do and why. A prompt answers it.
                  properties:
                    kind:
                      description: 'kind of the item: Issue, Task, Crew or Container.'
                      enum:
                      - Issue
                      - Task
                      - Crew
                      - Container
                      type: string
                    name:
                      description: name of the item; container#number for an issue.
                      maxLength: 320
                      type: string
                    question:
                      description: question says in one sentence what needs the person.
                      maxLength: 1000
                      type: string
                    recommend:
                      description: recommend is what the Brief would do.
                      maxLength: 1000
                      type: string
                    since:
                      description: since when the item needs the person.
                      format: date-time
                      type: string
                    why:
                      description: why the Brief would do it.
                      maxLength: 1000
                      type: string
                  required:
                  - kind
                  - name
                  - question
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              needsYouWaiting:
                description: |-
                  needsYouWaiting is how many items need the person, those past the 50
                  listed too.
                format: int32
                type: integer
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              parallel:
                description: |-
                  parallel is how many issues each Crew the Brief made works on at once,
                  as a prompt asked: the planner relays it in plan/parallel.yaml and the
                  round that applies it records it here. spec.parallel wins over it
                  (docs/plans/done/brief-parallel.md).
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              parallelRound:
                description: parallelRound is the round whose prompt gave parallel.
                format: int32
                type: integer
              phase:
                description: phase is Pending, Planning, Applying, Planned, NeedsInput
                  or Failed.
                enum:
                - Pending
                - Planning
                - Applying
                - Planned
                - NeedsInput
                - Failed
                type: string
              promptsPlanned:
                description: |-
                  promptsPlanned is how many of spec.prompts the last applied round took;
                  the prompts after them wait for the next round.
                format: int32
                type: integer
              repositoryURL:
                description: |-
                  repositoryURL is the Brief's own repository, where every round's plan
                  is kept.
                type: string
              round:
                description: |-
                  round is the number of the round running now or last run; 0 before the
                  first.
                format: int32
                type: integer
              roundPrompts:
                description: roundPrompts is how many of spec.prompts the running
                  or last round took.
                format: int32
                type: integer
              runsWithoutCost:
                description: |-
                  runsWithoutCost counts the planner runs, over all rounds, whose agent
                  didn't report what they cost; costMilliUSD leaves them out.
                format: int32
                type: integer
              suggestions:
                description: |-
                  suggestions are the reviewers' suggestions waiting in the repositories
                  of the Containers the Brief made, oldest first; at most 50. A prompt
                  answers them: the operator takes the ones it says to take, ready for
                  the Crew, and closes the ones it says to skip.
                items:
                  description: |-
                    BriefSuggestion is a reviewer's suggestion waiting in the repository of a
                    Container the Brief made, for the person to answer in a prompt.
                  properties:
                    container:
                      description: container is the Container whose repository has
                        the suggestion.
                      maxLength: 253
                      type: string
                    criteria:
                      description: |-
                        criteria says the suggestion has acceptance criteria, so a prompt can
                        take it as it stands.
                      type: boolean
                    number:
                      description: number of the suggestion's issue in its repository.
                      format: int32
                      minimum: 1
                      type: integer
                    title:
                      description: title of the suggestion.
                      maxLength: 255
                      type: string
                    url:
                      description: url is the suggestion's address.
                      type: string
                  required:
                  - container
                  - number
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              suggestionsWaiting:
                description: |-
                  suggestionsWaiting is how many reviewers' suggestions wait for an
                  answer, those past the 50 listed too.
                format: int32
                type: integer
              tendRound:
                description: |-
                  tendRound is the last tending round: a round with no new prompt that
                  decides the failed issues.
                format: int32
                type: integer
              tended:
                description: |-
                  tended are the failed issues rounds answered and the Brief remembers,
                  so it raises one again only when its tries grow or a wait lapses; at
                  most 50.
                items:
                  description: |-
                    BriefTendedIssue is a failed issue a round answered, as the Brief remembers
                    it: it is not raised again until its tries grow or a wait lapses.
                  properties:
                    answer:
                      description: answer is retry, close, wait or ask.
                      enum:
                      - retry
                      - close
                      - wait
                      - ask
                      type: string
                    at:
                      description: at is when it was answered.
                      format: date-time
                      type: string
                    container:
                      description: container is the Container whose repository has
                        the issue.
                      maxLength: 253
                      type: string
                    number:
                      description: number of the issue in its repository.
                      format: int32
                      minimum: 1
                      type: integer
                    recommend:
                      description: recommend is what an ask recommends.
                      properties:
                        answer:
                          description: answer is retry, close or wait.
                          enum:
                          - retry
                          - close
                          - wait
                          type: string
                        clarify:
                          description: clarify is the clarification a retry would
                            append to the issue's body.
                          maxLength: 4000
                          type: string
                        why:
                          description: why the round would do it.
                          maxLength: 1000
                          type: string
                      required:
                      - answer
                      type: object
                    round:
                      description: round is the round that answered it.
                      format: int32
                      minimum: 1
                      type: integer
                    tries:
                      description: tries is how many Tasks the issue had when it was
                        answered.
                      format: int32
                      minimum: 0
                      type: integer
                    why:
                      description: why the round answered so.
                      maxLength: 1000
                      type: string
                  required:
                  - answer
                  - at
                  - container
                  - number
                  - round
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
