---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: briefs.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Brief
    listKind: BriefList
    plural: briefs
    singular: brief
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.round
      name: Round
      type: integer
    - jsonPath: .status.suggestionsWaiting
      name: Suggestions
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Brief is an app idea in plain words and its follow-up prompts. A planner
          Agent turns each round (the idea, then each batch of new prompts) into the
          model, a Crew per new Container and the first issues, and says in plain
          words what it chose. Deleting a Brief keeps what it made.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the idea, the prompts and the Agents
            properties:
              agents:
                default: {}
                description: agents names the Agents the Brief works with.
                properties:
                  designer:
                    default:
                      name: designer
                    description: designer names the Agent that designs for the Crews.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  implementer:
                    default:
                      name: implementer
                    description: implementer names the Agent that implements the Crews'
                      issues.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  planner:
                    default:
                      name: planner
                    description: planner names the Agent that plans each round.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  reviewer:
                    default:
                      name: reviewer
                    description: reviewer names the Agent that reviews the Crews'
                      work.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              gitProviderRef:
                default:
                  name: gitea
                description: |-
                  gitProviderRef names the GitProvider that hosts the Brief's repository
                  and the repositories of the Containers it plans.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              idea:
                description: |-
                  idea says in plain words what the app is for and who uses it. It can't
                  change; steer with prompts.
                maxLength: 4000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: idea is immutable; add a prompt
                  rule: self == oldSelf
              prompts:
                description: |-
                  prompts are follow-ups in plain words, oldest first. A prompt is only
                  ever appended: an earlier one can't change or go.
                items:
                  maxLength: 2000
                  minLength: 1
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: 'prompts are append-only: an earlier prompt can''t change
                    or go'
                  rule: size(self) >= size(oldSelf) && oldSelf.all(i, p, self[i] ==
                    p)
            required:
            - idea
            type: object
            x-kubernetes-validations:
            - message: 'prompts are append-only: an earlier prompt can''t change or
                go'
              rule: '!has(oldSelf.prompts) || size(oldSelf.prompts) == 0 || has(self.prompts)'
          status:
            description: status defines the observed state of Brief
            properties:
              choices:
                description: choices are what the planner chose in the last round,
                  in plain words.
                items:
                  maxLength: 500
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: |-
                  conditions: Planned says whether the last round's plan is applied, and
                  why not. NeedsInput, while True, says in one sentence what the Brief
                  waits for from the person.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costMilliUSD:
                description: |-
                  costMilliUSD is what the Brief's planning cost over all rounds, in
                  thousandths of a US dollar.
                format: int64
                type: integer
              created:
                description: created lists the objects the Brief made, over all rounds.
                items:
                  description: BriefObject names an object a Brief created.
                  properties:
                    kind:
                      description: kind of the object, such as Container or Crew.
                      maxLength: 63
                      type: string
                    name:
                      description: name of the object.
                      maxLength: 253
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              history:
                description: history has an entry per round, oldest first; the newest
                  20 are kept.
                items:
                  description: 'BriefRound is one round of planning: the idea, or
                    a batch of new prompts.'
                  properties:
                    choices:
                      description: choices are what the planner chose, in plain words.
                      items:
                        maxLength: 500
                        type: string
                      maxItems: 50
                      type: array
                      x-kubernetes-list-type: atomic
                    costMilliUSD:
                      description: |-
                        costMilliUSD is what the round's planning cost, in thousandths of a
                        US dollar.
                      format: int64
                      type: integer
                    needsInput:
                      description: needsInput is the planner's question, when the
                        round asked for input.
                      maxLength: 1000
                      type: string
                    outcome:
                      description: 'outcome is how the round ended: Applied, PlannerNeedsInput
                        or RoundFailed.'
                      enum:
                      - Applied
                      - PlannerNeedsInput
                      - RoundFailed
                      type: string
                    round:
                      description: round is the round's number, from 1.
                      format: int32
                      minimum: 1
                      type: integer
                    runsWithoutCost:
                      description: |-
                        runsWithoutCost counts the round's planner runs whose agent didn't report
                        what they cost; costMilliUSD leaves them out.
                      format: int32
                      type: integer
                    summary:
                      description: summary says in a few words what the round did.
                      maxLength: 1000
                      type: string
                  required:
                  - round
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              issues:
                description: issues lists the issues the Brief filed, over all rounds.
                items:
                  description: BriefIssue is an issue a Brief filed.
                  properties:
                    "n":
                      description: n is the issue's number in its round's plan, as
                        in its marker.
                      format: int32
                      type: integer
                    number:
                      description: number of the issue in its repository.
                      format: int32
                      minimum: 1
                      type: integer
                    repository:
                      description: repository is the Container's repository, owner/name.
                      maxLength: 140
                      type: string
                    round:
                      description: round is the Brief round that filed the issue.
                      format: int32
                      type: integer
                    title:
                      description: title of the issue.
                      maxLength: 255
                      type: string
                    url:
                      description: url is the issue's address.
                      type: string
                  required:
                  - number
                  - repository
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: phase is Pending, Planning, Applying, Planned, NeedsInput
                  or Failed.
                enum:
                - Pending
                - Planning
                - Applying
                - Planned
                - NeedsInput
                - Failed
                type: string
              promptsPlanned:
                description: |-
                  promptsPlanned is how many of spec.prompts the last applied round took;
                  the prompts after them wait for the next round.
                format: int32
                type: integer
              repositoryURL:
                description: |-
                  repositoryURL is the Brief's own repository, where every round's plan
                  is kept.
                type: string
              round:
                description: |-
                  round is the number of the round running now or last run; 0 before the
                  first.
                format: int32
                type: integer
              roundPrompts:
                description: roundPrompts is how many of spec.prompts the running
                  or last round took.
                format: int32
                type: integer
              runsWithoutCost:
                description: |-
                  runsWithoutCost counts the planner runs, over all rounds, whose agent
                  didn't report what they cost; costMilliUSD leaves them out.
                format: int32
                type: integer
              suggestions:
                description: |-
                  suggestions are the reviewers' suggestions waiting in the repositories
                  of the Containers the Brief made, oldest first; at most 50. A prompt
                  answers them: the operator takes the ones it says to take, ready for
                  the Crew, and closes the ones it says to skip.
                items:
                  description: |-
                    BriefSuggestion is a reviewer's suggestion waiting in the repository of a
                    Container the Brief made, for the person to answer in a prompt.
                  properties:
                    container:
                      description: container is the Container whose repository has
                        the suggestion.
                      maxLength: 253
                      type: string
                    criteria:
                      description: |-
                        criteria says the suggestion has acceptance criteria, so a prompt can
                        take it as it stands.
                      type: boolean
                    number:
                      description: number of the suggestion's issue in its repository.
                      format: int32
                      minimum: 1
                      type: integer
                    title:
                      description: title of the suggestion.
                      maxLength: 255
                      type: string
                    url:
                      description: url is the suggestion's address.
                      type: string
                  required:
                  - container
                  - number
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              suggestionsWaiting:
                description: |-
                  suggestionsWaiting is how many reviewers' suggestions wait for an
                  answer, those past the 50 listed too.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
