---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: chats.theos.factory.io
spec:
  group: theos.factory.io
  names:
    categories:
    - theos
    kind: Chat
    listKind: ChatList
    plural: chats
    singular: chat
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.homeserver
      name: Homeserver
      type: string
    - jsonPath: .status.space.alias
      name: Space
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Chat is a project's rooms on a chat host, a Space on a Matrix homeserver
          or channels in a Slack workspace, where people follow and steer the
          factory: one per project namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the host, the bot's Secret, the rooms and the people.
            properties:
              aliasPrefix:
                description: |-
                  aliasPrefix names the aliases the operator gives the Space,
                  #<aliasPrefix>:<server>, and each room, #<aliasPrefix>-<purpose>:<server>,
                  by which it finds them again. Unset, it is theos-<namespace>. An alias
                  another account holds is not taken over: the Chat reports AliasTaken,
                  and a prefix of the user's own avoids it on a shared homeserver. On
                  Slack it names the channels, <aliasPrefix>-<purpose>, so it takes no
                  . or = and at most 70 characters.
                maxLength: 100
                minLength: 1
                pattern: ^[a-z0-9][a-z0-9._=-]*$
                type: string
                x-kubernetes-validations:
                - message: 'aliasPrefix is immutable: the rooms carry its aliases'
                  rule: self == oldSelf
              credentialsSecretRef:
                description: |-
                  credentialsSecretRef names a Secret in the Chat's namespace that the
                  user creates, holding the bot's access token under accessToken. The
                  bot is an ordinary Matrix account on the homeserver; it makes the Space
                  and the rooms and posts in them. Only the operator and theos-chat read
                  it.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              digestMinutes:
                default: 10
                description: |-
                  digestMinutes is how long the updates room's news waits to be posted
                  as one message; 0 posts each as it comes.
                format: int32
                maximum: 1440
                minimum: 0
                type: integer
              homeserver:
                description: |-
                  homeserver is the Matrix homeserver's address, http(s)://host[:port],
                  whose client-server API the operator and theos-chat call. Unset, it is
                  the operator's --chat-homeserver, the chart's in-cluster homeserver
                  when chat.homeserver.enabled; a Chat on another homeserver, matrix.org
                  included, names it here.
                maxLength: 2048
                type: string
                x-kubernetes-validations:
                - message: homeserver must be an http or https address, with no query
                    or fragment
                  rule: self.matches('^https?://[^/?#[:space:]]+(/[^?#[:space:]]*)?$')
              host:
                default: matrix
                description: |-
                  host is the chat app the Chat is on: matrix, a Matrix homeserver, or
                  slack, a Slack workspace. A Chat written before the field is on
                  matrix. It can't change: the rooms are on the host they were made on.
                enum:
                - matrix
                - slack
                type: string
                x-kubernetes-validations:
                - message: 'host is immutable: the rooms are on the host they were
                    made on'
                  rule: self == oldSelf
              people:
                description: |-
                  people may speak to the factory: each is invited to the Space and its
                  rooms, and their commands are made as their Kubernetes user and
                  groups, by impersonation, so the cluster's RBAC decides. Anyone else
                  in a room gets a one-line refusal. A Chat with host: slack lists its
                  people under slack.people instead.
                items:
                  description: |-
                    ChatPerson is a Matrix account and the Kubernetes identity its commands
                    are made as.
                  properties:
                    groups:
                      description: groups are the Kubernetes groups the person's commands
                        are made with.
                      items:
                        maxLength: 253
                        minLength: 1
                        type: string
                      maxItems: 20
                      type: array
                      x-kubernetes-list-type: set
                      x-kubernetes-validations:
                      - message: 'groups must be people''s groups, not system: groups'
                        rule: self.all(g, !g.startsWith('system:'))
                    matrixID:
                      description: matrixID is the person's Matrix user ID, @localpart:server.
                      maxLength: 255
                      type: string
                      x-kubernetes-validations:
                      - message: matrixID must be a Matrix user ID, @localpart:server
                        rule: self.matches('^@[a-z0-9._=/+-]+:[A-Za-z0-9.-]+(:[0-9]{1,5})?$')
                    user:
                      description: user is the Kubernetes user name the person's commands
                        are made as.
                      maxLength: 253
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: 'user must be a person''s name, not a system: identity'
                        rule: '!self.startsWith(''system:'')'
                  required:
                  - matrixID
                  - user
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - matrixID
                x-kubernetes-list-type: map
              rooms:
                default:
                  alerts: alerts
                  general: general
                  reviews: reviews
                  specs: specs
                  triage: triage
                  updates: updates
                description: |-
                  rooms names each room; each defaults to its purpose. On Slack each
                  keeps its default: a channel has one name, its alias.
                properties:
                  alerts:
                    default: alerts
                    description: |-
                      alerts holds failed deploys and Tasks, a red base and an unhealthy
                      factory part; retry on a failed Container.
                    maxLength: 255
                    minLength: 1
                    type: string
                  general:
                    default: general
                    description: |-
                      general answers questions and takes status, brief, prompt, pause,
                      resume and help.
                    maxLength: 255
                    minLength: 1
                    type: string
                  reviews:
                    default: reviews
                    description: |-
                      reviews holds a thread per deploy waiting for a person (approve
                      <version>) and each review's verdict.
                    maxLength: 255
                    minLength: 1
                    type: string
                  specs:
                    default: specs
                    description: |-
                      specs holds a thread per spec waiting for approval: approve, or
                      changes: <text>.
                    maxLength: 255
                    minLength: 1
                    type: string
                  triage:
                    default: triage
                    description: |-
                      triage holds each Triage Task's decision and a parked issue's question
                      as a thread; an answer there goes to the issue.
                    maxLength: 255
                    minLength: 1
                    type: string
                  updates:
                    default: updates
                    description: |-
                      updates holds merges, releases, deploys and Brief rounds, batched by
                      digestMinutes; nobody gives commands there.
                    maxLength: 255
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: each room needs a name of its own
                  rule: '[self.updates, self.general, self.triage, self.specs, self.reviews,
                    self.alerts].all(n, [self.updates, self.general, self.triage,
                    self.specs, self.reviews, self.alerts].filter(m, m == n).size()
                    == 1)'
              slack:
                description: |-
                  slack is what a Chat with host: slack holds of its own: its people,
                  by Slack member ID.
                properties:
                  people:
                    description: |-
                      people may speak to the factory, each by their Slack member ID: each
                      is invited to the rooms, and their commands are made as their
                      Kubernetes user and groups, by impersonation, so the cluster's RBAC
                      decides. Anyone else in a room gets a one-line refusal.
                    items:
                      description: |-
                        ChatSlackPerson is a Slack member and the Kubernetes identity their
                        commands are made as, held to the same rules as a ChatPerson.
                      properties:
                        groups:
                          description: groups are the Kubernetes groups the person's
                            commands are made with.
                          items:
                            maxLength: 253
                            minLength: 1
                            type: string
                          maxItems: 20
                          type: array
                          x-kubernetes-list-type: set
                          x-kubernetes-validations:
                          - message: 'groups must be people''s groups, not system:
                              groups'
                            rule: self.all(g, !g.startsWith('system:'))
                        slackID:
                          description: |-
                            slackID is the person's Slack member ID, U or W and then capital
                            letters and digits, which a message's sender carries; not the e-mail
                            address, which changes.
                          maxLength: 32
                          type: string
                          x-kubernetes-validations:
                          - message: 'slackID must be a Slack member ID: U or W, then
                              capital letters and digits'
                            rule: self.matches('^[UW][A-Z0-9]+$')
                        user:
                          description: user is the Kubernetes user name the person's
                            commands are made as.
                          maxLength: 253
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: 'user must be a person''s name, not a system:
                              identity'
                            rule: '!self.startsWith(''system:'')'
                      required:
                      - slackID
                      - user
                      type: object
                    maxItems: 100
                    type: array
                    x-kubernetes-list-map-keys:
                    - slackID
                    x-kubernetes-list-type: map
                type: object
              space:
                description: |-
                  space is the Space's display name. Unset, it is the Project's
                  displayName, else the namespace.
                maxLength: 255
                minLength: 1
                type: string
            required:
            - credentialsSecretRef
            type: object
            x-kubernetes-validations:
            - message: 'aliasPrefix can''t be set or unset once the Chat exists: the
                rooms carry its aliases'
              rule: has(self.aliasPrefix) == has(oldSelf.aliasPrefix)
            - message: 'slack is only for a Chat with host: slack'
              rule: '!has(self.slack) || (has(self.host) && self.host == ''slack'')'
            - message: 'a Chat with host: slack names no homeserver: that is Matrix''s'
              rule: '!has(self.host) || self.host != ''slack'' || !has(self.homeserver)'
            - message: 'a Chat with host: slack names no space: the Slack workspace
                is the Space'
              rule: '!has(self.host) || self.host != ''slack'' || !has(self.space)'
            - message: 'a Chat with host: slack lists its people under slack.people,
                by slackID, not under people'
              rule: '!has(self.host) || self.host != ''slack'' || !has(self.people)
                || size(self.people) == 0'
            - message: 'a Chat with host: slack keeps each room''s name its purpose:
                a channel is named <aliasPrefix>-<purpose>'
              rule: '!has(self.host) || self.host != ''slack'' || !has(self.rooms)
                || ((!has(self.rooms.updates) || self.rooms.updates == ''updates'')
                && (!has(self.rooms.general) || self.rooms.general == ''general'')
                && (!has(self.rooms.triage) || self.rooms.triage == ''triage'') &&
                (!has(self.rooms.specs) || self.rooms.specs == ''specs'') && (!has(self.rooms.reviews)
                || self.rooms.reviews == ''reviews'') && (!has(self.rooms.alerts)
                || self.rooms.alerts == ''alerts''))'
            - message: 'a Chat with host: slack needs an aliasPrefix Slack takes in
                a channel name: no . or =, at most 70 characters'
              rule: '!has(self.host) || self.host != ''slack'' || !has(self.aliasPrefix)
                || (size(self.aliasPrefix) <= 70 && self.aliasPrefix.matches(''^[a-z0-9_-]+$''))'
          status:
            description: status is the Space and rooms the operator made, and Ready.
            properties:
              bot:
                description: bot is the user ID on the chat host the bot's token belongs
                  to.
                type: string
              conditions:
                description: 'conditions: Ready and Invited.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              homeserver:
                description: |-
                  homeserver is the chat host's address the operator last reached the
                  rooms at: the Matrix homeserver, or Slack's Web API. theos-chat
                  reaches the host there.
                type: string
              invited:
                description: invited are the people invited to the Space and every
                  room.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              rooms:
                description: |-
                  rooms are the Chat's rooms, one per purpose: on Slack, private
                  channels.
                items:
                  description: ChatRoomStatus is one of a Chat's rooms.
                  properties:
                    alias:
                      description: |-
                        alias is the room's alias: #localpart:server on Matrix, #name on
                        Slack.
                      type: string
                    id:
                      description: |-
                        id is the room's ID: !opaque:server on Matrix, the channel's ID on
                        Slack.
                      type: string
                    purpose:
                      description: purpose is what the room holds.
                      enum:
                      - updates
                      - general
                      - triage
                      - specs
                      - reviews
                      - alerts
                      type: string
                  required:
                  - id
                  - purpose
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - purpose
                x-kubernetes-list-type: map
              space:
                description: |-
                  space is the Space the rooms belong to; unset on Slack, which has
                  none.
                properties:
                  alias:
                    description: 'alias is the room''s alias, #localpart:server.'
                    type: string
                  id:
                    description: id is the room's ID, !opaque:server.
                    type: string
                required:
                - id
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
