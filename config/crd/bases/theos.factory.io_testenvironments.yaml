---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: testenvironments.theos.factory.io
spec:
  group: theos.factory.io
  names:
    categories:
    - theos
    kind: TestEnvironment
    listKind: TestEnvironmentList
    plural: testenvironments
    singular: testenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.local.image
      name: Image
      priority: 1
      type: string
    - jsonPath: .spec.limits.maxLeases
      name: Max
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          TestEnvironment is a named set of tools, such as browser, android or
          godot, that the agents' runs and CI lease from a provider
          (docs/plans/test-environments.md).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the provider and the limits.
            properties:
              ci:
                description: |-
                  ci runs the project's CI jobs labelled env-<name> on the environment's
                  tools, so CI checks what the agents ran with theos-env
                  (docs/plans/test-environments.md, T8).
                properties:
                  runnerImage:
                    description: |-
                      runnerImage is a CI runner image, such as the release's base runner
                      image: each pod registers with it in an init container, which copies
                      its runner into the pod, and the jobs run on the environment's image. Unset, it is the
                      image of the first runner of the GitProvider's ci block.
                    maxLength: 500
                    type: string
                  size:
                    description: |-
                      size is how many idle pods wait for a job; 0, the default, keeps
                      none, so no pod runs until a workflow names the label.
                    format: int32
                    maximum: 8
                    minimum: 0
                    type: integer
                type: object
              description:
                description: |-
                  description says in one line what the environment has, for people and
                  for the agents and planner that choose it.
                maxLength: 200
                type: string
              limits:
                default: {}
                description: limits cap how many leases run at once and for how long.
                properties:
                  maxLeaseMinutes:
                    default: 180
                    description: |-
                      maxLeaseMinutes is how long one lease may last at most, as long as an
                      agent run by default; the provider ends a lease that outlives it.
                    format: int32
                    maximum: 1440
                    minimum: 5
                    type: integer
                  maxLeases:
                    default: 2
                    description: |-
                      maxLeases is how many leases may be live at once; a run that would
                      take one more waits, reason WaitingForEnvironment, AllLeased.
                    format: int32
                    maximum: 16
                    minimum: 1
                    type: integer
                type: object
              local:
                description: |-
                  local leases a pod in the project's namespace per run that needs the
                  environment, built from image, fenced like an agent sandbox.
                properties:
                  devices:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      devices are extended resources the pod requests and is limited to,
                      named as the cluster's device plugins name them, such as
                      devices.kubevirt.io/kvm: 1 for an Android emulator or nvidia.com/gpu: 1
                      for a game engine; a setting, since plugins differ per cluster.
                    maxProperties: 8
                    type: object
                    x-kubernetes-validations:
                    - message: devices are extended resources a device plugin names,
                        such as devices.kubevirt.io/kvm; cpu and memory go in resources
                      rule: self.all(k, k.contains('/'))
                  image:
                    description: |-
                      image has the environment's tools, such as
                      ghcr.io/jairjosafath/theos/env-browser:<version>. It is pinned: a tag
                      other than latest, or a digest.
                    maxLength: 500
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'image must be pinned: a tag other than latest, or
                        a digest'
                      rule: self.matches('@sha256:[0-9a-f]{64}$') || (self.matches('^[^@]+:[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$')
                        && !self.endsWith(':latest'))
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      nodeSelector puts the pod on nodes with these labels, such as the
                      nodes that have the devices.
                    type: object
                  resources:
                    description: resources are the environment container's requests
                      and limits.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  runtimeClassName:
                    description: |-
                      runtimeClassName is the RuntimeClass the pod runs under, such as one
                      a GPU operator installs; unset, the cluster's default.
                    maxLength: 253
                    type: string
                  tolerations:
                    description: tolerations let the pod run on tainted nodes, such
                      as GPU nodes.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    maxItems: 16
                    type: array
                required:
                - image
                type: object
            type: object
            x-kubernetes-validations:
            - message: 'set exactly one provider member: local'
              rule: '[has(self.local)].exists_one(x, x)'
          status:
            description: status is the live leases and the environment's readiness.
            properties:
              conditions:
                description: 'conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              leases:
                description: leases are the live leases, one per run that holds the
                  environment.
                items:
                  description: TestEnvironmentLease is one live lease of the environment.
                  properties:
                    costMilliUSD:
                      description: |-
                        costMilliUSD is what the lease cost so far, by the provider's count; 0
                        for local.
                      format: int64
                      type: integer
                    holder:
                      description: holder is the Task whose run holds the lease.
                      type: string
                    id:
                      description: |-
                        id is the lease's ID, which the provider names it by: for local, the
                        pod's name.
                      type: string
                    message:
                      description: message says why a lease is Pending or Failed.
                      type: string
                    since:
                      description: since is when the lease started.
                      format: date-time
                      type: string
                    state:
                      description: state is Pending, Ready, Failed or Ended.
                      type: string
                  required:
                  - id
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              spentToday:
                description: spentToday is what the leases cost today.
                properties:
                  day:
                    description: day is the UTC date, such as 2026-11-06.
                    type: string
                  milliUSD:
                    description: |-
                      milliUSD is the cost of the day's leases so far, the ended ones'
                      included.
                    format: int64
                    type: integer
                required:
                - day
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a TestEnvironment''s name is a DNS label of at most 32 characters
            that starts with a letter: jobs ask for it as env/<name>'
          rule: self.metadata.name.matches('^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
