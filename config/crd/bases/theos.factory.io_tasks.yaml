---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.theos.factory.io
spec:
  group: theos.factory.io
  names:
    categories:
    - theos
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.containerRef.name
      name: Container
      type: string
    - jsonPath: .spec.issue
      name: Issue
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.round
      name: Round
      type: integer
    - jsonPath: .status.checks.state
      name: Checks
      type: string
    - jsonPath: .status.review.verdict
      name: Review
      type: string
    - jsonPath: .status.verification.verdict
      name: Verified
      priority: 1
      type: string
    - jsonPath: .status.pullRequestURL
      name: PR
      priority: 1
      type: string
    - jsonPath: .spec.kind
      name: Kind
      priority: 1
      type: string
    - jsonPath: .spec.briefRef.name
      name: Brief
      priority: 1
      type: string
    - jsonPath: .status.triage.decision
      name: Decision
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Task is a goal for a Container. The operator runs an Agent in a sandbox to
          implement it on a branch, opens a pull request, waits for CI, runs the Agent
          again as reviewer, and merges when both pass; with a verifier, that Agent
          first builds, starts and checks the approved change. It is owned by its
          Container. A Plan Task is a planning round of a Brief, owned by the Brief. A Triage Task
          runs a triager on one proposed issue and applies what it decided. A Spec
          Task writes an issue's spec in a pull request that a person approves.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the goal, the Container and the Agent
            properties:
              agentRef:
                description: |-
                  agentRef names the Agent that implements the goal, and reviews it when no
                  reviewerRef is set. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: agentRef is immutable
                  rule: self == oldSelf
              allowedProtectedPaths:
                description: |-
                  allowedProtectedPaths are Standard-protected files, other than AGENTS.md,
                  docs/agents/ and .theos.yaml, that this Task may change. The agent
                  still proposes them, and the change goes through its own review. It needs
                  an issue, and it can't change.
                items:
                  maxLength: 256
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: allowedProtectedPaths may not include AGENTS.md, docs/agents/
                    or .theos.yaml
                  rule: self.all(p, p != 'AGENTS.md' && p != '.theos.yaml' && p !=
                    'docs/agents' && !p.startsWith('docs/agents/'))
                - message: allowedProtectedPaths is immutable
                  rule: self == oldSelf
              benchmark:
                description: |-
                  benchmark makes the Task one of a Benchmark's runs: it branches from
                  the Benchmark's base commit, never takes in main, and ends Approved
                  instead of merging. It can't change.
                properties:
                  base:
                    description: base is the commit the Task branches from.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  benchmarkRef:
                    description: benchmarkRef names the Benchmark.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  goal:
                    format: int32
                    minimum: 0
                    type: integer
                  repetition:
                    format: int32
                    minimum: 1
                    type: integer
                  variant:
                    description: |-
                      variant, goal and repetition say which run: the variant's name, the
                      goal's place (from 0) and the repetition (from 1).
                    maxLength: 16
                    type: string
                required:
                - base
                - benchmarkRef
                - repetition
                - variant
                type: object
                x-kubernetes-validations:
                - message: benchmark is immutable
                  rule: self == oldSelf
              briefRef:
                description: |-
                  briefRef names the Brief a Plan Task plans a round of, in place of
                  containerRef. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: briefRef is immutable
                  rule: self == oldSelf
              containerRef:
                description: |-
                  containerRef names the Container to work on; every Task but a Plan Task
                  has one. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: containerRef is immutable
                  rule: self == oldSelf
              goal:
                description: goal says what the change must achieve, in plain words.
                  It can't change.
                maxLength: 8000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: goal is immutable; create a new Task
                  rule: self == oldSelf
              issue:
                description: |-
                  issue is the number of an issue in the Container's repository whose title
                  and body are the goal. The operator reads it before each run, labels it with
                  the Task's progress, and closes it when the Task merges. It can't change.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: issue is immutable; create a new Task
                  rule: self == oldSelf
              kind:
                default: Implement
                description: |-
                  kind is Implement (the default): implement the goal in the Container's
                  repository; Plan: plan a round of the Brief named by briefRef; Triage:
                  decide what the issue needs next, which the operator then applies to the
                  issue; Spec: write the issue's spec, docs/specs/<issue>.md, which
                  merges after its review point and gives the issue its acceptance
                  criteria; or Score: judge another Task's finished change for the
                  Scorer named in score. It can't change.
                enum:
                - Implement
                - Plan
                - Triage
                - Spec
                - Score
                type: string
              reviewerRef:
                description: |-
                  reviewerRef names the Agent that reviews each round, so the review can use
                  another model than the work. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: reviewerRef is immutable
                  rule: self == oldSelf
              score:
                description: |-
                  score is what a Score Task judges: the Scorer that made it, the Task it
                  judges and the criteria, copied from the Scorer when it was made. It
                  can't change.
                properties:
                  config:
                    description: |-
                      config is the Agent configuration the judged Task's implementer ran on,
                      copied from its runs, so Scores compare configurations.
                    properties:
                      agent:
                        maxLength: 253
                        type: string
                      harness:
                        maxLength: 32
                        type: string
                      model:
                        maxLength: 100
                        type: string
                    type: object
                  criteria:
                    description: criteria are the Scorer's criteria, as they were.
                    items:
                      maxLength: 500
                      type: string
                    maxItems: 20
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                  scorerGeneration:
                    description: scorerGeneration is the Scorer's generation the criteria
                      are of.
                    format: int64
                    minimum: 1
                    type: integer
                  scorerRef:
                    description: scorerRef names the Scorer that made the Task.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  taskRef:
                    description: taskRef names the finished Task it judges.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - criteria
                - scorerGeneration
                - scorerRef
                - taskRef
                type: object
                x-kubernetes-validations:
                - message: score is immutable
                  rule: self == oldSelf
              verifierRef:
                description: |-
                  verifierRef names the Agent that verifies the change once the reviewer
                  approved it, before it merges: it builds and starts the change and
                  checks each acceptance criterion against what runs, in the phase
                  Verifying (docs/design.md, "Verify"). Only an Implement Task without
                  allowedProtectedPaths has one. Unset, the reviewer's approval merges. It
                  can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: verifierRef is immutable
                  rule: self == oldSelf
            required:
            - agentRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of goal and issue; a Plan Task has no issue
              rule: 'has(self.kind) && self.kind == ''Plan'' ? !has(self.issue) :
                has(self.goal) != has(self.issue)'
            - message: set exactly one of containerRef and briefRef
              rule: has(self.containerRef) != has(self.briefRef)
            - message: briefRef needs kind Plan
              rule: '!has(self.briefRef) || (has(self.kind) && self.kind == ''Plan'')'
            - message: a Plan Task needs a briefRef
              rule: '!has(self.kind) || self.kind != ''Plan'' || has(self.briefRef)'
            - message: a Plan Task has no reviewerRef
              rule: '!has(self.kind) || self.kind != ''Plan'' || !has(self.reviewerRef)'
            - message: a Triage Task needs an issue
              rule: '!has(self.kind) || self.kind != ''Triage'' || has(self.issue)'
            - message: a Triage Task has no reviewerRef and no allowedProtectedPaths
              rule: '!has(self.kind) || self.kind != ''Triage'' || (!has(self.reviewerRef)
                && !has(self.allowedProtectedPaths))'
            - message: a Spec Task needs an issue and has no allowedProtectedPaths
              rule: '!has(self.kind) || self.kind != ''Spec'' || (has(self.issue)
                && !has(self.allowedProtectedPaths))'
            - message: containerRef and briefRef are immutable; create a new Task
              rule: has(self.containerRef) == has(oldSelf.containerRef) && has(self.briefRef)
                == has(oldSelf.briefRef)
            - message: kind is immutable; create a new Task
              rule: '(has(self.kind) ? self.kind : ''Implement'') == (has(oldSelf.kind)
                ? oldSelf.kind : ''Implement'')'
            - message: goal and issue are immutable; create a new Task
              rule: has(self.goal) == has(oldSelf.goal) && has(self.issue) == has(oldSelf.issue)
            - message: reviewerRef is immutable
              rule: has(self.reviewerRef) == has(oldSelf.reviewerRef)
            - message: verifierRef is immutable
              rule: has(self.verifierRef) == has(oldSelf.verifierRef)
            - message: 'only an Implement Task without allowedProtectedPaths has a
                verifierRef: a spec, a plan, a triage and a Standard change are not
                verified'
              rule: '!has(self.verifierRef) || ((!has(self.kind) || self.kind == ''Implement'')
                && !has(self.allowedProtectedPaths))'
            - message: allowedProtectedPaths needs an issue
              rule: '!has(self.allowedProtectedPaths) || has(self.issue)'
            - message: allowedProtectedPaths is immutable
              rule: has(self.allowedProtectedPaths) == has(oldSelf.allowedProtectedPaths)
            - message: a Score Task needs score, and only a Score Task has one
              rule: (has(self.kind) && self.kind == 'Score') == has(self.score)
            - message: a Score Task has a goal and a containerRef, and no reviewerRef,
                verifierRef or allowedProtectedPaths
              rule: '!has(self.kind) || self.kind != ''Score'' || (has(self.goal)
                && has(self.containerRef) && !has(self.reviewerRef) && !has(self.verifierRef)
                && !has(self.allowedProtectedPaths))'
            - message: score is immutable
              rule: has(self.score) == has(oldSelf.score)
            - message: a Benchmark's Task is an Implement Task with a goal and no
                allowedProtectedPaths
              rule: '!has(self.benchmark) || ((!has(self.kind) || self.kind == ''Implement'')
                && has(self.goal) && !has(self.allowedProtectedPaths))'
            - message: benchmark is immutable
              rule: has(self.benchmark) == has(oldSelf.benchmark)
          status:
            description: status defines the observed state of Task
            properties:
              agentBackAt:
                description: |-
                  agentBackAt is when to try an unavailable agent again: its service hit a
                  usage limit, was overloaded or refused the credentials. Waiting costs no round.
                format: date-time
                type: string
              approval:
                description: |-
                  approval is what the Crew's approval rules ask of the Task's change,
                  once its checks passed, and who approved it when they ask for a
                  person. Unset for a Task whose Crew has no rules.
                properties:
                  approvedBy:
                    description: |-
                      approvedBy is who approved the change, once a person did: the Git host
                      user who approved the pull request, or the Kubernetes user who approved
                      it from chat (the theos.factory.io/approve-spec annotation; then
                      approvedInChat).
                    maxLength: 256
                    type: string
                  approvedInChat:
                    description: |-
                      approvedInChat says approvedBy approved the change from chat, not on
                      the Git host.
                    type: boolean
                  commit:
                    description: |-
                      commit is the head the answer is of; a later head is asked again once
                      its checks pass.
                    maxLength: 64
                    type: string
                  reason:
                    description: reason says which rule asks it, and for which file.
                    maxLength: 1024
                    type: string
                  require:
                    description: |-
                      require is what the change needs before it merges: Person, a person's
                      approval of its pull request after the agents'; Reviewer, the agents'
                      alone; or None, CI alone.
                    enum:
                    - Person
                    - Reviewer
                    - None
                    type: string
                  rule:
                    description: |-
                      rule is the number, from 1, of the rule in the Crew's approval that
                      decided; unset when a file no rule matches did.
                    format: int32
                    minimum: 0
                    type: integer
                  rules:
                    description: |-
                      rules names the Crew's rules the answer came from, by what they say:
                      when the Crew's rules change, the answer is worked out again.
                    maxLength: 64
                    type: string
                required:
                - require
                type: object
              branch:
                description: branch is where the agent works.
                type: string
              byHand:
                description: |-
                  byHand is the address of the kind/by-hand issue filed on merge for the
                  criteria the approved review left open, which need a person. A rerun of
                  the merge step that finds it set files none again.
                type: string
              checks:
                description: checks is the CI result on commit.
                properties:
                  commit:
                    description: commit is the SHA the checks ran on.
                    type: string
                  state:
                    description: state is pending, success, failure or error; empty
                      until a check reports.
                    type: string
                  url:
                    description: url links to the check run.
                    type: string
                type: object
              checksRerunAt:
                description: |-
                  checksRerunAt is when the failed jobs last ran again; a failed status is
                  read as their result only once every run at the commit ended, one started
                  since.
                format: date-time
                type: string
              checksRerunDue:
                description: |-
                  checksRerunDue means this round pushed again the commit whose checks
                  failed: their failed jobs run again before the checks are read.
                type: boolean
              checksReruns:
                description: |-
                  checksReruns counts the CI runs at this round's commit whose failed jobs
                  ran again because the machine killed them for lack of memory, without
                  spending the round.
                format: int32
                type: integer
              commit:
                description: commit is the head of the branch the current round produced.
                type: string
              completedAt:
                description: completedAt is when the Task was Merged or Failed.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions: Progressing and Succeeded, and NeedsYou while a Spec Task's
                  spec waits for a person's approval.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              continues:
                description: |-
                  continues names the earlier try, a Failed Task on the same issue, whose
                  open pull request this Task took over: its branch, pull request and
                  feedback became this Task's when its first run started.
                type: string
              costMilliUSD:
                description: |-
                  costMilliUSD is what the Task's agent runs cost so far, over all rounds,
                  in thousandths of a US dollar, as the agents reported it.
                format: int64
                type: integer
              countedPod:
                description: |-
                  countedPod is the UID of the pod, under the running sandbox, whose
                  interrupted run's cost and resume are counted already: a suspend that
                  fails after the count is tried again without counting them twice.
                type: string
              environments:
                description: |-
                  environments are the test environments the current run holds, one
                  lease each, taken before its sandbox and returned when it ends or is
                  suspended (docs/plans/done/test-environments.md, T3).
                items:
                  description: TaskEnvironmentLease is a lease of a test environment
                    a Task's run holds.
                  properties:
                    lease:
                      description: lease is the lease's ID, which the environment's
                        provider names it by.
                      type: string
                    name:
                      description: name is the TestEnvironment's.
                      type: string
                    sandbox:
                      description: sandbox is the run that holds it.
                      type: string
                    since:
                      description: since is when it was leased.
                      format: date-time
                      type: string
                  required:
                  - lease
                  - name
                  - sandbox
                  type: object
                maxItems: 16
                type: array
              feedback:
                description: |-
                  feedback is what the next round must address: review findings, failed
                  checks or the reason the last round failed.
                type: string
              followUps:
                description: followUps are the issues filed from the reviewer's suggestions
                  on merge.
                items:
                  type: string
                maxItems: 3
                type: array
                x-kubernetes-list-type: atomic
              history:
                description: |-
                  history is the Task's timeline, oldest first: an entry each time its phase,
                  round or Progressing reason changed. The newest 64 are kept.
                items:
                  description: |-
                    TaskTransition is one step in a Task's timeline: from at on, the Task was in
                    phase and round, for reason.
                  properties:
                    at:
                      description: at is when the step began.
                      format: date-time
                      type: string
                    message:
                      description: message says more, in up to 200 characters.
                      maxLength: 1024
                      type: string
                    phase:
                      description: phase is the Task's phase from then on.
                      enum:
                      - Pending
                      - Implementing
                      - Checking
                      - Reviewing
                      - Verifying
                      - AwaitingApproval
                      - Blocked
                      - Merged
                      - Failed
                      - Approved
                      type: string
                    reason:
                      description: |-
                        reason is the Progressing condition's reason, such as Running,
                        WaitingForSlot or Checking.
                      maxLength: 128
                      type: string
                    round:
                      description: round is the implement round.
                      format: int32
                      type: integer
                  required:
                  - at
                  - phase
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              issueTitle:
                description: |-
                  issueTitle is the title of spec.issue when the Task last read it, and
                  issueURL where to find the issue.
                type: string
              issueURL:
                type: string
              leasedEnvironments:
                description: |-
                  leasedEnvironments are the test environments any run of the Task
                  leased, by name: a by-hand issue its merge files names them.
                items:
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              mergeCommit:
                description: |-
                  mergeCommit is the commit the pull request's squash merge made on the
                  default branch, recorded once the Task is Merged. A Crew tags releases at it.
                type: string
              mergeWhenChecksPass:
                description: |-
                  mergeWhenChecksPass means the reviewer (and the verifier, when the Task
                  has one) approved the change and the operator merged main into its
                  branch, since main had moved since the change's checks ran: commit
                  merges once its checks pass, with no new review or verification.
                type: boolean
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              personCommits:
                description: |-
                  personCommits counts the merged pull request's commits a person wrote:
                  any not by an agent and not a merge (decision 3), read with
                  pullRequestSize. Zero means the factory alone wrote the change; unset,
                  that it wasn't read.
                format: int32
                minimum: 0
                type: integer
              phase:
                description: |-
                  phase is Pending, then Implementing, Checking and Reviewing each round,
                  and Verifying when the Task has a verifier, then Merged or Failed.
                  Blocked means the Task waits for a Standard change, and AwaitingApproval
                  a Spec Task's spec for a person's approval.
                enum:
                - Pending
                - Implementing
                - Checking
                - Reviewing
                - Verifying
                - AwaitingApproval
                - Blocked
                - Merged
                - Failed
                - Approved
                type: string
              phaseChangedAt:
                description: phaseChangedAt is when the Task entered its current phase.
                format: date-time
                type: string
              pullRequest:
                description: pullRequest is the number of the pull request, and pullRequestURL
                  its address.
                format: int32
                type: integer
              pullRequestEnded:
                description: |-
                  pullRequestEnded says how a Failed Task's pull request ended once the
                  operator saw it: closed by the operator and why, closed or merged on the
                  Git host, or continued by a newer try at the issue. Empty while the
                  pull request stays open for a later try.
                type: string
              pullRequestSize:
                description: |-
                  pullRequestSize is the size of the merged pull request's change, read
                  once when it merged with personCommits (docs/plans/done/measure-and-improve.md,
                  decision 4); unset before then, or when the Git host couldn't be read.
                  A value, not a pointer: a version that lacks the field carries it in an
                  annotation, which keeps no empty object.
                properties:
                  additions:
                    description: additions are the lines it adds.
                    format: int32
                    minimum: 0
                    type: integer
                  deletions:
                    description: deletions are the lines it removes.
                    format: int32
                    minimum: 0
                    type: integer
                  files:
                    description: files are the files it changes.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              pullRequestURL:
                type: string
              reruns:
                description: |-
                  reruns counts the runs in this round that the infrastructure interrupted
                  (a node shutdown, an eviction, a preemption) and that ran again without
                  spending the round.
                format: int32
                type: integer
              restarts:
                description: |-
                  restarts counts how often this round started over in place: sent back to
                  resolve conflicts with main, or resumed after its Standard change merged,
