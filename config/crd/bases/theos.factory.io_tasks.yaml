    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is a goal for a Container. The operator runs an Agent in a sandbox to
          implement it on a branch, opens a pull request, waits for CI, runs the Agent
          again as reviewer, and merges when both pass. It is owned by its Container. A
          Plan Task is a planning round of a Brief, owned by the Brief.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the goal, the Container and the Agent
            properties:
              agentRef:
                description: |-
                  agentRef names the Agent that implements the goal, and reviews it when no
                  reviewerRef is set. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: agentRef is immutable
                  rule: self == oldSelf
              allowedProtectedPaths:
                description: |-
                  allowedProtectedPaths are Standard-protected files, other than AGENTS.md,
                  docs/agents/ and .theos.yaml, that this Task may change. The agent
                  still proposes them, and the change goes through its own review. It needs
                  an issue, and it can't change.
                items:
                  maxLength: 256
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: allowedProtectedPaths may not include AGENTS.md, docs/agents/
                    or .theos.yaml
                  rule: self.all(p, p != 'AGENTS.md' && p != '.theos.yaml' && p !=
                    'docs/agents' && !p.startsWith('docs/agents/'))
                - message: allowedProtectedPaths is immutable
                  rule: self == oldSelf
              briefRef:
                description: |-
                  briefRef names the Brief a Plan Task plans a round of, in place of
                  containerRef. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: briefRef is immutable
                  rule: self == oldSelf
              containerRef:
                description: |-
                  containerRef names the Container to work on; every Task but a Plan Task
                  has one. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: containerRef is immutable
                  rule: self == oldSelf
              goal:
                description: goal says what the change must achieve, in plain words.
                  It can't change.
                maxLength: 8000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: goal is immutable; create a new Task
                  rule: self == oldSelf
              issue:
                description: |-
                  issue is the number of an issue in the Container's repository whose title
                  and body are the goal. The operator reads it before each run, labels it with
                  the Task's progress, and closes it when the Task merges. It can't change.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: issue is immutable; create a new Task
                  rule: self == oldSelf
              kind:
                default: Implement
                description: |-
                  kind is Implement (the default): implement the goal in the Container's
                  repository; or Plan: plan a round of the Brief named by briefRef. It can't
                  change.
                enum:
                - Implement
                - Plan
                type: string
              reviewerRef:
                description: |-
                  reviewerRef names the Agent that reviews each round, so the review can use
                  another model than the work. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: reviewerRef is immutable
                  rule: self == oldSelf
            required:
            - agentRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of goal and issue; a Plan Task has no issue
              rule: 'has(self.kind) && self.kind == ''Plan'' ? !has(self.issue) :
                has(self.goal) != has(self.issue)'
            - message: set exactly one of containerRef and briefRef
              rule: has(self.containerRef) != has(self.briefRef)
            - message: briefRef needs kind Plan
              rule: '!has(self.briefRef) || (has(self.kind) && self.kind == ''Plan'')'
            - message: a Plan Task needs a briefRef
              rule: '!has(self.kind) || self.kind != ''Plan'' || has(self.briefRef)'
            - message: a Plan Task has no reviewerRef
              rule: '!has(self.kind) || self.kind != ''Plan'' || !has(self.reviewerRef)'
            - message: containerRef and briefRef are immutable; create a new Task
              rule: has(self.containerRef) == has(oldSelf.containerRef) && has(self.briefRef)
                == has(oldSelf.briefRef)
            - message: kind is immutable; create a new Task
              rule: '(has(self.kind) ? self.kind : ''Implement'') == (has(oldSelf.kind)
                ? oldSelf.kind : ''Implement'')'
            - message: goal and issue are immutable; create a new Task
              rule: has(self.goal) == has(oldSelf.goal) && has(self.issue) == has(oldSelf.issue)
            - message: reviewerRef is immutable
              rule: has(self.reviewerRef) == has(oldSelf.reviewerRef)
            - message: allowedProtectedPaths needs an issue
              rule: '!has(self.allowedProtectedPaths) || has(self.issue)'
            - message: allowedProtectedPaths is immutable
              rule: has(self.allowedProtectedPaths) == has(oldSelf.allowedProtectedPaths)
          status:
            description: status defines the observed state of Task
            properties:
              agentBackAt:
                description: |-
                  agentBackAt is when to try an unavailable agent again: its service hit a
                  usage limit, was overloaded or refused the credentials. Waiting costs no round.
                format: date-time
                type: string
              branch:
                description: branch is where the agent works.
                type: string
              byHand:
                description: |-
                  byHand is the address of the kind/by-hand issue filed on merge for the
                  criteria the approved review left open, which need a person. A rerun of
                  the merge step that finds it set files none again.
                type: string
              checks:
                description: checks is the CI result on commit.
                properties:
                  commit:
                    description: commit is the SHA the checks ran on.
                    type: string
                  state:
                    description: state is pending, success, failure or error; empty
                      until a check reports.
                    type: string
                  url:
                    description: url links to the check run.
                    type: string
                type: object
              checksRerunAt:
                description: |-
                  checksRerunAt is when the failed jobs last ran again; a failed status is
                  read as their result only once every run at the commit ended, one started
                  since.
                format: date-time
                type: string
              checksRerunDue:
                description: |-
                  checksRerunDue means this round pushed again the commit whose checks
                  failed: their failed jobs run again before the checks are read.
                type: boolean
              checksReruns:
                description: |-
                  checksReruns counts the CI runs at this round's commit whose failed jobs
                  ran again because the machine killed them for lack of memory, without
                  spending the round.
                format: int32
                type: integer
              commit:
                description: commit is the head of the branch the current round produced.
                type: string
              completedAt:
                description: completedAt is when the Task was Merged or Failed.
                format: date-time
                type: string
              conditions:
                description: 'conditions: Progressing and Succeeded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              continues:
                description: |-
                  continues names the earlier try, a Failed Task on the same issue, whose
                  open pull request this Task took over: its branch, pull request and
                  feedback became this Task's when its first run started.
                type: string
              costMilliUSD:
                description: |-
                  costMilliUSD is what the Task's agent runs cost so far, over all rounds,
                  in thousandths of a US dollar, as the agents reported it.
                format: int64
                type: integer
              countedPod:
                description: |-
                  countedPod is the UID of the pod, under the running sandbox, whose
                  interrupted run's cost and resume are counted already: a suspend that
                  fails after the count is tried again without counting them twice.
                type: string
              feedback:
                description: |-
                  feedback is what the next round must address: review findings, failed
                  checks or the reason the last round failed.
                type: string
              followUps:
                description: followUps are the issues filed from the reviewer's suggestions
                  on merge.
                items:
                  type: string
                maxItems: 3
                type: array
                x-kubernetes-list-type: atomic
              history:
                description: |-
                  history is the Task's timeline, oldest first: an entry each time its phase,
                  round or Progressing reason changed. The newest 64 are kept.
                items:
                  description: |-
                    TaskTransition is one step in a Task's timeline: from at on, the Task was in
                    phase and round, for reason.
                  properties:
                    at:
                      description: at is when the step began.
                      format: date-time
                      type: string
                    message:
                      description: message says more, in up to 200 characters.
                      maxLength: 1024
                      type: string
                    phase:
                      description: phase is the Task's phase from then on.
                      enum:
                      - Pending
                      - Implementing
                      - Checking
                      - Reviewing
                      - Blocked
                      - Merged
                      - Failed
                      type: string
                    reason:
                      description: |-
                        reason is the Progressing condition's reason, such as Running,
                        WaitingForSlot or Checking.
                      maxLength: 128
                      type: string
                    round:
                      description: round is the implement round.
                      format: int32
                      type: integer
                  required:
                  - at
                  - phase
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              issueTitle:
                description: |-
                  issueTitle is the title of spec.issue when the Task last read it, and
                  issueURL where to find the issue.
                type: string
              issueURL:
                type: string
              mergeCommit:
                description: |-
                  mergeCommit is the commit the pull request's squash merge made on the
                  default branch, recorded once the Task is Merged. A Crew tags releases at it.
                type: string
              mergeWhenChecksPass:
                description: |-
                  mergeWhenChecksPass means the reviewer approved the change and the
                  operator merged main into its branch, since main had moved since the
                  change's checks ran: commit merges once its checks pass, with no new review.
                type: boolean
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is Pending, then Implementing, Checking and Reviewing each round, then
                  Merged or Failed. Blocked means the Task waits for a Standard change.
                enum:
                - Pending
                - Implementing
                - Checking
                - Reviewing
                - Blocked
                - Merged
                - Failed
                type: string
              phaseChangedAt:
                description: phaseChangedAt is when the Task entered its current phase.
                format: date-time
                type: string
              pullRequest:
                description: pullRequest is the number of the pull request, and pullRequestURL
                  its address.
                format: int32
                type: integer
              pullRequestEnded:
                description: |-
                  pullRequestEnded says how a Failed Task's pull request ended once the
                  operator saw it: closed by the operator and why, closed or merged on the
                  Git host, or continued by a newer try at the issue. Empty while the
                  pull request stays open for a later try.
                type: string
              pullRequestURL:
                type: string
              reruns:
                description: |-
                  reruns counts the runs in this round that the infrastructure interrupted
                  (a node shutdown, an eviction, a preemption) and that ran again without
                  spending the round.
                format: int32
                type: integer
              restarts:
                description: |-
                  restarts counts how often this round started over in place: sent back to
                  resolve conflicts with main, or resumed after its Standard change merged.
                  It gives each run of the round a sandbox name of its own.
                format: int32
                type: integer
              resumes:
                description: |-
                  resumes counts the runs in this round that the infrastructure
                  interrupted and that resumed in place, from the checkpoint their
                  sandbox kept, without a rerun or spending the round. Past five, an
                  interrupted run is rerun.
                format: int32
                type: integer
              review:
                description: review is the reviewer's latest verdict.
                properties:
                  summary:
                    description: summary is what the reviewer found.
                    type: string
                  verdict:
                    description: verdict is approve or changes.
                    type: string
                type: object
              reviewAgains:
                description: |-
                  reviewAgains counts the review runs in this round that started again
                  because the review run that approved a Standard change ended while CI ran
                  again. They spend no review attempt.
                format: int32
                type: integer
              reviewAttempts:
                description: reviewAttempts counts reviewer runs in this round that
                  gave no verdict.
                format: int32
                type: integer
              round:
                description: round is the implement round, from 1 up to the Agent's
                  maxRounds.
                format: int32
                type: integer
              runs:
                description: |-
                  runs records the Task's agent runs as each ends, oldest first: its round
                  and role, what it cost and used, and the sizes at which its sessions
                  handed off. The newest 64 are kept.
                items:
                  description: TaskAgentRun is what a Task keeps of one agent run
                    once it ended.
                  properties:
                    costMilliUSD:
                      description: |-
                        costMilliUSD is what the run cost, in thousandths of a US dollar, as its
                        agent reported it; unset when the agent didn't say.
                      format: int64
                      type: integer
                    endedAt:
                      description: endedAt is when the Task saw the run end.
                      format: date-time
                      type: string
                    role:
                      description: |-
                        role is implement, review or plan; empty when neither theos-agent nor the
                        sandbox's name said.
                      maxLength: 32
                      type: string
                    round:
                      description: round is the implement round the run belonged to.
                      format: int32
                      type: integer
                    sandbox:
                      description: sandbox names the Sandbox the run ran in.
                      maxLength: 63
                      type: string
                    sessionHandoffs:
                      description: |-
                        sessionHandoffs are the sizes, in tokens, at which the run's agent
                        sessions handed their work to a fresh session, the first 8.
                      items:
                        format: int64
                        type: integer
                      maxItems: 8
                      type: array
                      x-kubernetes-list-type: atomic
                    tokens:
                      description: |-
                        tokens is what the run's agent sessions used; runsWithout is 1 when the
                        agent didn't report them.
                      properties:
                        cacheRead:
                          description: cacheRead are the prompt tokens read from the
                            cache.
                          format: int64
                          type: integer
                        cacheWrite:
                          description: cacheWrite are the prompt tokens written to
                            the cache.
                          format: int64
                          type: integer
                        input:
                          description: |-
                            input are the prompt tokens that were neither read from nor written to
                            the cache.
                          format: int64
                          type: integer
                        largestSession:
                          description: |-
                            largestSession is how large the largest agent session got: the prompt
                            of its biggest turn, in tokens.
                          format: int64
                          type: integer
                        output:
                          description: output are the tokens the agents wrote.
                          format: int64
                          type: integer
                        runsWithout:
                          description: |-
                            runsWithout counts the agent runs whose agent didn't report their
                            tokens; the other fields leave them out.
                          format: int32
                          type: integer
                        sessionHandoffs:
                          description: |-
                            sessionHandoffs counts the agent sessions that handed their work to a
                            fresh session.
                          format: int32
                          type: integer
                      type: object
                  required:
                  - endedAt
                  - round
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              runsWithoutCost:
                description: |-
                  runsWithoutCost counts the Task's agent runs whose agent didn't report
                  what they cost; costMilliUSD leaves them out.
                format: int32
                type: integer
              sandbox:
                description: sandbox names the Sandbox running now, if any.
                type: string
              sandboxPod:
                description: |-
                  sandboxPod is the UID of the pod the running sandbox's run started on.
                  Agent Sandbox replaces a pod that went away without theos-agent ending it (a
                  forced delete, a lost node); another pod, or none, under the same sandbox
                  means the run was interrupted.
                type: string
              slotWaitSince:
                description: |-
                  slotWaitSince is when the Task started waiting for a free agent slot; the
                  longest waiter gets the next one.
                format: date-time
                type: string
              standardChange:
                description: |-
                  standardChange is the Standard change the Task filed last: the one it
                  waits for while Blocked. It stays after the Task resumes: it counts the
                  changes filed, a later filing doesn't reuse its issue, and a resumed round
                  that leaves nothing to do ends the Task as DoneByStandardChange. A Crew
                  grants its paths to the Task that runs the change.
                properties:
                  branch:
                    description: branch is where the change is made.
                    type: string
                  count:
                    description: count is how many Standard changes this Task has
                      proposed.
                    format: int32
                    type: integer
                  issue:
                    description: issue is the number of the issue filed for the change.
                    format: int32
                    type: integer
                  issueURL:
                    description: issueURL is where to find the issue.
                    type: string
                  paths:
                    description: paths are the protected files the proposal changes.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  resumedRound:
                    description: resumedRound is the round the Task resumed in after
                      the change merged.
                    format: int32
                    type: integer
                required:
                - count
                - issue
                - paths
                type: object
              summary:
                description: summary is the implementing agent's account of its latest
                  round.
                type: string
              tokens:
                description: |-
                  tokens is what the Task's agent runs used so far, over all rounds, and
                  how large the largest session got.
                properties:
                  cacheRead:
                    description: cacheRead are the prompt tokens read from the cache.
                    format: int64
                    type: integer
                  cacheWrite:
                    description: cacheWrite are the prompt tokens written to the cache.
                    format: int64
                    type: integer
                  input:
                    description: |-
                      input are the prompt tokens that were neither read from nor written to
                      the cache.
                    format: int64
                    type: integer
                  largestSession:
                    description: |-
                      largestSession is how large the largest agent session got: the prompt
                      of its biggest turn, in tokens.
                    format: int64
                    type: integer
                  output:
                    description: output are the tokens the agents wrote.
                    format: int64
                    type: integer
                  runsWithout:
                    description: |-
                      runsWithout counts the agent runs whose agent didn't report their
                      tokens; the other fields leave them out.
                    format: int32
                    type: integer
                  sessionHandoffs:
                    description: |-
                      sessionHandoffs counts the agent sessions that handed their work to a
                      fresh session.
                    format: int32
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
