    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Task is a goal for a Container. The operator runs an Agent in a sandbox to
          implement it on a branch, opens a pull request, waits for CI, runs the Agent
          again as reviewer, and merges when both pass. It is owned by its Container. A
          Plan Task is a planning round of a Brief, owned by the Brief. A Triage Task
          runs a triager on one proposed issue and applies what it decided. A Spec
          Task writes an issue's spec in a pull request that a person approves.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the goal, the Container and the Agent
            properties:
              agentRef:
                description: |-
                  agentRef names the Agent that implements the goal, and reviews it when no
                  reviewerRef is set. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: agentRef is immutable
                  rule: self == oldSelf
              allowedProtectedPaths:
                description: |-
                  allowedProtectedPaths are Standard-protected files, other than AGENTS.md,
                  docs/agents/ and .theos.yaml, that this Task may change. The agent
