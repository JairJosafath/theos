          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Relationship
            properties:
              description:
                description: description says what the link is, such as "Reads and
                  writes orders".
                maxLength: 200
                type: string
              source:
                description: source is the element the link starts from, and its owner.
                  It can't change.
                properties:
