                    enum:
                    - Person
                    - SoftwareSystem
                    - Container
                    - DataStore
                    type: string
                  name:
                    description: name of the element.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - source
            - target
            type: object
            x-kubernetes-validations:
