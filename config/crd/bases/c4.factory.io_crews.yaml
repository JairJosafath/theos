---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: crews.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Crew
    listKind: CrewList
    plural: crews
    singular: crew
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.containerRef.name
      name: Container
      type: string
    - jsonPath: .spec.implementer.name
      name: Implementer
      type: string
    - jsonPath: .spec.reviewer.name
      name: Reviewer
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.parallel
      name: Parallel
      type: integer
    - jsonPath: .status.activeTasks
      name: Tasks
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Crew is the team of Agents that works on a Container's issues: it picks up
          issues labelled ready, in order and once their dependencies are closed, and
          starts a Task for each, up to spec.parallel at once. It is owned by its
          Container.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the Container and the Agents for each role
            properties:
              containerRef:
                description: |-
                  containerRef names the Container whose repository's issues the Crew works
                  on. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: containerRef is immutable
                  rule: self == oldSelf
              description:
                description: description says what the Crew is for.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name.
                maxLength: 100
                type: string
              implementer:
                description: implementer names the Agent that implements each issue.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              parallel:
                default: 1
                description: |-
                  parallel is how many issues the Crew works on at once, each in its own Task
                  and branch. A change that conflicts with one merged before it goes back to
                  its implementer to merge main, without costing a round.
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              paused:
                description: |-
                  paused stops the Crew from picking up new issues. A Task already started
                  runs to its end.
                type: boolean
              prepareReleases:
                description: |-
                  prepareReleases lets the Crew file each release's prepare issue: once the
                  first open release is done with merged work and has no issue labelled
                  kind/release, the Crew files "Prepare vX.Y.Z" in its milestone, labelled
                  kind/release and status/ready, to set the version and write the changelog.
                  Its merge is then the release's newest, where tagReleases puts the tag; work
                  merged after it holds the tag for a person.
                type: boolean
              publishReleases:
                description: |-
                  publishReleases copies each release the Crew tags to another repository
                  once its release runs succeed: the same tag, notes and files. It only adds
                  releases there, never a commit. It needs tagReleases. Removing it stops
                  publishing; what is published stays.
                properties:
                  github:
                    description: github is the GitHub repository the releases go to.
                    properties:
                      repository:
                        description: repository is owner/name on github.com.
                        maxLength: 140
                        type: string
                        x-kubernetes-validations:
                        - message: repository must be owner/name
                          rule: self.matches('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')
                      tokenSecretRef:
                        description: |-
                          tokenSecretRef names a Secret in the Crew's namespace whose key token is
                          a fine-grained token for that repository alone, with Contents read and
                          write. The user creates it; the token never leaves the operator.
                        properties:
                          name:
                            description: name of the referenced object.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - repository
                    - tokenSecretRef
                    type: object
                  latest:
                    description: |-
                      latest says whether each release published becomes the repository's
                      Latest release on GitHub. It defaults to true; set it to false for every
                      app but the one people install, when several publish to one repository,
                      so a library's release doesn't take Latest from it. A release published
                      before it changed keeps what it got.
                    type: boolean
                  source:
                    description: |-
                      source puts the app's source, as of each release's tag, into a folder
                      of the repository, with a tag of its own, so go install from GitHub
                      finds it. The factory's own files are left out. Removing it stops
                      publishing the source; what is on GitHub stays.
                    properties:
                      path:
                        description: |-
                          path is the folder, such as engine; "." is the whole repository. The
                          folder is the app's: each release replaces what it holds. Two Crews
                          publishing to one repository need folders apart, neither inside the
                          other.
                        maxLength: 100
                        minLength: 1
                        pattern: ^([.]|[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)$
                        type: string
                        x-kubernetes-validations:
                        - message: path must have no '.', '..' or '.git' folder in
                            it
                          rule: self == '.' || !self.matches('(^|/)([.][.]?|[.][gG][iI][tT])(/|$)')
                      tagPrefix:
                        description: |-
                          tagPrefix goes before the Crew's tag in the source's tag. Unset, it is
                          the path and "/" (engine/v0.6.1, the tag go install looks for), and
                          nothing for ".".
                        maxLength: 101
                        pattern: ^[A-Za-z0-9._/-]*$
                        type: string
                        x-kubernetes-validations:
                        - message: 'tagPrefix must make a git tag name: no leading
                            ''.'', ''/'' or ''-'', no ''..'', ''//'' or ''/.'', and
                            no folder ending in .lock'
                          rule: '!self.matches(''^[./-]|//|/[.]|[.][.]|[.]lock(/|$)'')'
                    required:
                    - path
                    type: object
                  tagPrefix:
                    description: |-
                      tagPrefix goes before the Crew's tag on the target, such as "cli-" when
                      two Containers publish to one repository: cli-v0.2.0.
                    maxLength: 40
                    pattern: ^[A-Za-z0-9._/-]*$
                    type: string
                required:
                - github
                type: object
              reviewer:
                description: |-
                  reviewer names the Agent that reviews each round; usually a stronger model
                  than the implementer's.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              tagReleases:
                description: |-
                  tagReleases lets the Crew tag a release once it is done: a milestone with a
                  due date and a vMAJOR.MINOR.PATCH title, with no open issue and no Task at
                  work on one of its issues. The tag goes at the merge commit of the release's
                  most recently merged issue, and the milestone is then closed. Releases go
                  out in order, and an existing tag is never moved.
                type: boolean
            required:
            - containerRef
            - implementer
            - reviewer
            type: object
            x-kubernetes-validations:
            - message: 'publishReleases needs tagReleases: only a release the Crew
                tagged is published'
              rule: '!has(self.publishReleases) || (has(self.tagReleases) && self.tagReleases)'
          status:
            description: status defines the observed state of Crew
            properties:
              activeTasks:
                description: activeTasks names the Tasks working on the Container
                  now.
                items:
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: |-
                  conditions: Ready says whether the Crew can pick up issues, and why not.
                  Released, when spec.tagReleases is set, says whether the Crew's next
                  release went out, and why not. Published, when spec.publishReleases is
                  set, says how publishing the last release went, and why it failed.
                  ModulePublished, when spec.tagReleases is set and a release was tagged,
                  says whether the last release's Go module is in the registry, and why not.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fullCheck:
                description: |-
                  fullCheck is the full check of the next release, while it holds the tag:
                  set when the Container's checks are BeforeRelease and the release is done,
                  until the release is tagged.
                properties:
                  commit:
                    description: commit is the commit the tag will name, where the
                      branch points.
                    type: string
                  issue:
                    description: issue is the issue the Crew filed when the check
                      failed at commit.
                    format: int32
                    type: integer
                  run:
                    description: run is how the runs the branch's push started went,
                      as for a release.
                    enum:
                    - Waiting
                    - Running
                    - Succeeded
                    - Failed
                    type: string
                  runURL:
                    description: runURL links to the failed run, else to the newest
                      one.
                    type: string
                  tag:
                    description: tag is the release's version, the milestone's title.
                    type: string
                  time:
                    description: |-
                      time is when the Crew pushed the branch, or found it at the commit; the
                      hour a run has to start counts from it.
                    format: date-time
                    type: string
                required:
                - commit
                - tag
                - time
                type: object
              lastPolled:
                description: lastPolled is when the Crew last read the issues.
                format: date-time
                type: string
              lastRelease:
                description: lastRelease is the release the Crew tagged last, when
                  spec.tagReleases is set.
                properties:
                  bumps:
                    description: |-
                      bumps are the bump issues filed for this release, one per Container that
                      bundles this one.
                    items:
                      description: |-
                        CrewReleaseBump is a bump issue filed in a Container that bundles the released
                        one.
                      properties:
                        container:
                          description: container is the Container that bundles the
                            release.
                          type: string
                        issueURL:
                          description: issueURL is the bump issue's address.
                          type: string
                      required:
                      - container
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - container
                    x-kubernetes-list-type: map
                  commit:
                    description: commit is the commit the tag names.
                    type: string
                  goModule:
                    description: |-
                      goModule is the Go module the release published to the Git host's
                      package registry, under the module path its go.mod declares and with the
                      tag as its version.
                    properties:
                      checkedTime:
                        description: |-
                          checkedTime is when the Go proxy was last asked about the version; it is
                          asked at most every 5 minutes until it finds it.
                        format: date-time
                        type: string
                      message:
                        description: message says what happened last, and why the
                          module isn't published.
                        type: string
                      path:
                        description: path is the module path go.mod declares.
                        type: string
                      state:
                        description: |-
                          state is Published once go get finds the version where its path is
                          read: the registry for a c4factory.local/ path, the Go proxy for any
                          other. NotGo when the repository has no go.mod at its root at the tag,
                          Invalid when Go can't take the module at that version, such as a v2.0.0
                          whose module path lacks /v2, Failed while the Git host can't be reached
                          (tried again each poll), Waiting while the Crew's GitHub source tag isn't
                          out or the Go proxy can't be reached, and NotFetchable when the Go proxy
                          can't fetch the version or the factory can't tell.
                        enum:
                        - Published
                        - NotGo
                        - Invalid
                        - Failed
                        - Waiting
                        - NotFetchable
                        type: string
                      version:
                        description: version is the module's version, the release's
                          tag.
                        type: string
                    required:
                    - state
                    type: object
                  publish:
                    description: |-
                      publish is how publishing the release went, when spec.publishReleases is
                      set.
                    properties:
                      message:
                        description: message says what happened last, and why it failed.
                        type: string
                      source:
                        description: |-
                          source is the release's source on GitHub, once it is out, when the Crew
                          publishes it.
                        properties:
                          commit:
                            description: commit is the commit the source is in.
                            type: string
                          private:
                            description: |-
                              private is set when GitHub reported the repository private as the tag
                              went out: the public Go proxy can't read it.
                            type: boolean
                          tag:
                            description: tag is the source's tag.
                            type: string
                          url:
                            description: url is the source folder at the tag.
                            type: string
                        required:
                        - commit
                        - tag
                        type: object
                      state:
                        description: |-
                          state is Pending until the release runs succeed, Publishing while the
                          release is copied, Published once it is out and Failed while it can't
                          be; a failure is tried again each poll.
                        enum:
                        - Pending
                        - Publishing
                        - Published
                        - Failed
                        type: string
                      url:
                        description: url is the published release.
                        type: string
                    required:
                    - state
                    type: object
                  rerunTime:
                    description: |-
                      rerunTime is when the operator last re-ran the release's failed runs, on
                      a c4.factory.io/rerun-release request; the hour the runs have to end
                      counts from it instead of from time.
                    format: date-time
                    type: string
                  run:
                    description: |-
                      run is how the CI workflow runs the tag started went: Waiting until one
                      starts, Running while one hasn't ended, Failed as soon as one ended other
                      than success or skipped, Succeeded once all ended well.
                    enum:
                    - Waiting
                    - Running
                    - Succeeded
                    - Failed
                    type: string
                  runURL:
                    description: runURL links to the failed run, else to the newest
                      one.
                    type: string
                  tag:
                    description: tag is the release's version, the milestone's title.
                    type: string
                  time:
                    description: time is when the Crew tagged the release and closed
                      its milestone.
                    format: date-time
                    type: string
                required:
                - commit
                - tag
                - time
                type: object
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: phase is Waiting, Idle, Working or Paused.
                enum:
                - Waiting
                - Idle
                - Working
                - Paused
                type: string
              ready:
                description: |-
                  ready lists the ready issues waiting for a free place, in pick-up order:
                  the release due first first, and issues outside a release last.
                items:
                  format: int32
                  type: integer
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              rerunRelease:
                description: |-
                  rerunRelease is the c4.factory.io/rerun-release value the operator last
                  answered, so each value re-runs the failed release runs once.
                type: string
              waiting:
                description: waiting lists the ready issues that wait on open dependencies.
                items:
                  format: int32
                  type: integer
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
