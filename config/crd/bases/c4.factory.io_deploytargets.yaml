---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: deploytargets.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: DeployTarget
    listKind: DeployTargetList
    plural: deploytargets
    singular: deploytarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.github.repository
      name: Repository
      type: string
    - jsonPath: .spec.cloudFormation.region
      name: Region
      priority: 1
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DeployTarget is a place Containers run, with the credential the operator
          ships to it with, its tier and whether a person approves each version.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DeployTarget
            properties:
              approval:
                description: |-
                  approval is Required when a person lets each version in, None when every
                  release ships by itself. Empty means Required for a production target and
                  None for a development one.
                enum:
                - Required
                - None
                type: string
              argoCD:
                description: |-
                  argoCD ships each release of a Container with the k8s-manifests
                  Deployment as one Argo CD Application, in the cluster the operator runs
                  in or, with a kubeconfig in the Secret, another one: the Container's
                  repository at the release tag, its deploy/k8s path and the release's
                  image; Argo CD rolls it out.
                properties:
                  destination:
                    description: destination is where the apps run.
                    properties:
                      namespace:
                        description: namespace is the namespace the apps' manifests
                          go in.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      server:
                        default: https://kubernetes.default.svc
                        description: |-
                          server is the cluster, as Argo CD names it; the default is the
                          cluster Argo CD runs in.
                        maxLength: 253
                        type: string
                    required:
                    - namespace
                    type: object
                  gitURL:
                    description: |-
                      gitURL is the Git host's address, scheme://host[:port], as Argo CD
                      sees it. Set, it replaces the scheme and host of the repository's
                      clone URL in each Application; unset, Argo CD clones the URL the
                      operator does.
                    maxLength: 253
                    type: string
                    x-kubernetes-validations:
                    - message: gitURL must be scheme://host[:port]
                      rule: self.matches('^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$')
                  imageRegistry:
                    description: |-
                      imageRegistry is a registry the destination's nodes pull from,
                      host[:port][/path], as the nodes see it. Set, each release's image is
                      copied there, under the image's own repository after path, and the
                      Application names the copy; unset, it names the image in the owner's
                      registry.
                    maxLength: 253
                    pattern: ^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)*$
                    type: string
                  imageRegistryInsecure:
                    description: |-
                      imageRegistryInsecure speaks plain HTTP to imageRegistry, for a lab
                      registry without a certificate; unset, the copy uses TLS (#1770).
                    type: boolean
                  imageRepositoryLayout:
                    description: |-
                      imageRepositoryLayout is where the copy goes below imageRegistry's
                      path: nested, the default, keeps the image's own repository,
                      <owner>/<name>, as the in-cluster Gitea registry takes it; flat keeps
                      only <name>, for a registry that refuses a third path segment, such
                      as Docker Hub (#1770).
                    enum:
                    - nested
                    - flat
                    type: string
                  namespace:
                    default: argocd
                    description: namespace is where Argo CD runs and its Applications
                      live.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  project:
                    default: default
                    description: |-
                      project is the Argo CD project the Applications belong to; it exists
                      before the target is Ready.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - destination
                type: object
                x-kubernetes-validations:
                - message: imageRegistryInsecure needs imageRegistry
                  rule: '!(has(self.imageRegistryInsecure) && self.imageRegistryInsecure)
                    || has(self.imageRegistry)'
                - message: imageRepositoryLayout needs imageRegistry
                  rule: '!has(self.imageRepositoryLayout) || has(self.imageRegistry)'
              cloudFormation:
                description: |-
                  cloudFormation ships each release of an AWS Container, the CDK
                  assembly its release carries, as CloudFormation stacks in an AWS
                  account and region, through the roles of the account's CDK bootstrap
                  (docs/plans/aws-deploy.md).
                properties:
                  account:
                    description: |-
                      account is the twelve-digit AWS account id the credential must be
                      in: set, a credential of another account is refused, so a key for the
                      wrong account never deploys.
                    maxLength: 12
                    type: string
                    x-kubernetes-validations:
                    - message: account must be a twelve-digit AWS account id
                      rule: self.matches('^[0-9]{12}$')
                  region:
                    description: region is the AWS region the stacks run in, such
                      as eu-west-1.
                    maxLength: 30
                    type: string
                    x-kubernetes-validations:
                    - message: region must be an AWS region, such as eu-west-1
                      rule: self.matches('^[a-z]{2}(-[a-z]+)+-[0-9]+$')
                required:
                - region
                type: object
              credentialsSecretRef:
                description: |-
                  credentialsSecretRef names a Secret in the DeployTarget's namespace that
                  the user creates; its keys are the member's. For github: token, a
                  fine-grained token, or a GitHub App's appId, installationId and
                  privateKey (its PEM), token winning when both are set; packagesToken
                  is optional. For cloudFormation: accessKeyId, secretAccessKey and an
                  optional sessionToken. Only the operator reads it: it is never mounted
                  in a sandbox or passed to a CI job.
                  An argoCD target needs none: the operator uses its own ServiceAccount.
                  Its keys, each optional, are kubeconfig (the cluster Argo CD runs in,
                  when that is not the operator's) and registryUsername and
                  registryPassword (the login to argoCD.imageRegistry for the copy, which
                  reads tags as well as pushes).
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              github:
                description: |-
                  github ships each release as a GitHub release of a repository: its tag,
                  notes and files.
                properties:
                  latest:
                    description: |-
                      latest says whether each release shipped becomes the repository's
                      Latest release on GitHub. It defaults to true; set it to false on a
                      target for every app but the one people install, when several ship to
                      one repository, so a library's release doesn't take Latest from it.
                    type: boolean
                  repository:
                    description: repository is owner/name, on github.com or the server
                      at url.
                    maxLength: 140
                    type: string
                    x-kubernetes-validations:
                    - message: repository must be owner/name
                      rule: self.matches('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')
                  source:
                    description: |-
                      source publishes each release's source too: the app's files at the
                      release's tag, the factory's own left out, committed into a folder of
                      the repository and tagged, with the GitHub release made of that commit.
                      Unset, no source is published.
                    properties:
                      path:
                        description: |-
                          path is the folder, such as orders-cli; "." is the whole repository.
                          Unset, it is the Container's name, so any number of Containers share
                          the target. The folder is the app's: each release replaces what it
                          holds, so two Containers shipping to the target need folders apart,
                          neither inside the other.
                        maxLength: 100
                        minLength: 1
                        pattern: ^([.]|[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)$
                        type: string
                        x-kubernetes-validations:
                        - message: path must have no '.', '..' or '.git' folder in
                            it
                          rule: self == '.' || !self.matches('(^|/)([.][.]?|[.][gG][iI][tT])(/|$)')
                      tagPrefix:
                        description: |-
                          tagPrefix goes before the version in the source's tag. Unset, it is
                          the folder and "/" (orders-cli/v0.1.0, the tag go install looks for),
                          and nothing for ".".
                        maxLength: 101
                        pattern: ^[A-Za-z0-9._/-]*$
                        type: string
                        x-kubernetes-validations:
                        - message: 'tagPrefix must make a git tag name: no leading
                            ''.'', ''/'' or ''-'', no ''..'', ''//'' or ''/.'', and
                            no folder ending in .lock'
                          rule: '!self.matches(''^[./-]|//|/[.]|[.][.]|[.]lock(/|$)'')'
                    type: object
                  tagPrefix:
                    description: |-
                      tagPrefix goes before the version in each release's tag. Unset, it is
                      the Container's name and "-" (orders-cli-v0.1.0), so any number of
                      Containers share the target; set, it is used as it is for every
                      Container shipping there, "" giving bare tags (v0.1.0) on a
                      repository of one app.
                    maxLength: 40
                    pattern: ^[A-Za-z0-9._/-]*$
                    type: string
                    x-kubernetes-validations:
                    - message: 'tagPrefix must make a git tag name: no leading ''.'',
                        ''/'' or ''-'', no ''..'', ''//'' or ''/.'', and no folder
                        ending in .lock'
                      rule: '!self.matches(''^[./-]|//|/[.]|[.][.]|[.]lock(/|$)'')'
                  url:
                    description: |-
                      url is a GitHub Enterprise Server's address, https://host, for a
                      repository there; unset, the repository is on github.com. The
                      operator calls its API under /api/v3 and copies images to its
                      registry at containers.<host>, which needs the server's subdomain
                      isolation on.
                    maxLength: 200
                    type: string
                    x-kubernetes-validations:
                    - message: 'url must be https://host, with no path: the server''s
                        address, not its API''s'
                      rule: self.matches('^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$')
                    - message: url is for GitHub Enterprise Server; leave it unset
                        for github.com
                      rule: '!self.lowerAscii().matches(''^https://(www[.]|api[.])?github[.]com(:443)?$'')'
                required:
                - repository
                type: object
              parameters:
                additionalProperties:
                  type: string
                description: |-
                  parameters are deploy-time values that differ per place and are not
                  secret (an alert email, a certificate ARN, a domain), mapped by the
                  member's adapter. A secret value goes in the Secret, never here.
                maxProperties: 50
                type: object
              tier:
                default: development
                description: tier is development or production.
                enum:
                - development
                - production
                type: string
            type: object
            x-kubernetes-validations:
            - message: 'set exactly one target member: github, argoCD or cloudFormation'
              rule: '[has(self.github), has(self.argoCD), has(self.cloudFormation)].exists_one(x,
                x)'
            - message: set credentialsSecretRef unless the member is argoCD
              rule: has(self.credentialsSecretRef) || has(self.argoCD)
          status:
            description: status defines the observed state of DeployTarget
            properties:
              checkedTime:
                description: |-
                  checkedTime is when the operator last asked the target whether it
                  accepts the credential.
                format: date-time
                type: string
              conditions:
                description: 'conditions: Ready, from the member''s check of the credential.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: false
    subresources:
      status: {}
