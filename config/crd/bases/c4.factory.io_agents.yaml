            type: string
          metadata:
            type: object
          spec:
            description: spec defines the agent's image, credentials and limits
            properties:
              credentialsSecretRef:
                description: |-
                  credentialsSecretRef names the Secret with the agent's model credentials, such
                  as CLAUDE_CODE_OAUTH_TOKEN. Every key becomes an environment variable.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              description:
                description: description says what this Agent is good at.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name.
                maxLength: 100
                type: string
              env:
                description: env adds plain settings to the sandbox, such as C4AGENT_FAKE=1
                  for the stand-in agent.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
