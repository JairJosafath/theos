---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.containerRef.name
      name: Container
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.round
      name: Round
      type: integer
    - jsonPath: .status.checks.state
      name: Checks
      type: string
    - jsonPath: .status.review.verdict
      name: Review
      type: string
    - jsonPath: .status.pullRequestURL
      name: PR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is a goal for a Container. The operator runs an Agent in a sandbox to
          implement it on a branch, opens a pull request, waits for CI, runs the Agent
          again as reviewer, and merges when both pass. It is owned by its Container.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the goal, the Container and the Agent
            properties:
              agentRef:
                description: agentRef names the Agent that does the work and the review.
                  It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: agentRef is immutable
                  rule: self == oldSelf
              containerRef:
                description: containerRef names the Container to work on. It can't
                  change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: containerRef is immutable
                  rule: self == oldSelf
              goal:
                description: goal says what the change must achieve, in plain words.
                  It can't change.
                maxLength: 8000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: goal is immutable; create a new Task
                  rule: self == oldSelf
            required:
            - agentRef
            - containerRef
            - goal
            type: object
          status:
            description: status defines the observed state of Task
            properties:
              branch:
                description: branch is where the agent works.
                type: string
              checks:
                description: checks is the CI result on commit.
                properties:
                  commit:
                    description: commit is the SHA the checks ran on.
                    type: string
                  state:
                    description: state is pending, success, failure or error; empty
                      until a check reports.
                    type: string
                  url:
                    description: url links to the check run.
                    type: string
                type: object
              commit:
                description: commit is the head of the branch the current round produced.
                type: string
              completedAt:
                description: completedAt is when the Task was Merged or Failed.
                format: date-time
                type: string
              conditions:
                description: 'conditions: Progressing and Succeeded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              feedback:
                description: |-
                  feedback is what the next round must address: review findings, failed
                  checks or the reason the last round failed.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is Pending, then Implementing, Checking and Reviewing each round, then
                  Merged or Failed.
                enum:
                - Pending
                - Implementing
                - Checking
                - Reviewing
                - Merged
                - Failed
                type: string
              phaseChangedAt:
                description: phaseChangedAt is when the Task entered its current phase.
                format: date-time
                type: string
              pullRequest:
                description: pullRequest is the number of the pull request, and pullRequestURL
                  its address.
                format: int32
                type: integer
              pullRequestURL:
                type: string
              review:
                description: review is the reviewer's latest verdict.
                properties:
                  summary:
                    description: summary is what the reviewer found.
                    type: string
                  verdict:
                    description: verdict is approve or changes.
                    type: string
                type: object
              reviewAttempts:
                description: reviewAttempts counts reviewer runs in this round that
                  gave no verdict.
                format: int32
                type: integer
              round:
                description: round is the implement round, from 1 up to the Agent's
                  maxRounds.
                format: int32
                type: integer
              sandbox:
                description: sandbox names the Sandbox running now, if any.
                type: string
              slotWaitSince:
                description: |-
                  slotWaitSince is when the Task started waiting for a free agent slot; the
                  longest waiter gets the next one.
                format: date-time
                type: string
              summary:
                description: summary is the implementing agent's account of its latest
                  round.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
