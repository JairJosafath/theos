---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.containerRef.name
      name: Container
      type: string
    - jsonPath: .spec.issue
      name: Issue
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.round
      name: Round
      type: integer
    - jsonPath: .status.checks.state
      name: Checks
      type: string
    - jsonPath: .status.review.verdict
      name: Review
      type: string
    - jsonPath: .status.pullRequestURL
      name: PR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is a goal for a Container. The operator runs an Agent in a sandbox to
          implement it on a branch, opens a pull request, waits for CI, runs the Agent
          again as reviewer, and merges when both pass. It is owned by its Container.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the goal, the Container and the Agent
            properties:
              agentRef:
                description: |-
                  agentRef names the Agent that implements the goal, and reviews it when no
                  reviewerRef is set. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: agentRef is immutable
                  rule: self == oldSelf
              allowedProtectedPaths:
                description: |-
                  allowedProtectedPaths are Standard-protected files, other than AGENTS.md,
                  docs/agents/ and .c4factory.yaml, that this Task may change. The agent
                  still proposes them, and the change goes through its own review. It needs
                  an issue, and it can't change.
                items:
                  maxLength: 256
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: allowedProtectedPaths may not include AGENTS.md, docs/agents/
                    or .c4factory.yaml
                  rule: self.all(p, p != 'AGENTS.md' && p != '.c4factory.yaml' &&
                    p != 'docs/agents' && !p.startsWith('docs/agents/'))
                - message: allowedProtectedPaths is immutable
                  rule: self == oldSelf
              containerRef:
                description: containerRef names the Container to work on. It can't
                  change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: containerRef is immutable
                  rule: self == oldSelf
              goal:
                description: goal says what the change must achieve, in plain words.
                  It can't change.
                maxLength: 8000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: goal is immutable; create a new Task
                  rule: self == oldSelf
              issue:
                description: |-
                  issue is the number of an issue in the Container's repository whose title
                  and body are the goal. The operator reads it before each run, labels it with
                  the Task's progress, and closes it when the Task merges. It can't change.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: issue is immutable; create a new Task
                  rule: self == oldSelf
              reviewerRef:
                description: |-
                  reviewerRef names the Agent that reviews each round, so the review can use
                  another model than the work. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: reviewerRef is immutable
                  rule: self == oldSelf
            required:
            - agentRef
            - containerRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of goal and issue
              rule: has(self.goal) != has(self.issue)
            - message: goal and issue are immutable; create a new Task
              rule: has(self.goal) == has(oldSelf.goal) && has(self.issue) == has(oldSelf.issue)
            - message: reviewerRef is immutable
              rule: has(self.reviewerRef) == has(oldSelf.reviewerRef)
            - message: allowedProtectedPaths needs an issue
              rule: '!has(self.allowedProtectedPaths) || has(self.issue)'
            - message: allowedProtectedPaths is immutable
              rule: has(self.allowedProtectedPaths) == has(oldSelf.allowedProtectedPaths)
          status:
            description: status defines the observed state of Task
            properties:
              agentBackAt:
                description: |-
                  agentBackAt is when to try an unavailable agent again: its service hit a
                  usage limit, was overloaded or refused the credentials. Waiting costs no round.
                format: date-time
                type: string
              branch:
                description: branch is where the agent works.
                type: string
              checks:
                description: checks is the CI result on commit.
                properties:
                  commit:
                    description: commit is the SHA the checks ran on.
                    type: string
                  state:
                    description: state is pending, success, failure or error; empty
                      until a check reports.
                    type: string
                  url:
                    description: url links to the check run.
                    type: string
                type: object
              commit:
                description: commit is the head of the branch the current round produced.
                type: string
              completedAt:
                description: completedAt is when the Task was Merged or Failed.
                format: date-time
                type: string
              conditions:
                description: 'conditions: Progressing and Succeeded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              feedback:
                description: |-
                  feedback is what the next round must address: review findings, failed
                  checks or the reason the last round failed.
                type: string
              followUps:
                description: followUps are the issues filed from the reviewer's suggestions
                  on merge.
                items:
                  type: string
                maxItems: 3
                type: array
                x-kubernetes-list-type: atomic
              history:
                description: |-
                  history is the Task's timeline, oldest first: an entry each time its phase,
                  round or Progressing reason changed. The newest 64 are kept.
                items:
                  description: |-
                    TaskTransition is one step in a Task's timeline: from at on, the Task was in
                    phase and round, for reason.
                  properties:
                    at:
                      description: at is when the step began.
                      format: date-time
                      type: string
                    message:
                      description: message says more, in up to 200 characters.
                      maxLength: 1024
                      type: string
                    phase:
                      description: phase is the Task's phase from then on.
                      enum:
                      - Pending
                      - Implementing
                      - Checking
                      - Reviewing
                      - Blocked
                      - Merged
                      - Failed
                      type: string
                    reason:
                      description: |-
                        reason is the Progressing condition's reason, such as Running,
                        WaitingForSlot or Checking.
                      maxLength: 128
                      type: string
                    round:
                      description: round is the implement round.
                      format: int32
                      type: integer
                  required:
                  - at
                  - phase
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              issueTitle:
                description: |-
                  issueTitle is the title of spec.issue when the Task last read it, and
                  issueURL where to find the issue.
                type: string
              issueURL:
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is Pending, then Implementing, Checking and Reviewing each round, then
                  Merged or Failed. Blocked means the Task waits for a Standard change.
                enum:
                - Pending
                - Implementing
                - Checking
                - Reviewing
                - Blocked
                - Merged
                - Failed
                type: string
              phaseChangedAt:
                description: phaseChangedAt is when the Task entered its current phase.
                format: date-time
                type: string
              pullRequest:
                description: pullRequest is the number of the pull request, and pullRequestURL
                  its address.
                format: int32
                type: integer
              pullRequestURL:
                type: string
              review:
                description: review is the reviewer's latest verdict.
                properties:
                  summary:
                    description: summary is what the reviewer found.
                    type: string
                  verdict:
                    description: verdict is approve or changes.
                    type: string
                type: object
              reviewAttempts:
                description: reviewAttempts counts reviewer runs in this round that
                  gave no verdict.
                format: int32
                type: integer
              round:
                description: round is the implement round, from 1 up to the Agent's
                  maxRounds.
                format: int32
                type: integer
              sandbox:
                description: sandbox names the Sandbox running now, if any.
                type: string
              slotWaitSince:
                description: |-
                  slotWaitSince is when the Task started waiting for a free agent slot; the
                  longest waiter gets the next one.
                format: date-time
                type: string
              standardChange:
                description: standardChange is the Standard change the Task waits
                  for while Blocked.
                properties:
                  branch:
                    description: branch is where the change is made.
                    type: string
                  count:
                    description: count is how many Standard changes this Task has
                      proposed.
                    format: int32
                    type: integer
                  issue:
                    description: issue is the number of the issue filed for the change.
                    format: int32
                    type: integer
                  issueURL:
                    description: issueURL is where to find the issue.
                    type: string
                  paths:
                    description: paths are the protected files the proposal changes.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  resumedRound:
                    description: resumedRound is the round the Task resumed in after
                      the change merged.
                    format: int32
                    type: integer
                required:
                - count
                - issue
                - paths
                type: object
              summary:
                description: summary is the implementing agent's account of its latest
                  round.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
