---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: alertsources.theos.factory.io
spec:
  group: theos.factory.io
  names:
    categories:
    - theos
    kind: AlertSource
    listKind: AlertSourceList
    plural: alertsources
    singular: alertsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.deliveries
      name: Deliveries
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AlertSource names one sender of alerts, as a GitProvider names one Git
          host: an Alertmanager, a Sentry or any tool that posts JSON. Its firing
          alerts become bugs in the repositories of the Containers they concern
          (docs/plans/alerts.md). It belongs to the namespace, with no parent, and
          any number of Containers share it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AlertSource
            properties:
              commentInterval:
                default: 1h
                description: |-
                  commentInterval is the least time between two comments about one
                  alert, and between two "and N more"; at least 1m.
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: commentInterval must be a duration of at least 1m
                  rule: duration(self) >= duration('1m')
              containerLabel:
                default: theos_container
                description: |-
                  containerLabel is the label, tag or field of an alert that names its
                  Container.
                maxLength: 100
                minLength: 1
                pattern: ^[^\p{Z}\p{C}]+$
                type: string
              dailyLimit:
                default: 5
                description: |-
                  dailyLimit is how many issues the source files for one Container in
                  one UTC day; past it, the day's alerts fold into "and N more".
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              namespaceLabel:
                default: namespace
                description: |-
                  namespaceLabel is the label of an Alertmanager alert, or of a generic
                  body that has no namespace field, that names the namespace its app
                  runs in: namespace as Prometheus's Kubernetes metrics carry it, or the
                  name a Prometheus that relabels gives it (exported_namespace,
                  kubernetes_namespace).
                maxLength: 100
                minLength: 1
                pattern: ^[^\p{Z}\p{C}]+$
                type: string
              routes:
                description: |-
                  routes say where alerts go that name no Container: the first whose
                  namespace or project is the alert's.
                items:
                  description: |-
                    AlertSourceRoute sends the alerts of one namespace, or of one project of
                    the sender, that name no Container to a Container.
                  properties:
                    container:
                      description: |-
                        container is the Container of the AlertSource's namespace the alerts
                        go to.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: |-
                        namespace is the namespace an alert's app runs in, as the label
                        namespaceLabel names carries it.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    project:
                      description: project is the sender's project, such as Sentry's
                        project slug.
                      maxLength: 100
                      minLength: 1
                      pattern: ^[^\p{Z}\p{C}]+$
                      type: string
                  required:
                  - container
                  type: object
                  x-kubernetes-validations:
                  - message: a route has exactly one of namespace and project
                    rule: has(self.__namespace__) != has(self.project)
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              secretRef:
                description: |-
                  secretRef names a Secret in the namespace that checks each delivery:
                  key "token" for alertmanager (a bearer token), "secret" for sentry
                  (the integration's client secret), and for generic "secret" (an
                  HMAC key) or else "token".
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              type:
                description: |-
                  type is the sender: alertmanager, sentry or generic. Immutable, since
                  the type decides what makes two deliveries the same alert.
                enum:
                - alertmanager
                - sentry
                - generic
                type: string
                x-kubernetes-validations:
                - message: 'type is immutable: it decides what makes two deliveries
                    the same alert; make a new AlertSource'
                  rule: self == oldSelf
            required:
            - secretRef
            - type
            type: object
            x-kubernetes-validations:
            - message: 'containerLabel and namespaceLabel must differ, their defaults
                theos_container and namespace included: one label can''t name both
                an alert''s Container and its namespace'
              rule: '(has(self.containerLabel) ? self.containerLabel : ''theos_container'')
                != (has(self.namespaceLabel) ? self.namespaceLabel : ''namespace'')'
          status:
            description: status defines the observed state of AlertSource
            properties:
              alerts:
                description: alerts are the alerts the source remembers, at most 100.
                items:
                  description: |-
                    AlertSourceAlert is what the source remembers of one alert: model.AlertRecord
                    field for field.
                  properties:
                    container:
                      description: container is the Container the alert belongs to.
                      maxLength: 253
                      type: string
                    count:
                      description: count is its firing deliveries since filedAt, the
                        first included.
                      format: int64
                      type: integer
                    filedAt:
                      description: filedAt is when it was filed or folded.
                      format: date-time
                      type: string
                    folded:
                      description: folded says the alert came past the day's limit
                        and filed nothing.
                      type: boolean
                    issue:
                      description: |-
                        issue is the number of the issue the alert was filed as, or the one
                        its day's "and N more" is said on when it was folded.
                      format: int32
                      type: integer
                    key:
                      description: key is what makes two deliveries the same alert.
                      maxLength: 64
                      minLength: 1
                      type: string
                    lastSeen:
                      description: lastSeen is its last delivery.
                      format: date-time
                      type: string
                    name:
                      description: name is the alert's, for people who read status.
                      maxLength: 120
                      type: string
                    reported:
                      description: reported is the count its issue has said.
                      format: int64
                      type: integer
                    reportedAt:
                      description: reportedAt is when its issue last said anything
                        of it.
                      format: date-time
                      type: string
                    resolved:
                      description: resolved says the last delivery reported the alert
                        over.
                      type: boolean
                    saidResolved:
                      description: saidResolved says that what its issue last said
                        was that it resolved.
                      type: boolean
                  required:
                  - key
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              conditions:
                description: 'conditions: Ready, whether the source takes deliveries.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              containers:
                description: 'containers hold each Container''s day: what it filed
                  and folded.'
                items:
                  description: |-
                    AlertSourceContainerDay is what the source keeps of one Container's UTC
                    day: model.AlertDay field for field.
                  properties:
                    date:
                      description: date is the UTC day, 2006-01-02.
                      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      type: string
                    filed:
                      description: filed counts the issues filed that day.
                      format: int32
                      type: integer
                    foldReported:
                      description: |-
                        foldReported is folded and unrecorded together as the last "and N
                        more" said them.
                      format: int64
                      type: integer
                    foldReportedAt:
                      description: foldReportedAt is when the last "and N more" was
                        said.
                      format: date-time
                      type: string
                    folded:
                      description: folded counts the alerts past the limit that day,
                        each once.
                      format: int64
                      type: integer
                    lastIssue:
                      description: |-
                        lastIssue is the last issue filed that day, where its "and N more"
                        is said.
                      format: int32
                      type: integer
                    name:
                      description: name is the Container's.
                      maxLength: 253
                      minLength: 1
                      type: string
                    unrecorded:
                      description: |-
                        unrecorded counts the deliveries of alerts past the limit that status
                        had no room to remember.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              deliveries:
                description: deliveries counts the deliveries taken.
                format: int64
                type: integer
              lastDeliveryTime:
                description: lastDeliveryTime is when the last delivery was taken.
                format: date-time
                type: string
              unmatched:
                description: |-
                  unmatched counts the alerts that named no known Container, and says
                  why the last one didn't.
                properties:
                  count:
                    description: count is how many.
                    format: int64
                    type: integer
                  lastTime:
                    description: lastTime is when the last came.
                    format: date-time
                    type: string
                  message:
                    description: message says why the last one found no Container.
                    maxLength: 1024
                    type: string
                type: object
              unread:
                description: |-
                  unread counts the alerts that deliveries held past the first 100, or
                  that their sender said it left out.
                properties:
                  count:
                    description: count is how many.
                    format: int64
                    type: integer
                  lastTime:
                    description: lastTime is when the last came.
                    format: date-time
                    type: string
                type: object
              url:
                description: |-
                  url is where the sender delivers: the path, after the operator's
                  --git-events-url when that is set.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
