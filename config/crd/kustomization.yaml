# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/c4.factory.io_projects.yaml
- bases/c4.factory.io_softwaresystems.yaml
- bases/c4.factory.io_containers.yaml
- bases/c4.factory.io_datastores.yaml
- bases/c4.factory.io_relationships.yaml
- bases/c4.factory.io_sessions.yaml
- bases/c4.factory.io_people.yaml
- bases/c4.factory.io_gitproviders.yaml
- bases/c4.factory.io_frameworks.yaml
- bases/c4.factory.io_computes.yaml
- bases/c4.factory.io_deployments.yaml
- bases/c4.factory.io_connectors.yaml
- bases/c4.factory.io_standards.yaml
- bases/c4.factory.io_agents.yaml
- bases/c4.factory.io_tasks.yaml
- bases/c4.factory.io_crews.yaml
- bases/c4.factory.io_briefs.yaml
- bases/c4.factory.io_deploytargets.yaml
- bases/c4.factory.io_bundles.yaml
# +kubebuilder:scaffold:crdkustomizeresource

patches:
# Every CRD converts by the operator's webhook.
- path: patches/webhook_conversion.yaml
  target:
    kind: CustomResourceDefinition
# +kubebuilder:scaffold:crdkustomizewebhookpatch

# Teaches kustomize to name config/default's webhook Service in the CRDs.
configurations:
- kustomizeconfig.yaml
