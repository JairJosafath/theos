# Allow the API server's calls to the conversion webhook. It calls from
# outside any pod network, so no selector names it: the port is open, and
# TLS with the operator's own CA guards it (docs/plans/done/api-versions.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: c4-factory
    app.kubernetes.io/managed-by: kustomize
  name: allow-webhook-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: c4-factory
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
