apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: theos
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: theos
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: theos
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: theos
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          # Agents' checks write a lot; in memory they don't stall etcd on the
          # Kind node's disk (docs/results-v3.md).
          - --sandbox-workspace-memory=3Gi
          # Four agents at once: two Crews of two parallel Tasks each. v3 found
          # disk I/O, not CPU, was the limit, and moved it to memory; the sample
          # Agents cap CPU so one agent's tests can't take every core.
          - --max-agent-sandboxes=4
          # Sandboxes share a Go build cache on the node, so a round, its reviewer
          # and the next Task don't compile again what an earlier one did. CI's
          # cache is a sibling no sandbox mounts (config/runner/go.yaml).
          - --sandbox-go-cache=/var/cache/theos/go/sandbox
          # Each project's CI runner pool mounts its own directory under this
          # one; the shared runners' cache is a sibling (config/runner/go.yaml),
          # so no shared runner mounts a project's.
          - --ci-go-cache=/var/cache/theos/go/projects
          # The agents' Claude token, made once in this namespace by make
          # claude-secret, read there by the model proxy and never copied into
          # a project namespace (docs/dev/devices.md).
          - --shared-secret=claude-credentials
          # Agents on that Secret hold no token: their sandboxes reach Claude
          # through the model proxy of config/model-proxy (namePrefix
          # theos-), which adds it (docs/plans/done/model-proxy.md).
          - --model-proxy-url=http://theos-model-proxy.theos-system.svc:8080
          # The UI of config/ui reads the agent sandboxes' pods in each project
          # namespace; nowhere else but the factory's own (#1080).
          - --ui-service-account=theos-ui/theos-ui
          # The operator issues the webhook certificate into this Secret for
          # config/default's webhook Service (namePrefix theos-) and
          # patches its CA into the CRDs (docs/plans/done/api-versions.md).
          - --webhook-service=theos-webhook-service
          - --webhook-cert-secret=theos-webhook-cert
          # The receiver of Gitea's deliveries, and where each GitProvider's
          # hook delivers: config/default's Service (namePrefix theos-), which
          # config/gitea's Gitea is allowed to reach (docs/plans/done/git-events.md,
          # decision 10).
          - --git-events-bind-address=:8082
          - --git-events-url=http://theos-git-events.theos-system.svc:8082
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8082
          name: git-events
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          # A busy single-node host can keep a healthy process from answering
          # within the 1 s default; only a real hang should restart it (#957).
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        # Templates are cloned in memory while scaffolding; they are small, but
        # leave some headroom.
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        # The root filesystem is read-only; a Go module is repacked through
        # files here when a release publishes it (internal/adapters/gitea).
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
