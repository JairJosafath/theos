# theos-chat's ServiceAccount and RBAC (docs/plans/chat-matrix.md): it reads
# theos's objects, keeps its own ConfigMap in each Chat's namespace and
# impersonates each Chat's people to run their commands as them. The
# Deployment and the chart's copy come with the chart (the plan's step 3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app.kubernetes.io/part-of: theos
    app.kubernetes.io/managed-by: kustomize
  includeSelectors: false
resources:
- rbac.yaml
