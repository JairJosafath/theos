# theos-chat's ServiceAccount and RBAC (docs/plans/done/chat-matrix.md): it reads
# theos's objects, keeps its own ConfigMap in each Chat's namespace and
# impersonates each Chat's people to run their commands as them. The chart
# runs it (dist/chart/templates/chat, chat.enabled) with a copy of this RBAC,
# which test/chart/chat_test.go holds equal.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app.kubernetes.io/part-of: theos
    app.kubernetes.io/managed-by: kustomize
  includeSelectors: false
resources:
- rbac.yaml
