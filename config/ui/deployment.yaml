apiVersion: apps/v1
kind: Deployment
metadata:
  name: theos-ui
  labels:
    app.kubernetes.io/name: theos-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: theos-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: theos-ui
    spec:
      serviceAccountName: theos-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ui
        image: theos/ui:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "8080"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          # A busy single-node host can keep a healthy process from answering
          # within the 1 s default; only a real hang should restart it (#957).
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
