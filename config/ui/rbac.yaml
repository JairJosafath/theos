apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-factory-ui
  labels:
    app.kubernetes.io/name: c4-factory-ui
---
# Read-only access to the story, the Sessions and the catalog, in every
# namespace (one Project per namespace, so the project picker needs them all).
# No status subresources, no Secrets, no verbs that write.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-factory-ui-reader
  labels:
    app.kubernetes.io/name: c4-factory-ui
rules:
- apiGroups: [c4.factory.io]
  resources:
  - projects
  - people
  - softwaresystems
  - containers
  - datastores
  - relationships
  - sessions
  - frameworks
  - computes
  - deployments
  - connectors
  - gitproviders
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-factory-ui-reader
  labels:
    app.kubernetes.io/name: c4-factory-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c4-factory-ui-reader
subjects:
- kind: ServiceAccount
  name: c4-factory-ui
  namespace: c4-factory-ui
