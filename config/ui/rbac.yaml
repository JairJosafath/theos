apiVersion: v1
kind: ServiceAccount
metadata:
  name: theos-ui
  labels:
    app.kubernetes.io/name: theos-ui
---
# Read-only access to the story, the Sessions, the catalog and the factory's
# work (Agents, Tasks, Crews), in every namespace (one Project per namespace, so
# the project picker needs them all), the Briefs and the Chats included.
# No status subresources, no Secrets, no verbs that write: the Brief writes
# are their own ClusterRole below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: theos-ui-reader
  labels:
    app.kubernetes.io/name: theos-ui
rules:
- apiGroups: [theos.factory.io]
  resources:
  - projects
  - people
  - softwaresystems
  - containers
  - datastores
  - relationships
  - sessions
  - frameworks
  - computes
  - deployments
  - bundles
  - connectors
  - gitproviders
  - deploytargets
  - standards
  - agents
  - tasks
  - crews
  - briefs
  - chats
  - benchmarks
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: theos-ui-reader
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-reader
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
---
# For GET /factory/health, read by server.mjs itself: the node, and its CPU
# and memory from metrics-server. The server sends the browser only a summary
# (names, states, restarts, usage), never pod specs, and the browser can't
# reach these paths through /k8s. Still no Secrets, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: theos-ui-health
  labels:
    app.kubernetes.io/name: theos-ui
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list]
- apiGroups: [metrics.k8s.io]
  resources: [nodes]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: theos-ui-health
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-health
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
---
# The pods and their metrics, for the same summary: only in the namespaces of
# ui/health.mjs's components, bound below. The operator lets the UI read them
# in each project namespace too, for the agent sandboxes (--ui-service-account).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: theos-ui-pods
  labels:
    app.kubernetes.io/name: theos-ui
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: theos-ui-pods
  namespace: theos-system
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-pods
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: theos-ui-pods
  namespace: gitea
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-pods
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: theos-ui-pods
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-pods
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: theos-ui-pods
  namespace: theos-ui
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-pods
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: theos-ui-pods
  namespace: kube-system
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-pods
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
---
# The UI's only three writes (ui/server.mjs checks them first): create a
# Brief, the box for an idea, and patch one to append a follow-up prompt or to
# set spec.paused. Nothing else: no update, delete or status, no other kind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: theos-ui-brief-writer
  labels:
    app.kubernetes.io/name: theos-ui
rules:
- apiGroups: [theos.factory.io]
  resources: [briefs]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: theos-ui-brief-writer
  labels:
    app.kubernetes.io/name: theos-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: theos-ui-brief-writer
subjects:
- kind: ServiceAccount
  name: theos-ui
  namespace: theos-ui
