# theos-chat runs each person's commands as the Kubernetes user and groups
# their Chat.spec.people entry names (docs/plans/done/chat-matrix.md), so an
# entry is a grant of that identity to a Matrix account. Each person adds
# only themselves: an entry may name a user only if it is the writer's own,
# request.userInfo.username, and groups only from the writer's
# request.userInfo.groups, unless that exact entry was there before. So
# nobody can make a Matrix account act as someone else, and theos-chat's
# right to impersonate reaches only who added themselves. A Slack Chat's
# spec.slack.people, keyed by slackID, is held the same way
# (docs/plans/requests-and-chat.md, decision 10). The chart's copy,
# dist/chart/templates/extras/chat-people-are-themselves.yaml, is kept by
# hand: change both.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chat-people-are-themselves
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["theos.factory.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["chats"]
  variables:
    - name: old
      expression: "oldObject != null && has(oldObject.spec.people) ? oldObject.spec.people : []"
    # The entries neither there before, exactly, nor the writer's own.
    - name: foreign
      expression: >-
        (has(object.spec.people) ? object.spec.people : []).filter(p,
        !variables.old.exists(o, o.matrixID == p.matrixID && o.user == p.user &&
        (has(o.groups) ? o.groups : []) == (has(p.groups) ? p.groups : [])) &&
        !(p.user == request.userInfo.username &&
        (!has(p.groups) || p.groups.all(g, g in request.userInfo.groups))))
    - name: oldSlack
      expression: >-
        oldObject != null && has(oldObject.spec.slack) && has(oldObject.spec.slack.people) ?
        oldObject.spec.slack.people : []
    # The same, of spec.slack.people.
    - name: foreignSlack
      expression: >-
        (has(object.spec.slack) && has(object.spec.slack.people) ? object.spec.slack.people : []).filter(p,
        !variables.oldSlack.exists(o, o.slackID == p.slackID && o.user == p.user &&
        (has(o.groups) ? o.groups : []) == (has(p.groups) ? p.groups : [])) &&
        !(p.user == request.userInfo.username &&
        (!has(p.groups) || p.groups.all(g, g in request.userInfo.groups))))
  validations:
    - expression: "size(variables.foreign) == 0"
      messageExpression: >-
        'spec.people may name only the writer, ' + request.userInfo.username +
        ', and groups the writer is in; each person adds themselves: ' +
        variables.foreign.map(p, p.matrixID + ' as ' + p.user).join(', ')
      reason: Forbidden
    - expression: "size(variables.foreignSlack) == 0"
      messageExpression: >-
        'spec.slack.people may name only the writer, ' + request.userInfo.username +
        ', and groups the writer is in; each person adds themselves: ' +
        variables.foreignSlack.map(p, p.slackID + ' as ' + p.user).join(', ')
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chat-people-are-themselves-binding
spec:
  policyName: chat-people-are-themselves
  validationActions: [Deny]
