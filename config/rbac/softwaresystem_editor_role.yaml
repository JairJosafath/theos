# This rule is not used by the project c4-factory itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the c4.factory.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: c4-factory
    app.kubernetes.io/managed-by: kustomize
  name: softwaresystem-editor-role
rules:
- apiGroups:
  - c4.factory.io
  resources:
  - softwaresystems
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - c4.factory.io
  resources:
  - softwaresystems/status
  verbs:
  - get
