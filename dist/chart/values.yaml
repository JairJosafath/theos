## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: ghcr.io/jairjosafath/theos/operator
    ## Image tag (defaults to Chart.appVersion if not set): a released chart
    ## runs its own version's images
    ##
    tag: ""
    pullPolicy: IfNotPresent

  ## Arguments (go run ./cmd --help lists them). These are the Kind test
  ## environment's: four agent sandboxes at once, each workspace in memory up to
  ## 3Gi, and a Go build cache the sandboxes share on the node.
  ##
  args:
    - --leader-elect
    - --sandbox-workspace-memory=3Gi
    - --max-agent-sandboxes=4
    - --sandbox-go-cache=/var/cache/theos/go/sandbox
    # Each project's CI runner pool mounts its own directory under this one, a
    # sibling of the shared runners' cache (runners.go.goCache).
    - --ci-go-cache=/var/cache/theos/go/projects

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration. The operator issues its own certificate
## into the Secret <release>-webhook-cert and patches the CA into the CRDs
## that convert by webhook; cert-manager is not needed. A CRD converts by
## webhook only while its kind's versions differ in shape (none today: every
## kind is served at v1beta1 alone); the rest convert by the API server, and a
## kind that needs the webhook refuses to render without it.
##
webhook:
  enabled: true
  # Webhook server port
  port: 9443

## The receiver of the Git host's event deliveries (docs/plans/done/git-events.md,
## decision 10): the operator listens on port (--git-events-bind-address) and
## registers a hook on each GitProvider's organization that delivers to url
## (--git-events-url), so it reconciles when a repository changes instead of
## waiting for its poll. Each delivery is signed with the GitProvider's own
## Secret, which the operator makes in the cluster; none is rendered here.
## Off: no hook, no receiver, and the operator polls the host.
##
gitEvents:
  enabled: true
  # The receiver's port, on the manager container and on Service
  # <release>-git-events.
  port: 8082
  ## The address the Git host delivers to. Empty: the Service's cluster name,
  ## http://<release>-git-events.<release namespace>.svc:<port>, which the
  ## chart's Gitea reaches. The chart's Gitea allows webhooks to this URL's
  ## host and no other (GITEA__webhook__ALLOWED_HOST_LIST; gitea.config
  ## overrides it). A Gitea of your own needs an address it reaches, and that
  ## host in its own [webhook] ALLOWED_HOST_LIST.
  ##
  url: ""
  ## Who may reach the port, as NetworkPolicy peers. Empty: the pods of
  ## gitea.namespace. A Gitea of your own elsewhere needs its peer here, such
  ## as an ipBlock.
  ##
  from: []

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## The Go proxy the operator asks whether go get finds a released Go module
## whose path is outside theos.local/ (the operator's --go-proxy). off asks
## none, for an install without that egress: the Crew's own GitHub source tag
## is then the answer.
##
goProxy: https://proxy.golang.org

## The StorageClass of each agent sandbox's checkpoint volume (1Gi), where an
## interrupted run is saved to resume in place (the operator's
## --sandbox-checkpoint-storage-class). Empty uses the cluster's default
## class; on a cluster without one the volume never binds and no sandbox pod
## schedules, so name a class, or set none: sandboxes then get no checkpoint
## volume, and an interrupted run runs again from the start.
##
checkpointStorageClass: ""

## Where cluster DNS runs: the peers the agent and CI fences let port 53 out
## to (the operator's --cluster-dns, and the CI runners' NetworkPolicy). Each
## entry is namespace/key=value[,key=value], a namespace and pod labels, or an
## address block inside the private ranges (a bare address means /32). The
## default fits kube-dns or CoreDNS in kube-system. A cluster whose pods
## resolve through NodeLocal DNSCache needs its link-local address
## (169.254.20.10/32; keep the default too when some pods still use the
## Service), and one with DNS in another namespace its pods' labels
## (OpenShift: openshift-dns/dns.operator.openshift.io/daemonset-dns=default).
## Without the right entry, sandboxes and CI runners resolve nothing. The
## UI's ui.components dns entry is separate: set it too when DNS runs elsewhere.
##
clusterDNS:
  - kube-system/k8s-app=kube-dns

## Where a scaffolded devcontainer's theos-session feature downloads the Session
## client (the operator's --session-binary-url); ${arch} becomes amd64 or
## arm64. The default is the UI, whose image carries the client and serves it
## under /downloads/ (so a private repository's release needs no GitHub login,
## #1151): http://localhost:<ui.service.port>/... for the port-forward, or
## <ui.sessionBinaryScheme>://<ui.allowedHosts[0]>/... behind an Ingress
## (https unless set). The devcontainer's build must reach that address; a
## port-forward's localhost is the laptop's, not a container's, so set an
## address it reaches when it isn't. With ui.enabled
## false the default is the binaries attached to this chart's GitHub release.
## Either way a SHA256SUMS sits next to the binaries and the feature refuses a
## download that doesn't match it (#1175); a URL of your own needs one too.
## Empty sets none: a devcontainer then registers a Session only if it has Go
## and can go install the client.
##
sessionBinaryURL: '{{ include "theos.sessionBinaryURL" . }}'

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false


## The read-only UI (ui/): it reads theos.factory.io resources in every
## namespace and changes none of them. Open it with
##   kubectl -n <namespace> port-forward svc/<release>-ui 8080
##
ui:
  enabled: true

  image:
    repository: ghcr.io/jairjosafath/theos/ui
    ## Image tag (defaults to Chart.appVersion if not set): a released chart
    ## runs its own version's images
    ##
    tag: ""
    pullPolicy: IfNotPresent

  # imagePullSecrets:
  #   - name: myregistrykey

  service:
    type: ClusterIP
    port: 8080

  ## Host names the UI answers besides localhost, 127.0.0.1 and [::1] (the
  ## port-forward above): add the host of an Ingress or Route you put in front
  ## of it. Any other Host is refused, so a page that rebinds its own name to
  ## the UI's address (DNS rebinding) can't read or write through it.
  ##
  allowedHosts: []

  ## The scheme of the default sessionBinaryURL behind an Ingress: the Session
  ## client downloads from <sessionBinaryScheme>://<allowedHosts[0]>/downloads/.
  ## Set http when the Ingress serves no TLS (#1704).
  ##
  sessionBinaryScheme: https

  ## The UI's actions (docs/design.md, UI actions): with enabled, the UI also
  ## sets a Brief's and a Crew's settings, re-runs a failed release, retries a
  ## Container's scaffold, makes a Task from a goal and bumps a Standard's ref.
  ## Off, it only makes a Brief, adds a prompt to one and pauses or resumes it.
  ## Over port-forward (allowedHosts empty) the UI's ServiceAccount makes the
  ## writes, through ClusterRole <release>-ui-actions. With allowedHosts the
  ## chart refuses actions unless ui.auth.oidc is set, so that behind an
  ## Ingress only a person signed in acts.
  ##
  actions:
    enabled: false

  ## Sign-in for the actions behind an Ingress (docs/getting-started.md, UI
  ## actions behind an Ingress). With oidc set and actions enabled, a person
  ## signs in at the issuer (authorization code with PKCE) and every write is
  ## made as them: the UI impersonates usernamePrefix + the usernameClaim (an
  ## email only when the issuer verified it) and groupsPrefix + each of the
  ## ID token's groups, so the cluster's RBAC decides. The UI's ServiceAccount
  ## gets impersonate on users and groups, so the UI pod can act as anyone the
  ## prefixes allow. Reads stay the ServiceAccount's. A session ends with the
  ## ID token (no refresh), or when the UI restarts: set the issuer's ID token
  ## lifetime for how long a person stays signed in.
  ##
  ##   issuerURL          the issuer, https, exactly as its ID tokens name it (required)
  ##   clientID           the UI's client at the issuer (required)
  ##   existingSecret     a Secret you make, holding the client secret (required)
  ##   existingSecretKey  its key, client-secret by default
  ##   redirectURL        the callback the issuer knows; https://<Host>/ui/callback by default
  ##   scopes             openid, email and profile by default; add groups for Dex
  ##   usernameClaim      email by default
  ##   usernamePrefix     oidc: by default
  ##   groupsClaim        groups by default
  ##   groupsPrefix       oidc: by default
  ##   actionGroups       groups, unprefixed, bound to ClusterRole <release>-ui-actions
  ##
  auth: {}
  #   oidc:
  #     issuerURL: https://dex.example.com
  #     clientID: theos-ui
  #     existingSecret: theos-ui-oidc
  #     scopes: [openid, email, profile, groups]
  #     actionGroups: [factory-actors]

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 48Mi

  ## The factory's components on the UI's health view (ui/health.mjs): where
  ## their pods run and a label selector for them. An empty namespace is the
  ## release's; the ui entry's empty selector is the UI's own pod labels. Add your Git host and CI runner here when they run in the cluster.
  ## The UI may read pods only in these namespaces (and the projects'): the
  ## chart binds a Role in each, so each must exist at install.
  ##
  components:
    - key: operator
      name: Operator
      role: Scaffolds Containers and runs Tasks
      namespace: ""
      selector: control-plane=controller-manager
    - key: agent-sandbox
      name: Agent Sandbox
      role: Runs the agents' sandboxes
      namespace: agent-sandbox-system
      selector: app=agent-sandbox-controller
    - key: ui
      name: UI
      role: This page
      namespace: ""
      selector: ""
      optional: true
    - key: dns
      name: Cluster DNS
      role: Name lookups inside the cluster
      namespace: kube-system
      selector: k8s-app=kube-dns
    - key: metrics-server
      name: metrics-server
      role: CPU and memory figures
      namespace: kube-system
      selector: k8s-app=metrics-server
      optional: true

## Git providers: where Container repositories are created. Each entry becomes a
## GitProvider in its namespace (a Project's, which must exist), reading the
## Secret existingSecret names, with the keys "username" and "token". You make
## that Secret before the install; the chart renders none:
##
##   kubectl -n webshop create secret generic git-credentials \
##     --from-literal=username=theos --from-literal=token="$GIT_TOKEN"
##
## Job theos-gitproviders (on the seed image, gitea.seed.image) applies
## them in place after every install and upgrade, so an upgrade keeps them, and
## `helm uninstall` leaves them in place. With gitea.enabled, gitea.projects
## makes these instead.
##
## packages, optional, is the GitProvider's spec.packages: the owner's npm and
## PyPI registries the agents install from and the published Containers
## publish to. Unset, they are the host's own (scope @theos, and
## <url>/api/packages/<owner>/npm/ and .../pypi) and the GitProvider's token
## reads them. A registry of your own names a Secret you make, with key
## "token" (publishes; only the operator reads it) and, optionally,
## "readToken" (installs: the agents' pods and the owner's Actions secret
## THEOS_NPM_TOKEN or THEOS_PYPI_TOKEN); the chart renders none.
##
gitProviders: []
#  - namespace: webshop
#    name: git
#    provider: gitea
#    url: http://git.example.com:3000
#    owner: webshop
#    existingSecret: git-credentials
#    packages:
#      npm:
#        scope: "@acme"
#        registry: https://npm.example.com/
#        credentialsSecretRef:
#          name: acme-npm
#      pypi:
#        index: https://pypi.example.com/simple
#        upload: https://pypi.example.com/
#        credentialsSecretRef:
#          name: acme-pypi

## Pull secrets for the pods of the UI (unless ui.imagePullSecrets is set),
## Gitea, the seed and the runners; the operator's are manager.imagePullSecrets.
## Each must exist in the namespace the pod runs in. The operator copies each
## from the release namespace into every project namespace and names it in the
## agents' sandbox pods, so you make it once, in the release namespace (and in
## Gitea's for its pods). Private GHCR packages: dist/chart/README.md,
## "Private images".
##
global:
  imagePullSecrets: []
  #  - name: ghcr

## The namespace of each of gitea.projects, labeled to receive the Secrets the
## operator shares (agents.credentialsSecret and global.imagePullSecrets) and
## kept on uninstall. One that exists and the release didn't make (by hand, as
## on v0.5.0) is left as it is, and the seed only labels it. Off: you make
## each namespace before the install; the seed still labels it.
##
projectNamespaces:
  create: true

## Gitea, the Git host the factory scaffolds into, with the seed Job and the CI
## runners. Off: gitProviders point at a Gitea the release does not run.
##
gitea:
  enabled: true
  ## Its own namespace, so its URL is http://gitea.<namespace>.svc.cluster.local:3000
  ## (an empty one is the release's). The chart creates it unless createNamespace
  ## is false, and keeps it on uninstall, with the volume.
  ##
  namespace: gitea
  createNamespace: true
  image:
    repository: gitea/gitea
    tag: 1.27.3-rootless
    pullPolicy: IfNotPresent
  ## The admin: Secret gitea-admin, which Gitea's pod makes in the cluster with
  ## a random password when it is missing, from the username and email below
  ## (a later change of them takes a new Secret); or existingSecret, your own
  ## Secret with username, password and email, which the pod never changes.
  ## The shared runners' registration token, Secret gitea-runner, is the
  ## templates organization's: the seed fetches it from Gitea after every
  ## install and upgrade and keeps a Secret that already holds it. Neither is
  ## rendered, so helm template, Argo CD and Flux never see a value. To rotate
  ## the password: kubectl -n gitea delete secret gitea-admin, then kubectl -n
  ## gitea rollout restart deployment/gitea. To rotate the token: reset it in
  ## Gitea, delete the Secret, helm upgrade, then restart the runner
  ## Deployments (README.md).
  ##
  admin:
    username: c4admin
    email: c4admin@theos.factory.io
    # existingSecret: ""
  persistence:
    ## Empty: the cluster's default StorageClass.
    storageClassName: ""
    size: 1Gi
  ## Its share of a busy node: at less CPU a CI build left it too little to
  ## answer its probes (docs/dev/devices.md, "CPU on the cluster device").
  ##
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      memory: 512Mi
  ## More settings as GITEA__<section>__<KEY>: value, over the chart's.
  ##
  config: {}
  ## Project names: for each, the chart makes the namespace of that name (see
  ## projectNamespaces), the seed creates its organization and stores Secret
  ## gitea-credentials there, and the chart creates GitProvider gitea there.
  ## helm upgrade to add one. An entry is a name, or an object with the name
  ## and the GitProvider's packages (as gitProviders[].packages): unset, the
  ## agents install from and the Containers publish to the release's Gitea.
  ##
  projects: []
  #  - webshop
  #  - name: shop
  #    packages:
  #      npm:
  #        scope: "@acme"
  seed:
    image:
      repository: ghcr.io/jairjosafath/theos/seed
      ## Defaults to Chart.appVersion
      tag: ""
      pullPolicy: IfNotPresent
    ## How long the seed waits for Gitea to answer; on a fresh install its
    ## image may still be pulling. Give helm install a --timeout above it.
    ##
    waitSeconds: 300

## The CI runners in Gitea's namespace, one per label, installed with Gitea.
## A Container's workflow picks one with runs-on: <label>. NetworkPolicy
## ci-runner fences them: no traffic in, out only DNS, Gitea and public HTTPS.
##
## Each label's shared runner, in Gitea's namespace, serves the templates'
## checks only. A project's checks run on its own pool of single-job runner
## pods, which the operator keeps from the ci block of the project's
## GitProvider: the chart gives every GitProvider it renders (gitea.projects'
## and gitProviders') a pool per label whose pool.size is above 0, on that
## label's image and resources, so a project's checks have a runner on a
## fresh install (#1698). The `check` workflows of the Standards run on `go`
## and `base`, gitea-release's release job on `go-release`, a pool label
## only (enabled: false: no shared runner); `image` builds release images,
## which have no pool yet.
runners:
  ## The minimal toolchain (Node, bash, git, make).
  base:
    enabled: true
    image:
      repository: ghcr.io/jairjosafath/theos/gitea-runner-base
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}
    workSize: 512Mi
    tmpSize: 256Mi
    pool:
      size: 1
  ## The Go and Node toolchain. A job takes at most 4 cores, so a build can't
  ## starve the API server and Gitea. goCache: the node directory holding its
  ## Go build cache (empty: none).
  go:
    enabled: true
    image:
      repository: ghcr.io/jairjosafath/theos/gitea-runner-go
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "4", memory: 6Gi}
    workSize: 2Gi
    tmpSize: 1Gi
    goCache: /var/cache/theos/go/ci
    pool:
      size: 1
  ## The gitea-release Deployment's release job (runs-on: go-release), on the
  ## go image, in the projects' pools only: no shared runner. A release
  ## builds signed artifacts, so it must not link a build result a pull
  ## request's job left in the project's Go cache: freshGoCache gives each
  ## pod a cache of its own, an emptyDir seeded from the image's warm cache,
  ## shared with nothing (#1141).
  go-release:
    enabled: false
    image:
      repository: ghcr.io/jairjosafath/theos/gitea-runner-go
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "4", memory: 6Gi}
    freshGoCache: true
    pool:
      size: 1
  ## Rootless BuildKit, for release runs that build a Container's image:
  ## buildctl-daemonless.sh starts BuildKit for one job, its state in the job's
  ## work directory. One build at a time per replica; more queue in Gitea.
  ## buildkit: its job container runs with seccomp and AppArmor Unconfined, as
  ## uid 1000, which rootless BuildKit's user namespaces need; never privileged,
  ## no capability. Its work and tmp directories are on the node's disk, not
  ## in memory: layers are large.
  image:
    enabled: true
    image:
      repository: ghcr.io/jairjosafath/theos/gitea-runner-image
      tag: ""
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "4", memory: 8Gi}
    workSize: 20Gi
    tmpSize: 1Gi
    buildkit: true

## For each of gitea.projects, the catalog its Containers pick from: the
## templates the seed pushes to the templates organization, each pinned to its
## tag in templates/versions.txt (make validate-yaml checks they match), the
## Domains a SoftwareSystem may name, and the bundles of them a Container may
## name instead. The seed's hello,
## hello-standard, hello-html and hello-html-standard are for the end-to-end
## tests and left out.
## Off: make your own catalog entries and bundles in the project's namespace.
##
catalog:
  enabled: true
  ## kind, name (also the template's, unless template names it), ref (the tag)
  ## and spec, without template.
  entries:
    - kind: Framework
      name: go-cli
      ref: v1.0.0
      spec:
        displayName: Go command-line program
        description: A Go program with a testable entry point, internal packages and a version flag.
        supportedTypes: [cli]
    - kind: Framework
      name: python-fastapi
      ref: v1.6.0
      spec:
        displayName: Python, FastAPI (uv)
        description: A uv project with FastAPI, ruff, mypy and pytest, and its lock file.
        supportedTypes: [service]
    - kind: Framework
      name: vscode-extension
      ref: v1.1.0
      spec:
        displayName: VS Code extension (TypeScript)
        description: A VS Code extension in TypeScript, bundled with esbuild, with a pure module and its unit tests.
        supportedTypes: [extension]
    - kind: Framework
      name: react-vite
      ref: v1.0.0
      spec:
        displayName: Web app with pages (React, Vite)
        description: A page in the browser in React and TypeScript, built with Vite into a static site, with a pure module and its unit tests.
        supportedTypes: [static-site]
    - kind: Framework
      name: node-cli
      ref: v1.1.1
      spec:
        displayName: Command-line program (TypeScript, Node)
        description: A command-line program in TypeScript for Node, bundled with esbuild into one file and packed with npm pack, with flags parsed by util.parseArgs and unit tests.
        supportedTypes: [cli]
    - kind: Framework
      name: aws-lambda-ts
      ref: v1.5.0
      spec:
        displayName: Serverless API on AWS (Lambda, TypeScript)
        description: "A serverless HTTP API on AWS: a TypeScript Lambda behind an API Gateway HTTP API with IAM auth, items in DynamoDB through the AWS SDK v3, Powertools' logs, metrics and idempotency, alarms and a dashboard, and its CDK stack in infra/, which is its deployment, built for production (backups, tracing, data kept) or development. Connects the function to the table of a DataStore on the dynamodb Connector, or the Aurora PostgreSQL cluster of one on the rds Connector."
        supportedTypes: [function]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
        # Renders a Container's operations block into infra/operations.ts (#1703).
        readsOperations: true
    - kind: Framework
      name: aws-ec2-ts
      ref: v1.4.0
      spec:
        displayName: Service on AWS EC2 (TypeScript)
        description: "An HTTP service on AWS infrastructure: a TypeScript Node server on EC2 instances in an Auto Scaling group behind an internal Application Load Balancer serving HTTPS, items in DynamoDB through the AWS SDK v3, alarms and a dashboard, rolling updates that stop on an unhealthy instance, and its CDK stack in infra/, which is its deployment, built for production (backups, data kept) or development. Connects the service to the table of a DataStore on the dynamodb Connector, or the Aurora PostgreSQL cluster of one on the rds Connector in its own VPC."
        supportedTypes: [service]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
        # Renders a Container's operations block into infra/operations.ts (#1703).
        readsOperations: true
    - kind: Framework
      name: aws-fargate-ts
      ref: v2.2.0
      spec:
        displayName: Container service on AWS (ECS on Fargate, TypeScript)
