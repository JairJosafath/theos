## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: ghcr.io/jairjosafath/c4factory/operator
    ## Image tag (defaults to Chart.appVersion if not set): a released chart
    ## runs its own version's images
    ##
    tag: ""
    pullPolicy: IfNotPresent

  ## Arguments (go run ./cmd --help lists them). These are the Kind test
  ## environment's: four agent sandboxes at once, each workspace in memory up to
  ## 3Gi, and a Go build cache the sandboxes share on the node.
  ##
  args:
    - --leader-elect
    - --sandbox-workspace-memory=3Gi
    - --max-agent-sandboxes=4
    - --sandbox-go-cache=/var/cache/c4factory/go/sandbox

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## The Go proxy the operator asks whether go get finds a released Go module
## whose path is outside c4factory.local/ (the operator's --go-proxy). off asks
## none, for an install without that egress: the Crew's own GitHub source tag
## is then the answer.
##
goProxy: https://proxy.golang.org

## Where a scaffolded devcontainer's c4session feature downloads the Session
## client (the operator's --session-binary-url); ${arch} becomes amd64 or
## arm64. The default is the binaries attached to this chart's GitHub release.
## Empty sets none: a devcontainer then registers a Session only if it has Go
## and can go install the client.
##
sessionBinaryURL: https://github.com/JairJosafath/c4factory/releases/download/v{{ .Chart.AppVersion }}/c4session-linux-${arch}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false


## The read-only UI (ui/): it reads the c4.factory.io resources in every
## namespace and changes none of them. Open it with
##   kubectl -n <namespace> port-forward svc/<release>-ui 8080
##
ui:
  enabled: true

  image:
    repository: ghcr.io/jairjosafath/c4factory/ui
    ## Image tag (defaults to Chart.appVersion if not set): a released chart
    ## runs its own version's images
    ##
    tag: ""
    pullPolicy: IfNotPresent

  # imagePullSecrets:
  #   - name: myregistrykey

  service:
    type: ClusterIP
    port: 8080

  ## Host names the UI answers besides localhost, 127.0.0.1 and [::1] (the
  ## port-forward above): add the host of an Ingress or Route you put in front
  ## of it. Any other Host is refused, so a page that rebinds its own name to
  ## the UI's address (DNS rebinding) can't read or write through it.
  ##
  allowedHosts: []

  ## The UI's actions (docs/design.md, UI actions): with enabled, the UI also
  ## sets a Brief's and a Crew's settings, re-runs a failed release, retries a
  ## Container's scaffold, makes a Task from a goal and bumps a Standard's ref.
  ## Off, it only makes a Brief, adds a prompt to one and pauses or resumes it.
  ## Over port-forward (allowedHosts empty) the UI's ServiceAccount makes the
  ## writes, through ClusterRole <release>-ui-actions. With allowedHosts the
  ## chart refuses actions unless ui.auth.oidc is set, so that behind an
  ## Ingress only a person signed in acts.
  ##
  actions:
    enabled: false

  ## Sign-in for the actions behind an Ingress (docs/getting-started.md, UI
  ## actions behind an Ingress). With oidc set and actions enabled, a person
  ## signs in at the issuer (authorization code with PKCE) and every write is
  ## made as them: the UI impersonates usernamePrefix + the usernameClaim (an
  ## email only when the issuer verified it) and groupsPrefix + each of the
  ## ID token's groups, so the cluster's RBAC decides. The UI's ServiceAccount
  ## gets impersonate on users and groups, so the UI pod can act as anyone the
  ## prefixes allow. Reads stay the ServiceAccount's. A session ends with the
  ## ID token (no refresh), or when the UI restarts: set the issuer's ID token
  ## lifetime for how long a person stays signed in.
  ##
  ##   issuerURL          the issuer, https, exactly as its ID tokens name it (required)
  ##   clientID           the UI's client at the issuer (required)
  ##   existingSecret     a Secret you make, holding the client secret (required)
  ##   existingSecretKey  its key, client-secret by default
  ##   redirectURL        the callback the issuer knows; https://<Host>/ui/callback by default
  ##   scopes             openid, email and profile by default; add groups for Dex
  ##   usernameClaim      email by default
  ##   usernamePrefix     oidc: by default
  ##   groupsClaim        groups by default
  ##   groupsPrefix       oidc: by default
  ##   actionGroups       groups, unprefixed, bound to ClusterRole <release>-ui-actions
  ##
  auth: {}
  #   oidc:
  #     issuerURL: https://dex.example.com
  #     clientID: c4-factory-ui
  #     existingSecret: c4-factory-ui-oidc
  #     scopes: [openid, email, profile, groups]
  #     actionGroups: [factory-actors]

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 48Mi

  ## The factory's components on the UI's health view (ui/health.mjs): where
  ## their pods run and a label selector for them. An empty namespace is the
  ## release's; the ui entry's empty selector is the UI's own pod labels. Add your Git host and CI runner here when they run in the cluster.
  ## The UI may read pods only in these namespaces (and the projects'): the
  ## chart binds a Role in each, so each must exist at install.
  ##
  components:
    - key: operator
      name: Operator
      role: Scaffolds Containers and runs Tasks
      namespace: ""
      selector: control-plane=controller-manager
    - key: agent-sandbox
      name: Agent Sandbox
      role: Runs the agents' sandboxes
      namespace: agent-sandbox-system
      selector: app=agent-sandbox-controller
    - key: ui
      name: UI
      role: This page
      namespace: ""
      selector: ""
      optional: true
    - key: dns
      name: Cluster DNS
      role: Name lookups inside the cluster
      namespace: kube-system
      selector: k8s-app=kube-dns
    - key: metrics-server
      name: metrics-server
      role: CPU and memory figures
      namespace: kube-system
      selector: k8s-app=metrics-server
      optional: true

## Git providers: where Container repositories are created. Each entry becomes a
## GitProvider in its namespace (a Project's, which must exist), reading the
## Secret existingSecret names, with the keys "username" and "token". You make
## that Secret before the install; the chart renders none:
##
##   kubectl -n webshop create secret generic git-credentials \
##     --from-literal=username=c4factory --from-literal=token="$GIT_TOKEN"
##
## Job c4-factory-gitproviders (on the seed image, gitea.seed.image) applies
## them in place after every install and upgrade, so an upgrade keeps them, and
## `helm uninstall` leaves them in place. With gitea.enabled, gitea.projects
## makes these instead.
##
gitProviders: []
#  - namespace: webshop
#    name: git
#    provider: gitea
#    url: http://git.example.com:3000
#    owner: webshop
#    existingSecret: git-credentials

## Pull secrets for the pods of the UI (unless ui.imagePullSecrets is set),
## Gitea, the seed and the runners; the operator's are manager.imagePullSecrets.
## Each must exist in the namespace the pod runs in. The operator copies each
## from the release namespace into every project namespace and names it in the
## agents' sandbox pods, so you make it once, in the release namespace (and in
## Gitea's for its pods). Private GHCR packages: dist/chart/README.md,
## "Private images".
##
global:
  imagePullSecrets: []
  #  - name: ghcr

## The namespace of each of gitea.projects, labeled to receive the Secrets the
## operator shares (agents.credentialsSecret and global.imagePullSecrets) and
## kept on uninstall. One that exists and the release didn't make (by hand, as
## on v0.5.0) is left as it is, and the seed only labels it. Off: you make
## each namespace before the install; the seed still labels it.
##
projectNamespaces:
  create: true

## Gitea, the Git host the factory scaffolds into, with the seed Job and the CI
## runners. Off: gitProviders point at a Gitea the release does not run.
##
gitea:
  enabled: true
  ## Its own namespace, so its URL is http://gitea.<namespace>.svc.cluster.local:3000
  ## (an empty one is the release's). The chart creates it unless createNamespace
  ## is false, and keeps it on uninstall, with the volume.
  ##
  namespace: gitea
  createNamespace: true
  image:
    repository: gitea/gitea
    tag: 1.27.3-rootless
    pullPolicy: IfNotPresent
  ## The admin: Secret gitea-admin, which Gitea's pod makes in the cluster with
  ## a random password when it is missing, from the username and email below
  ## (a later change of them takes a new Secret); or existingSecret, your own
  ## Secret with username, password and email, which the pod never changes.
  ## The runners' registration token, Secret gitea-runner, is made the same way.
  ## Neither is rendered, so helm template, Argo CD and Flux never see a value.
  ## To rotate one: kubectl -n gitea delete secret gitea-admin (or gitea-runner),
  ## then kubectl -n gitea rollout restart deployment/gitea; after gitea-runner,
  ## restart the runner Deployments too.
  ##
  admin:
    username: c4admin
    email: c4admin@c4.factory.io
    # existingSecret: ""
  persistence:
    ## Empty: the cluster's default StorageClass.
    storageClassName: ""
    size: 1Gi
  ## Its share of a busy node: at less CPU a CI build left it too little to
  ## answer its probes (docs/dev/testenv.md, "CPU on the cluster device").
  ##
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      memory: 512Mi
  ## More settings as GITEA__<section>__<KEY>: value, over the chart's.
  ##
  config: {}
  ## Project names: for each, the chart makes the namespace of that name (see
  ## projectNamespaces), the seed creates its organization and stores Secret
  ## gitea-credentials there, and the chart creates GitProvider gitea there.
  ## helm upgrade to add one.
  ##
  projects: []
  #  - webshop
  seed:
    image:
      repository: ghcr.io/jairjosafath/c4factory/seed
      ## Defaults to Chart.appVersion
      tag: ""
      pullPolicy: IfNotPresent
    ## How long the seed waits for Gitea to answer; on a fresh install its
    ## image may still be pulling. Give helm install a --timeout above it.
    ##
    waitSeconds: 300

## The CI runners in Gitea's namespace, one per label, installed with Gitea.
## A Container's workflow picks one with runs-on: <label>. NetworkPolicy
## ci-runner fences them: no traffic in, out only DNS, Gitea and public HTTPS.
##
runners:
  ## The minimal toolchain (Node, bash, git, make).
  base:
    enabled: true
    image:
      repository: ghcr.io/jairjosafath/c4factory/gitea-runner-base
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}
    workSize: 512Mi
    tmpSize: 256Mi
  ## The Go and Node toolchain. A job takes at most 4 cores, so a build can't
  ## starve the API server and Gitea. goCache: the node directory holding its
  ## Go build cache (empty: none).
  go:
    enabled: true
    image:
      repository: ghcr.io/jairjosafath/c4factory/gitea-runner-go
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "4", memory: 6Gi}
    workSize: 2Gi
    tmpSize: 1Gi
    goCache: /var/cache/c4factory/go/ci
  ## Rootless BuildKit, for release runs that build a Container's image:
  ## buildctl-daemonless.sh starts BuildKit for one job, its state in the job's
  ## work directory. One build at a time per replica; more queue in Gitea.
  ## buildkit: its job container runs with seccomp and AppArmor Unconfined, as
  ## uid 1000, which rootless BuildKit's user namespaces need; never privileged,
  ## no capability. Its work and tmp directories are on the node's disk, not
  ## in memory: layers are large.
  image:
    enabled: true
    image:
      repository: ghcr.io/jairjosafath/c4factory/gitea-runner-image
      tag: ""
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "4", memory: 8Gi}
    workSize: 20Gi
    tmpSize: 1Gi
    buildkit: true

## For each of gitea.projects, the catalog its Containers pick from: the
## templates the seed pushes to the templates organization, each pinned to its
## tag in templates/versions.txt (make validate-yaml checks they match). The
## seed's hello, hello-standard, hello-html and hello-html-standard are for the
## end-to-end tests and left out.
## Off: make your own catalog entries in the project's namespace.
##
catalog:
  enabled: true
  ## kind, name (also the template's), ref (the tag) and spec, without template.
  entries:
    - kind: Framework
      name: go-cli
      ref: v1.0.0
      spec:
        displayName: Go command-line program
        description: A Go program with a testable entry point, internal packages and a version flag.
        supportedTypes: [cli]
    - kind: Framework
      name: python-fastapi
      ref: v1.6.0
      spec:
        displayName: Python, FastAPI (uv)
        description: A uv project with FastAPI, ruff, mypy and pytest, and its lock file.
        supportedTypes: [service]
    - kind: Framework
      name: vscode-extension
      ref: v1.0.0
      spec:
        displayName: VS Code extension (TypeScript)
        description: A VS Code extension in TypeScript, bundled with esbuild, with a pure module and its unit tests.
        supportedTypes: [extension]
    - kind: Framework
      name: react-vite
      ref: v1.0.0
      spec:
        displayName: Web app with pages (React, Vite)
        description: A page in the browser in React and TypeScript, built with Vite into a static site, with a pure module and its unit tests.
        supportedTypes: [static-site]
    - kind: Framework
      name: node-cli
      ref: v1.0.0
      spec:
        displayName: Command-line program (TypeScript, Node)
        description: A command-line program in TypeScript for Node, bundled with esbuild into one file and packed with npm pack, with flags parsed by util.parseArgs and unit tests.
        supportedTypes: [cli]
    - kind: Framework
      name: aws-lambda-ts
      ref: v1.3.1
      spec:
        displayName: Serverless API on AWS (Lambda, TypeScript)
        description: "A serverless HTTP API on AWS: a TypeScript Lambda behind an API Gateway HTTP API with IAM auth, items in DynamoDB through the AWS SDK v3, Powertools' logs, metrics and idempotency, alarms and a dashboard, and its CDK stack in infra/, which is its deployment, built for production (backups, tracing, data kept) or development. Connects the function to the table of a DataStore on the dynamodb Connector."
        supportedTypes: [function]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-ec2-ts
      ref: v1.1.1
      spec:
        displayName: Service on AWS EC2 (TypeScript)
        description: "An HTTP service on AWS infrastructure: a TypeScript Node server on EC2 instances in an Auto Scaling group behind an internal Application Load Balancer serving HTTPS, items in DynamoDB through the AWS SDK v3, alarms and a dashboard, rolling updates that stop on an unhealthy instance, and its CDK stack in infra/, which is its deployment, built for production (backups, data kept) or development."
        supportedTypes: [service]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-fargate-ts
      ref: v1.2.1
      spec:
        displayName: Container service on AWS (ECS on Fargate, TypeScript)
        description: "An HTTP service on AWS: a TypeScript Node server in a container on ECS on Fargate behind an Application Load Balancer serving HTTPS, items in DynamoDB through the AWS SDK v3, alarms and a dashboard, deployments that roll back on them, and its CDK stack in infra/, which is its deployment, built for production (backups, OpenTelemetry tracing, a NAT gateway per zone, data kept) or development."
        supportedTypes: [service]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-lambda-go
      ref: v1.2.1
      spec:
        displayName: Serverless API on AWS (Lambda, Go)
        description: "A serverless HTTP API on AWS: a Go Lambda on provided.al2023, built with go build, behind an API Gateway HTTP API with IAM auth, items in DynamoDB through the AWS SDK for Go v2, slog's JSON logs, alarms and a dashboard, and its CDK stack in TypeScript in infra/, which is its deployment, built for production (backups, tracing, data kept) or development."
        supportedTypes: [function]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-lambda-py
      ref: v1.2.1
      spec:
        displayName: Serverless API on AWS (Lambda, Python)
        description: "A serverless HTTP API on AWS: a Python Lambda using boto3 behind an API Gateway HTTP API with IAM auth, items in DynamoDB, managed with uv, Powertools' logs, metrics and idempotency, alarms and a dashboard, and its TypeScript CDK stack in infra/, which is its deployment, built for production (backups, tracing, data kept) or development."
        supportedTypes: [function]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-static-site-ts
      ref: v1.0.0
      spec:
        displayName: Static site on AWS (S3 and CloudFront, TypeScript)
        description: "A static site on AWS: a TypeScript page built with Vite into a private S3 bucket behind a CloudFront distribution with origin access control, access logs, TLS 1.2 on its own domain, a web application firewall and the files versioned in production, alarms and a dashboard, and its CDK stack in infra/, which is its deployment."
        supportedTypes: [static-site]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-queue-ts
      ref: v1.1.1
      spec:
        displayName: Queue consumer on AWS (SQS and Lambda, TypeScript)
        description: "A queue consumer on AWS: an SQS queue with a dead-letter queue, consumed in batches by a TypeScript Lambda that reports only the messages that failed, with Powertools' batch processing, logs, metrics and idempotency, items in DynamoDB, alarms and a dashboard, and its CDK stack in infra/, which is its deployment, built for production (backups, tracing, data kept) or development."
        supportedTypes: [worker]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-schedule-ts
      ref: v1.1.1
      spec:
        displayName: Scheduled job on AWS (EventBridge Scheduler and Lambda, TypeScript)
        description: "A scheduled job on AWS: an EventBridge Scheduler schedule invoking a TypeScript Lambda, with a retry policy and a dead-letter queue and the schedule's role scoped to the one function, with Powertools' logs, metrics and idempotency, a record of each run in DynamoDB, alarms and a dashboard, and its CDK stack in infra/, which is its deployment, built for production (backups, tracing, data kept) or development."
        supportedTypes: [job]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: aws-event-ts
      ref: v1.1.1
      spec:
        displayName: Event consumer on AWS (EventBridge and Lambda, TypeScript)
        description: "An event consumer on AWS: an EventBridge rule on the default event bus invoking a TypeScript Lambda, with a retry policy and a dead-letter queue on the rule's target and on the function, with Powertools' logs, metrics and idempotency keyed by the event's id, items in DynamoDB, alarms and a dashboard, and its CDK stack in infra/, which is its deployment, built for production (backups, tracing, data kept) or development."
        supportedTypes: [worker]
        # Its CDK app in infra/ is its deployment: no Compute, no Deployment.
        deploysItself: true
    - kind: Framework
      name: python-cli
      ref: v1.1.0
      spec:
        displayName: Command-line program (Python, uv)
        description: A command-line program in Python managed with uv, with flags parsed by argparse, a version flag, unit tests and a wheel and sdist for releases; or, as a worker, a long-running process that stops cleanly on SIGTERM.
        supportedTypes: [cli, worker]
    - kind: Framework
      name: go-kubebuilder
      ref: v1.1.0
      spec:
        displayName: Kubernetes operator (Go, kubebuilder)
        description: "An operator that extends Kubernetes: watches and reconciles cluster objects. What kubebuilder init writes, in Go, ready for kubebuilder create api."
        supportedTypes: [operator]
    - kind: Standard
      name: go-standard
      ref: v1.3.0
      spec:
        displayName: Go quality standard
        description: Strict golangci-lint, gofumpt, race-checked tests, role guides for agents and the make check CI.
        supportedTypes: [cli]
        supportedFrameworks: [go-cli]
        # The quality contract: agents fix the code, not the rules it is checked by.
        protectedPaths: [AGENTS.md, Makefile, .golangci.yml, .editorconfig, docs/style/, docs/agents/]
        # Renders a light check per change and the full one on release-check/** (the Container's checks).
        checksBeforeRelease: true
    - kind: Standard
      name: go-operator-standard
      ref: v1.3.0
      spec:
        displayName: Go operator quality standard
        description: kubebuilder's golangci-lint, gofmt and goimports, envtest tests, generated files kept up to date, role guides for agents and the make check CI.
        supportedTypes: [operator]
        supportedFrameworks: [go-kubebuilder]
        protectedPaths: [AGENTS.md, Makefile, .golangci.yml, .editorconfig, docs/style/, docs/agents/]
        checksBeforeRelease: true
    - kind: Standard
      name: ts-standard
      ref: v1.5.0
      spec:
        displayName: TypeScript quality standard
        description: Strictest typescript-eslint, Prettier, role guides for agents and the make check CI.
        supportedTypes: [extension, static-site, cli]
        supportedFrameworks: [vscode-extension, react-vite, node-cli]
        protectedPaths: [AGENTS.md, Makefile, eslint.config.mjs, .prettierrc.json, .prettierignore, .editorconfig, docs/style/, docs/agents/]
        checksBeforeRelease: true
    - kind: Standard
      name: aws-standard
      ref: v1.17.4
      spec:
        displayName: AWS quality standard
        description: "ts-standard's lint and Prettier, go-standard's golangci-lint, go vet and go test for a Go function, and python-standard's ruff, mypy and pytest for a Python function, plus cdk synth under CDK Nag's AwsSolutions and Serverless packs, cfn-lint, the Standard's stack assertions, Well-Architected and AWS digests per Framework, role guides for agents and the make check CI. Nothing deploys."
        supportedTypes: [function, service, static-site, worker, job]
        supportedFrameworks: [aws-lambda-ts, aws-lambda-go, aws-ec2-ts, aws-fargate-ts, aws-lambda-py, aws-static-site-ts, aws-queue-ts, aws-schedule-ts, aws-event-ts]
        # The CDK app's entry point and the Standard's stack rules are the contract too.
        protectedPaths: [AGENTS.md, Makefile, eslint.config.mjs, .golangci.yml, ruff.toml, mypy.ini, .prettierrc.json, .prettierignore, .editorconfig, docs/style/, docs/agents/, docs/well-architected.md, docs/runbook.md, infra/main.ts, infra/standard.ts, infra/standard.test.ts, tsconfig.json, vitest.config.mts, cdk.json]
        checksBeforeRelease: true
    - kind: Standard
      name: python-standard
      ref: v1.4.0
      spec:
        displayName: Python quality standard
        description: Every ruff rule, ruff format, mypy --strict, pytest, role guides for agents and the make check CI.
        supportedTypes: [service, cli, worker]
        supportedFrameworks: [python-fastapi, python-cli]
        protectedPaths: [AGENTS.md, Makefile, ruff.toml, mypy.ini, .editorconfig, docs/style/, docs/agents/]
        checksBeforeRelease: true
    - kind: Compute
      name: small
