        ## Container on any other is refused at ChoicesValid (NotWired)
        ## (docs/plans/aws-rds.md, decisions 6 and 7).
        wiredBy: [aws-lambda-ts, aws-lambda-py, aws-lambda-go, aws-queue-ts, aws-event-ts, aws-schedule-ts, aws-fargate-ts, aws-ec2-ts]
    ## A Domain is what a SoftwareSystem is about (spec.domainRefs); every
    ## Container of that system gets it under docs/agents/domain/<name>/,
    ## whatever its type, so it has no supportedTypes (docs/plans/domains.md).
    - kind: Domain
      name: webshop
      template: webshop-domain
      ref: v1.0.0
      spec:
        displayName: Webshop
        description: "What a webshop is about, for the agents that build and review one: catalog and search, cart, checkout and orders, stock, payments, pricing and money, accounts and personal data, each with its practices, common mistakes, the controversies and the choice made in each, and sources."
  ## Bundles: a Framework, Standard, Compute and Deployment picked together, which
  ## a Container names with bundleRef instead of its four sides
  ## (docs/plans/done/catalog-bundles.md). No template and no ref: each names entries
  ## above, and make validate-yaml checks it names ones the chart installs that
  ## share a Container type. name and spec, as a Bundle's.
  bundles:
    - name: python-service
      spec:
        displayName: Python service
        description: A FastAPI service with the Python standard, small sizing and plain Kubernetes manifests.
        frameworkRef: {name: python-fastapi}
        standardRef: {name: python-standard}
        computeRef: {name: small}
        deploymentRef: {name: k8s-manifests}
    - name: go-cli
      spec:
        displayName: Go command-line program
        description: A Go command-line program with the Go standard, released through Gitea releases.
        frameworkRef: {name: go-cli}
        standardRef: {name: go-standard}
        deploymentRef: {name: gitea-release}

## For each of gitea.projects, the four Agents a Brief's plan and its Crews use
## by default: Claude Code on the release's Go and Node toolchain image, reading
## Secret claude-credentials (key CLAUDE_CODE_OAUTH_TOKEN, from
## `claude setup-token`), which you create once in the release namespace: the
## operator copies it into every project namespace and keeps the copies in step.
## A project with its own token makes the Secret in its namespace instead.
## Never a Fable model: the chart refuses one. Off: make your own Agents, and
## the operator shares no token.
##
agents:
  enabled: true
  image:
    repository: ghcr.io/jairjosafath/theos/agent-go
    ## Defaults to Chart.appVersion
    tag: ""
  credentialsSecret: claude-credentials
  ## The model proxy (docs/plans/done/model-proxy.md): a Deployment of the operator
  ## image running /model-proxy in the release namespace, Service c4-model-proxy
  ## on 8080, the one place the Secret above is used. It mounts the Secret as a
  ## volume and admits only agent sandboxes. Two replicas and a
  ## PodDisruptionBudget keep one serving through a rollout; a stopping replica
  ## fails its readiness probe for drainSeconds before it closes.
  modelProxy:
    replicas: 2
    ## The one URL every request is forwarded to.
    upstream: https://api.anthropic.com
    drainSeconds: 5
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}
  planner:
    description: "Plans a Brief: the model and the first issues, from its idea and prompts."
    model: claude-opus-5-5
    maxRounds: 3
    timeoutMinutes: 60
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  designer:
    description: Turns a design idea into issues with acceptance criteria.
    model: claude-opus-5-5
    maxRounds: 3
    timeoutMinutes: 60
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  implementer:
    description: Implements one issue at a time, test first, until make check passes.
    model: claude-sonnet-5-5
    maxRounds: 3
    timeoutMinutes: 90
    ## A CPU limit keeps one agent's tests from taking every core of the node.
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "2", memory: 4Gi}
  reviewer:
    description: Reviews each round against the issue's acceptance criteria and the Standard's checklist.
    model: claude-opus-5-5
    maxRounds: 3
    timeoutMinutes: 45
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  ## Agent stand-in: no model and no token. It plans a Brief from the catalog,
  ## makes a scripted change and approves it, so a Brief or a Crew naming it
  ## shows the whole loop for free (config/samples/brief/stand-in.yaml).
  standIn:
    enabled: true
    description: "Plans from the catalog, makes a scripted change and approves it: the loop without a model."
    maxRounds: 2
    timeoutMinutes: 15
    ## Its implement rounds still run the Container's make check.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 2Gi}

## Test environments (docs/plans/test-environments.md): the tools a run leases
## when the agent sandbox lacks them, such as a browser. A local
## TestEnvironment's lease pods copy theos-env in from toolsImage, the
## release's agent image, which holds it (the operator's
## --test-environment-tools-image).
##
testEnvironments:
  toolsImage:
    repository: ghcr.io/jairjosafath/theos/agent-base
    ## Defaults to Chart.appVersion
    tag: ""

## Chat (docs/design.md, Chat): people follow and steer each project from
## Matrix rooms. With enabled, Deployment <release>-chat, the operator image
## running /theos-chat with its own ServiceAccount: it reads theos's objects,
## posts in each Chat's rooms and runs its people's commands as them, by
## impersonation. A project then makes a Chat naming the bot's token Secret
## (config/samples/webshop/chat.yaml), and each person adds themselves to
## its people (README.md, Chat).
##
chat:
  enabled: false
  ## The homeserver of a Chat that names none (the operator's
  ## --chat-homeserver), http(s)://host[:port]: your own, or matrix.org. Empty
  ## with homeserver.enabled: the in-cluster one,
  ## http://<release>-matrix.<release namespace>.svc:8008; empty without it,
  ## each Chat names its homeserver.
  homeserverURL: ""
  ## How often theos-chat reads each Chat's rooms and posts its news, besides
  ## whenever a Task, Container or Brief in its namespace changes.
  interval: 5s
  ## The UI's address theos-chat's posts link each Task's and Container's
  ## page under (--ui-url), http(s)://host[:port][/path]. Empty: the UI's own,
  ## <ui.sessionBinaryScheme>://<ui.allowedHosts[0]> behind an Ingress, else
  ## http://localhost:<ui.service.port>, the port-forward's, which opens only
  ## where that port-forward runs; with ui.enabled false, no links. Set it to
  ## an address people's phones reach.
  uiURL: ""
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  ## An in-cluster Matrix homeserver, Tuwunel, with chat.enabled: StatefulSet
  ## and Service <release>-matrix on 8008, one replica on a volume kept on
  ## uninstall. Federation and registration are off: Job
  ## <release>-matrix-accounts makes the accounts after every install and
  ## upgrade through its shared-secret registration (Secret
  ## <release>-matrix-registration, made in the cluster). People reach it
  ## with a Matrix client through a port-forward
  ##   kubectl -n <namespace> port-forward svc/<release>-matrix 8008
  ## (homeserver http://localhost:8008), or an Ingress of your own.
  ##
  homeserver:
    enabled: false
    image:
      repository: ghcr.io/matrix-construct/tuwunel
      tag: v1.9.4
      ## The tag's multi-arch index (amd64 and arm64), so a moved tag can't
      ## change what runs. Empty pulls by the tag alone.
      digest: sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec
      pullPolicy: IfNotPresent
    ## The server name in every user and room ID (@theos:<serverName>). Set it
    ## before the first install: it can't change without wiping the volume.
    ##
    serverName: theos.internal
    persistence:
      ## Empty: the cluster's default StorageClass.
      storageClassName: ""
      size: 1Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 1Gi}
    ## More settings as TUWUNEL_<KEY>: value, over the chart's (see Tuwunel's
    ## tuwunel-example.toml).
    ##
    config: {}
    ## The bot: account @<localpart>:<serverName>, whose access token the Job
    ## puts under accessToken in Secret <secretName> in each of gitea.projects
    ## and of namespaces (each must exist at install), where it is missing:
    ## what a Chat's credentialsSecretRef names there.
    ##
    bot:
      localpart: theos
      secretName: matrix-bot
      namespaces: []
    ## People's accounts, by localpart: for each, the Job makes
    ## @<name>:<serverName> with a random password, kept in Secret
    ## <release>-matrix-account-<name> in the release namespace for you to
    ## hand over; they change it in their client.
    ##
    accounts: []
    ## How long the Job waits for the homeserver to answer.
    waitSeconds: 300
