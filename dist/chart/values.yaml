        supportedTypes: [function, service, worker, job]
        ## The Frameworks whose infra/connectors.ts calls connectDynamoDB; a
        ## Container on any other is refused at ChoicesValid (NotWired)
        ## instead of getting a file nothing calls (docs/plans/aws-rds.md,
        ## decision 7).
