        supportedTypes: [function]

## For each of gitea.projects, the four Agents a Brief's plan and its Crews use
## by default: Claude Code on the release's Go and Node toolchain image, reading
## Secret claude-credentials (key CLAUDE_CODE_OAUTH_TOKEN, from
## `claude setup-token`), which you create once in the release namespace: the
## operator copies it into every project namespace and keeps the copies in step.
## A project with its own token makes the Secret in its namespace instead.
## Never a Fable model: the chart refuses one. Off: make your own Agents, and
## the operator shares no token.
##
agents:
  enabled: true
  image:
    repository: ghcr.io/jairjosafath/c4factory/agent-go
    ## Defaults to Chart.appVersion
    tag: ""
  credentialsSecret: claude-credentials
  ## The model proxy (docs/plans/done/model-proxy.md): a Deployment of the operator
  ## image running /model-proxy in the release namespace, Service c4-model-proxy
  ## on 8080, the one place the Secret above is used. It mounts the Secret as a
  ## volume and admits only agent sandboxes. Two replicas and a
  ## PodDisruptionBudget keep one serving through a rollout; a stopping replica
  ## fails its readiness probe for drainSeconds before it closes.
  modelProxy:
    replicas: 2
    ## The one URL every request is forwarded to.
    upstream: https://api.anthropic.com
    drainSeconds: 5
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}
  planner:
    description: "Plans a Brief: the model and the first issues, from its idea and prompts."
    model: claude-opus-5-5
    maxRounds: 3
    timeoutMinutes: 60
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  designer:
    description: Turns a design idea into issues with acceptance criteria.
    model: claude-opus-5-5
    maxRounds: 3
    timeoutMinutes: 60
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  implementer:
    description: Implements one issue at a time, test first, until make check passes.
    model: claude-sonnet-5-5
    maxRounds: 3
    timeoutMinutes: 90
    ## A CPU limit keeps one agent's tests from taking every core of the node.
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "2", memory: 4Gi}
  reviewer:
    description: Reviews each round against the issue's acceptance criteria and the Standard's checklist.
    model: claude-opus-5-5
    maxRounds: 3
    timeoutMinutes: 45
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  ## Agent stand-in: no model and no token. It plans a Brief from the catalog,
  ## makes a scripted change and approves it, so a Brief or a Crew naming it
  ## shows the whole loop for free (config/samples/brief/stand-in.yaml).
  standIn:
    enabled: true
    description: "Plans from the catalog, makes a scripted change and approves it: the loop without a model."
    maxRounds: 2
    timeoutMinutes: 15
    ## Its implement rounds still run the Container's make check.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 2Gi}
