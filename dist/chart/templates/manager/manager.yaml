{{- if or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "c4-factory.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "c4-factory.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "c4-factory.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "c4-factory.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:{{ .Values.manager.healthProbe.port }}
        {{- if .Values.webhook.enabled }}
        # The operator issues the webhook certificate into this Secret and
        # patches its CA into the CRDs (docs/plans/done/api-versions.md, decision 3).
        - --webhook-port={{ .Values.webhook.port }}
        - --webhook-service={{ include "c4-factory.resourceName" (dict "suffix" "webhook-service" "context" $) }}
        - --webhook-cert-secret={{ .Release.Name }}-webhook-cert
        {{- end }}
        {{- range .Values.manager.args }}
        - {{ tpl . $ }}
        {{- end }}
        {{- with .Values.goProxy }}
        - --go-proxy={{ . }}
        {{- end }}
        {{- range .Values.clusterDNS }}
        - --cluster-dns={{ . }}
        {{- end }}
        {{- with .Values.sessionBinaryURL }}
        - --session-binary-url={{ tpl . $ }}
        {{- end }}
        {{- if .Values.agents.enabled }}
        - --shared-secret={{ .Values.agents.credentialsSecret }}
        - --model-proxy-url=http://{{ include "c4-factory.modelProxyName" . }}.{{ .Release.Namespace }}.svc:8080
        {{- end }}
        {{- range .Values.global.imagePullSecrets }}
        - --shared-pull-secret={{ .name }}
        {{- end }}
        {{- if .Values.ui.enabled }}
        - --ui-service-account={{ .Release.Namespace }}/{{ include "c4-factory.uiName" . }}
        {{- end }}
        command:
        - /manager
        # The namespace the shared Secrets are read from, into every project
        # namespace labeled c4.factory.io/shared-secrets=true.
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The chart this operator was installed with, reported in Project
        # status for the UI's version line.
        - name: C4_CHART_VERSION
          value: {{ .Chart.Version | quote }}
        image: "{{ .Values.manager.image.repository | default "controller" }}{{- if not (contains "@" (.Values.manager.image.repository | default "controller")) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.manager.healthProbe.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
          # A busy single-node host can keep a healthy process from answering
          # within the 1 s default; only a real hang should restart it (#957).
          timeoutSeconds: 5
        name: manager
        ports:
        - containerPort: {{ .Values.manager.healthProbe.port }}
          name: health
          protocol: TCP
        {{- if .Values.webhook.enabled }}
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.manager.healthProbe.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        # The root filesystem is read-only; a Go module is repacked through
        # files here when a release publishes it (internal/gitprovider).
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          {{- with .Values.manager.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "c4-factory.serviceAccountName" . }}
      {{- if and (hasKey .Values.manager "terminationGracePeriodSeconds") (ne .Values.manager.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- with .Values.manager.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
