apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "theos.resourceName" (dict "suffix" "project-name-equals-namespace" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - theos.factory.io
      apiVersions:
      - '*'
      operations:
      - CREATE
      resources:
      - projects
  validations:
  - expression: object.metadata.name == object.metadata.namespace
    messageExpression: '''a Project must be named after its namespace: want '' + object.metadata.namespace
      + '', got '' + object.metadata.name'
    reason: Invalid
