{{- if .Values.gitEvents.enabled }}
# The receiver of the Git host's deliveries: Gitea's organization hooks POST
# to <gitEvents.url>/git-events/<namespace>/<name>, signed with each
# GitProvider's own Secret (docs/plans/done/git-events.md, decision 10).
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "theos.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "theos.gitEventsName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: http
    port: {{ .Values.gitEvents.port }}
    protocol: TCP
    targetPort: git-events
  selector:
    app.kubernetes.io/name: {{ include "theos.name" . }}
    control-plane: controller-manager
{{- end }}
