{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: briefs.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Brief
    listKind: BriefList
    plural: briefs
    singular: brief
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.round
      name: Round
      type: integer
    - jsonPath: .status.suggestionsWaiting
      name: Suggestions
      type: integer
    - jsonPath: .status.failedWaiting
      name: Failed
      type: integer
    - jsonPath: .status.needsYouWaiting
      name: Needs you
      type: integer
    - jsonPath: .status.apps[*].lastRelease.tag
      name: Releases
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Brief is an app idea in plain words and its follow-up prompts. A planner
          Agent turns each round (the idea, then each batch of new prompts) into the
          model, a Crew per new Container and the first issues, and says in plain
          words what it chose. Deleting a Brief keeps what it made.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the idea, the prompts and the Agents
            properties:
              agents:
                default: {}
                description: agents names the Agents the Brief works with.
                properties:
                  designer:
                    default:
                      name: designer
                    description: designer names the Agent that designs for the Crews.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  implementer:
                    default:
                      name: implementer
                    description: implementer names the Agent that implements the Crews'
                      issues.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  planner:
                    default:
                      name: planner
                    description: planner names the Agent that plans each round.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  reviewer:
                    default:
                      name: reviewer
                    description: reviewer names the Agent that reviews the Crews'
                      work.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              autopilot:
                description: |-
                  autopilot says whether the Brief tends its failed issues by itself, in
                  tending rounds with no new prompt (docs/plans/done/brief-autopilot.md):
                  Off tends nothing; Ask decides them and lists each answer under
                  status.needsYou for a prompt to confirm; On applies them. Unset is the
                  operator's default, Ask.
                enum:
                - "Off"
                - Ask
                - "On"
                type: string
              gitProviderRef:
                default:
                  name: gitea
                description: |-
                  gitProviderRef names the GitProvider that hosts the Brief's repository
                  and the repositories of the Containers it plans.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              idea:
                description: |-
                  idea says in plain words what the app is for and who uses it. It can't
                  change; steer with prompts.
                maxLength: 4000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: idea is immutable; add a prompt
                  rule: self == oldSelf
              parallel:
                description: |-
                  parallel is how many issues each Crew the Brief made works on at once,
                  set on those Crews every reconcile, earlier rounds' included
                  (docs/plans/done/brief-parallel.md). Unset is the operator's default, 3.
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              paused:
                description: |-
                  paused stops the Brief's work in one step (docs/plans/upgrade-in-place.md):
                  while true, the Brief pauses every Crew it made, marking each with
                  c4.factory.io/paused-by: brief, starts no new round (a new prompt waits)
                  and tends no failed issue; a planner Task already started runs to its
                  end. Set back to false, it unpauses only the Crews it marked, so a Crew
                  paused by hand stays paused. The Paused condition says what still runs.
                type: boolean
              prompts:
                description: |-
                  prompts are follow-ups in plain words, oldest first. A prompt is only
                  ever appended: an earlier one can't change. At most 50 are listed: the
                  write that appends to a full list retires the oldest planned ones in
                  the same write, dropping them and counting them in promptsRetired. The
                  UI does it for the person; the operator never writes the spec.
                items:
                  maxLength: 2000
                  minLength: 1
                  type: string
                maxItems: 51
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: 'a Brief lists at most 50 prompts: in the write that appends,
                    drop the oldest prompts rounds have planned (status.promptsPlanned
                    counts them) and raise promptsRetired by as many'
                  rule: size(self) <= 50
              promptsRetired:
                description: |-
                  promptsRetired is how many of the oldest prompts were taken out of
                  prompts once planned; it only grows. The status counts every prompt
                  ever written, retired ones included, so prompts[i] is prompt number
                  promptsRetired+i+1.
                format: int32
                minimum: 0
                type: integer
              releases:
                description: |-
                  releases name the Containers whose releases the person asks for, and the
                  GitHub repository each one's releases are published to. An entry turns
                  releases on for its Container and sets the publishReleases of the Crew
                  the Brief made for it; removing it leaves that Crew as it is.
                items:
                  description: |-
                    BriefRelease is where a Container's releases are published: the fields of a
                    Crew's publishReleases, for the Crew the Brief made for the Container.
                  properties:
                    container:
                      description: container names the Container, a DNS label.
                      maxLength: 63
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: 'container must be a DNS label: lowercase letters,
                          digits and ''-'''
                        rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                    github:
                      description: github is the GitHub repository the releases go
                        to.
                      properties:
                        repository:
                          description: repository is owner/name on github.com.
                          maxLength: 140
                          type: string
                          x-kubernetes-validations:
                          - message: repository must be owner/name
                            rule: self.matches('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')
                        tokenSecretRef:
                          description: |-
                            tokenSecretRef names a Secret in the Crew's namespace whose key token is
                            a fine-grained token for that repository alone, with Contents read and
                            write. The user creates it; the token never leaves the operator.
                          properties:
                            name:
                              description: name of the referenced object.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - repository
                      - tokenSecretRef
                      type: object
                    latest:
                      description: |-
                        latest says whether each release published becomes the repository's
                        Latest release on GitHub. It defaults to true; set it to false for every
                        app but the one people install, when several publish to one repository,
                        so a library's release doesn't take Latest from it. A release published
                        before it changed keeps what it got.
                      type: boolean
                    requests:
                      description: |-
                        requests says whether the Brief takes requests from the repository's
                        GitHub issues, and whose (docs/plans/brief-requests.md). Unset takes
                        none.
                      properties:
                        accepted:
                          description: accepted are the numbers of the issues a person
                            let through, in Ask.
                          items:
                            format: int32
                            minimum: 1
                            type: integer
                          maxItems: 200
                          type: array
                          x-kubernetes-list-type: set
                        authors:
                          description: authors are the GitHub logins whose issues
                            are requests.
                          items:
                            maxLength: 39
                            pattern: ^[A-Za-z0-9](-?[A-Za-z0-9])*$
                            type: string
                          maxItems: 50
                          type: array
                          x-kubernetes-list-type: set
                        declined:
                          description: |-
                            declined are the numbers of the issues a person turned down; the Brief
                            says so on each and closes it.
                          items:
                            format: int32
                            minimum: 1
                            type: integer
                          maxItems: 200
                          type: array
                          x-kubernetes-list-type: set
                        mode:
                          default: "Off"
                          description: |-
                            mode is Off (the default), which reads no issue; Ask, where a request
                            waits in status.needsYou until its number is in accepted; or On, which
                            lets each request through when first seen.
                          enum:
                          - "Off"
                          - Ask
                          - "On"
                          type: string
                        teams:
                          description: |-
                            teams are GitHub teams, org/slug, whose members' issues are requests.
                            The token then needs Organization members read.
                          items:
                            maxLength: 140
                            pattern: ^[A-Za-z0-9](-?[A-Za-z0-9])*/[A-Za-z0-9][A-Za-z0-9_-]*$
                            type: string
                          maxItems: 20
                          type: array
                          x-kubernetes-list-type: set
                      type: object
                      x-kubernetes-validations:
                      - message: requests need authors or teams unless mode is Off
                        rule: (has(self.mode) && self.mode == 'Off') || (has(self.authors)
                          && size(self.authors) > 0) || (has(self.teams) && size(self.teams)
                          > 0)
                      - message: an issue number can't be both accepted and declined
                        rule: '!has(self.accepted) || !has(self.declined) || !self.accepted.exists(n,
                          n in self.declined)'
                    source:
                      description: |-
                        source puts the app's source, as of each release's tag, into a folder
                        of the repository, with a tag of its own, so go install from GitHub
                        finds it. The factory's own files are left out. Removing it stops
                        publishing the source; what is on GitHub stays.
                      properties:
                        path:
                          description: |-
                            path is the folder, such as engine; "." is the whole repository. The
                            folder is the app's: each release replaces what it holds. Two Crews
                            publishing to one repository need folders apart, neither inside the
                            other.
                          maxLength: 100
                          minLength: 1
                          pattern: ^([.]|[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)$
                          type: string
                          x-kubernetes-validations:
                          - message: path must have no '.', '..' or '.git' folder
                              in it
                            rule: self == '.' || !self.matches('(^|/)([.][.]?|[.][gG][iI][tT])(/|$)')
                        tagPrefix:
                          description: |-
                            tagPrefix goes before the Crew's tag in the source's tag. Unset, it is
                            the path and "/" (engine/v0.6.1, the tag go install looks for), and
                            nothing for ".".
                          maxLength: 101
                          pattern: ^[A-Za-z0-9._/-]*$
                          type: string
                          x-kubernetes-validations:
                          - message: 'tagPrefix must make a git tag name: no leading
                              ''.'', ''/'' or ''-'', no ''..'', ''//'' or ''/.'',
                              and no folder ending in .lock'
                            rule: '!self.matches(''^[./-]|//|/[.]|[.][.]|[.]lock(/|$)'')'
                      required:
                      - path
                      type: object
                    tagPrefix:
                      description: |-
                        tagPrefix goes before the Crew's tag on the target, such as "cli-" when
                        two Containers publish to one repository: cli-v0.2.0.
                      maxLength: 40
                      pattern: ^[A-Za-z0-9._/-]*$
                      type: string
                  required:
                  - container
                  - github
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - container
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'at most one releases entry per GitHub repository may take
                    requests: an issue is read once'
                  rule: self.all(a, !has(a.requests) || !has(a.requests.mode) || a.requests.mode
                    == 'Off' || self.exists_one(b, has(b.requests) && has(b.requests.mode)
                    && b.requests.mode != 'Off' && b.github.repository.lowerAscii()
                    == a.github.repository.lowerAscii()))
                - message: two releases entries of one GitHub repository need source
                    folders apart, neither inside the other
                  rule: self.all(a, !has(a.source) || self.all(b, b.container == a.container
                    || !has(b.source) || b.github.repository.lowerAscii() != a.github.repository.lowerAscii()
                    || !(a.source.path == '.' || b.source.path == '.' || a.source.path
                    == b.source.path || a.source.path.startsWith(b.source.path + '/')
                    || b.source.path.startsWith(a.source.path + '/'))))
            required:
            - idea
            type: object
            x-kubernetes-validations:
            - message: 'prompts are append-only: an earlier prompt can''t change or
                go'
              rule: '!has(oldSelf.prompts) || size(oldSelf.prompts) == 0 || has(self.prompts)'
            - message: promptsRetired only grows
              rule: '(has(self.promptsRetired) ? self.promptsRetired : 0) >= (has(oldSelf.promptsRetired)
                ? oldSelf.promptsRetired : 0)'
            - message: 'prompts are append-only: only the oldest can go, each counted
                in promptsRetired, and an earlier prompt can''t change'
              rule: '!has(oldSelf.prompts) ? (has(self.promptsRetired) ? self.promptsRetired
                : 0) <= (has(oldSelf.promptsRetired) ? oldSelf.promptsRetired : 0)
                : (((has(self.promptsRetired) ? self.promptsRetired : 0) - (has(oldSelf.promptsRetired)
                ? oldSelf.promptsRetired : 0)) < 0 || (((has(self.promptsRetired)
                ? self.promptsRetired : 0) - (has(oldSelf.promptsRetired) ? oldSelf.promptsRetired
                : 0)) <= size(oldSelf.prompts) && (has(self.prompts) ? size(self.prompts)
                : 0) >= size(oldSelf.prompts) - ((has(self.promptsRetired) ? self.promptsRetired
                : 0) - (has(oldSelf.promptsRetired) ? oldSelf.promptsRetired : 0))
                && oldSelf.prompts.all(i, p, i < ((has(self.promptsRetired) ? self.promptsRetired
                : 0) - (has(oldSelf.promptsRetired) ? oldSelf.promptsRetired : 0))
                || self.prompts[i - ((has(self.promptsRetired) ? self.promptsRetired
                : 0) - (has(oldSelf.promptsRetired) ? oldSelf.promptsRetired : 0))]
                == p)))'
          status:
            description: status defines the observed state of Brief
            properties:
              apps:
                description: |-
                  apps has a line per Container the Brief made, then one per spec.releases
                  entry naming no Container it made: whether its releases are on, where
                  they are published, the latest one, and a sentence on how they go.
                items:
                  description: |-
                    BriefApp is a Container the Brief made, or one spec.releases names, and how
                    its releases go: copied from the Crew, which holds every fact.
                  properties:
                    container:
                      description: container names the Container.
                      maxLength: 253
                      type: string
                    crew:
                      description: crew names the Container's Crew; empty while it
                        has none.
                      maxLength: 253
                      type: string
                    lastRelease:
                      description: lastRelease is the Crew's latest release.
                      properties:
                        publishState:
                          description: |-
                            publishState is how publishing the release went: Pending, Publishing,
                            Published or Failed; empty when the Crew publishes none.
                          type: string
                        publishedURL:
                          description: publishedURL is the published release.
                          type: string
                        run:
                          description: 'run is how the tag''s CI runs went: Waiting,
                            Running, Succeeded or Failed.'
                          type: string
                        tag:
                          description: tag is the release's version.
                          type: string
                        time:
                          description: time is when the Crew tagged the release.
                          format: date-time
                          type: string
                        url:
                          description: url is the release's page on the Git host.
                          type: string
                      required:
                      - tag
                      type: object
                    message:
                      description: message says in one plain sentence how the app's
                        releases go.
                      maxLength: 1000
                      type: string
                    parallel:
                      description: |-
                        parallel is how many issues the Crew works on at once; 0 while it has
                        no Crew.
                      format: int32
                      maximum: 5
                      minimum: 0
                      type: integer
                    publishTo:
                      description: |-
                        publishTo is the GitHub repository, owner/name, the Crew publishes its
                        releases to; empty when it publishes none.
                      maxLength: 140
                      type: string
                    releases:
                      description: releases is On when the Crew tags releases, else
                        Off.
                      enum:
                      - "On"
                      - "Off"
                      type: string
                  required:
                  - container
                  - releases
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              attention:
                description: |-
                  attention lists what the Brief made that it leaves alone for now, as
                  it may heal by itself, and when it acts if it hasn't; at most 100.
                  Empty while autopilot is Off.
                items:
                  description: |-
                    BriefHealing is an item the Brief watches and leaves alone for now, as it
                    may heal by itself, and when the Brief acts if it hasn't.
                  properties:
                    actsAt:
                      description: |-
                        actsAt is when the Brief acts if it hasn't healed; unset when it acts
                        only once the item changes.
                      format: date-time
                      type: string
                    kind:
                      description: |-
                        kind of the item: Issue, Task, Crew, Container or Request. A Request
                        is answered in spec.releases[].requests, and a Container whose Standard
                        files an update left out on the Container, not by a prompt.
                      enum:
                      - Issue
                      - Task
                      - Crew
                      - Container
                      - Request
                      type: string
                    name:
                      description: |-
                        name of the item; container#number for an issue, owner/name#number for
                        a request.
                      maxLength: 320
                      type: string
                    reason:
                      description: reason says why it is left alone, in a sentence.
                      maxLength: 1000
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              autopilot:
                description: |-
                  autopilot is the mode the Brief runs in, set every reconcile:
                  spec.autopilot, or the operator's default, Ask, when that is unset.
                enum:
                - "Off"
                - Ask
                - "On"
                type: string
              choices:
                description: choices are what the planner chose in the last round,
                  in plain words.
                items:
                  maxLength: 500
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: |-
                  conditions: Planned says whether the last round's plan is applied, and
                  why not. NeedsInput, while True, says in one sentence what the Brief
                  waits for from the person. NeedsYou, while True, says the first of
                  needsYou and how many more. Requests says whether the issues of the
                  repositories that take requests can be read.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costMilliUSD:
                description: |-
                  costMilliUSD is what the Brief's planning cost over all rounds, in
                  thousandths of a US dollar.
                format: int64
                type: integer
              created:
                description: created lists the objects the Brief made, over all rounds.
                items:
                  description: BriefObject names an object a Brief created.
                  properties:
                    kind:
                      description: kind of the object, such as Container or Crew.
                      maxLength: 63
                      type: string
                    name:
                      description: name of the object.
                      maxLength: 253
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              failed:
                description: |-
                  failed are the issues handed back to a person in the repositories of
                  the Containers the Brief made, by Container and number; at most 50. A
                  prompt says whether to try them again.
                items:
                  description: |-
                    BriefFailedIssue is an issue handed back to a person (status/needs-human) in
                    the repository of a Container the Brief made, and why.
                  properties:
                    container:
                      description: container is the Container whose repository has
                        the issue.
                      maxLength: 253
                      type: string
                    kind:
                      description: |-
                        kind says why it was handed back: unclear (no acceptance criteria),
                        merged (a Task merged it already), exhausted (agents tried it as often
                        as a Crew does), failed (its last Task failed), blocked (its last
                        Task's agent said it can't start the issue yet, and why), person (a
                        person handed it back) or byHand (a kind/by-hand issue: criteria only a
                        person can do, which a plan may close but never retry).
                      enum:
                      - unclear
                      - merged
                      - exhausted
                      - failed
                      - blocked
                      - person
                      - byHand
                      type: string
                    number:
                      description: number of the issue in its repository.
                      format: int32
                      minimum: 1
                      type: integer
                    reason:
                      description: reason says why in a sentence, such as the failed
                        Task's message.
                      maxLength: 1000
                      type: string
                    title:
                      description: title of the issue.
                      maxLength: 255
                      type: string
                    tries:
                      description: tries is how many Tasks the issue has had.
                      format: int32
                      minimum: 0
                      type: integer
                    url:
                      description: url is the issue's address.
                      type: string
                  required:
                  - container
                  - kind
                  - number
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              failedWaiting:
                description: |-
                  failedWaiting is how many failed issues wait for an answer, those past
                  the 50 listed too.
                format: int32
                type: integer
              history:
                description: history has an entry per round, oldest first; the newest
                  20 are kept.
                items:
                  description: 'BriefRound is one round of planning: the idea, or
                    a batch of new prompts.'
                  properties:
                    choices:
                      description: choices are what the planner chose, in plain words.
                      items:
                        maxLength: 500
                        type: string
                      maxItems: 50
                      type: array
                      x-kubernetes-list-type: atomic
                    costMilliUSD:
                      description: |-
                        costMilliUSD is what the round's planning cost, in thousandths of a
                        US dollar.
                      format: int64
                      type: integer
                    needsInput:
                      description: needsInput is the planner's question, when the
                        round asked for input.
                      maxLength: 1000
                      type: string
                    outcome:
                      description: |-
                        outcome is how the round ended: Applied, PlannerNeedsInput or
                        RoundFailed; Tended for a tending round that applied.
                      enum:
