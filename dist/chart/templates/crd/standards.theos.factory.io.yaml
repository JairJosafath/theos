{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: standards.theos.factory.io
spec:
  conversion:
    strategy: None
  group: theos.factory.io
  names:
    categories:
    - theos
    - c4catalog
    kind: Standard
    listKind: StandardList
    plural: standards
    singular: standard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.supportedFrameworks
      name: Frameworks
      type: string
    - jsonPath: .spec.template.ref
      name: Ref
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Standard is a catalog entry: the coding rules and checks of a Container. It is
          rendered as a layer right after the Framework. It is owned by the Project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the template, and the Container types and Frameworks
              it supports
            properties:
              checksBeforeRelease:
                description: |-
                  checksBeforeRelease says the Standard's templates can run the full check
                  only before a release: a light check on each change when a Container asks
                  for checks BeforeRelease, and the full one on a release-check/** branch.
                  Without it, its Containers run the full check on every change.
                type: boolean
              description:
                description: description says what this entry adds to a Container.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name.
                maxLength: 100
                type: string
              protectedPaths:
                description: |-
                  protectedPaths are the Standard's files that agents must not change, such as
                  the check contract and lint configuration: a file path, or a directory ending
                  in "/". The Git host refuses to merge pull requests that change them, next to
                  the paths the platform always protects (.gitea/, .devcontainer/, .theos.yaml).
                items:
                  pattern: ^[^/*?\[\]][^*?\[\]]*$
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              schedules:
                description: |-
                  schedules are the recurring goals the Standard proposes to the Crews of
                  its Containers, such as its language's weekly dependency update
                  (docs/design.md, "Schedules"), each in the shape of a Crew's schedule.
                  A proposal turns nothing on: the operator never copies one into a
                  Crew. A Crew takes one when a person adds it to the Crew's own
                  spec.schedules, under the proposal's name, and may change it there; a
                  Crew that leaves it does nothing. A cron or a time zone only the
                  operator can tell is wrong is reported by the Crew that takes it, in
                  its Scheduled condition.
                items:
                  description: |-
                    CrewSchedule is one recurring goal of a Crew: when its time comes, the Crew
                    files an issue with the goal. A Standard proposes schedules in this same
                    shape (StandardSpec.Schedules), so a Crew takes one as it is written.
                  properties:
                    cron:
                      description: |-
                        cron is when the schedule is due, as five fields: minute, hour, day of
                        month, month and day of week (0 or 7 is Sunday), each a number, a range
                        a-b, a step */n or a-b/n, a comma-separated list of those, or *. An
                        expression the operator can't use (minute 60, the 30th of February)
                        leaves the Crew's Scheduled condition False, reason InvalidSchedule.
                      maxLength: 100
                      pattern: ^[0-9*/,-]+( [0-9*/,-]+){4}$
                      type: string
                    goal:
                      description: |-
                        goal is what the issue asks for, in plain words: what to do, and what
                        to leave. It becomes the issue's Goal section.
                      maxLength: 4000
                      minLength: 1
                      type: string
                    name:
                      description: name names the schedule in its issues' titles and
                        in the status.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    timeZone:
                      default: UTC
                      description: |-
                        timeZone is the IANA time zone cron is in, such as Europe/Amsterdam;
                        daylight saving follows it. Unset is UTC. A name the operator can't
                        load leaves the Scheduled condition False, reason InvalidSchedule.
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - cron
                  - goal
                  - name
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              supportedFrameworks:
                description: supportedFrameworks lists the Frameworks, by name, whose
                  code this Standard can check.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              supportedTypes:
                description: supportedTypes lists the Container types this entry can
                  scaffold.
                items:
                  description: ContainerType is the fixed list of application shapes
                    a Container can take.
                  enum:
                  - static-site
                  - service
                  - job
                  - worker
                  - mobile-app
                  - cli
                  - extension
                  - operator
                  - function
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              template:
                description: template is the repository and pinned ref to scaffold
                  from.
                properties:
                  path:
                    description: |-
                      path is a directory of the repository that holds the template, relative
                      to its root, such as domains/billing. The operator reads only that
                      subtree, at ref, with paths relative to it; files outside it are not
                      part of the template. Unset is the repository's root (#35).
                    maxLength: 255
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: path is relative to the repository's root, not absolute
                      rule: '!self.startsWith(''/'')'
                    - message: path has no trailing or doubled /
                      rule: '!self.endsWith(''/'') && !self.contains(''//'')'
                    - message: path has no . or .. segments
                      rule: '!self.matches(''(^|/)[.][.]?(/|$)'')'
                  ref:
                    description: ref is a tag or a full commit SHA, never a branch.
                    maxLength: 255
                    minLength: 1
                    type: string
                  url:
                    description: url of the template's Git repository.
                    pattern: ^https?://
                    type: string
                required:
                - ref
                - url
                type: object
              testEnvironments:
                description: |-
                  testEnvironments names the TestEnvironments, such as browser, that
                  the runs of its Containers' Tasks get when the project has them
                  (docs/plans/done/test-environments.md, T2). One the project lacks gives the
                  Container TestEnvironments=False, NotInProject, and the runs go on
                  without it; an issue labelled env/<name> asks for one it can't do
                  without.
                items:
                  pattern: ^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$
                  type: string
                maxItems: 8
                type: array
                x-kubernetes-list-type: set
            required:
            - supportedFrameworks
            - supportedTypes
            - template
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
{{- end }}
