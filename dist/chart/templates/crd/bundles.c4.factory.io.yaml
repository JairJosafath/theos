      type: date
    deprecated: true
    deprecationWarning: c4.factory.io/v1alpha1 is deprecated since v0.30.0; use c4.factory.io/v1beta1.
      A release 90 or more days after v0.30.0 (2027-01-22 at the earliest) may drop
      it (#1963).
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Bundle is a catalog entry with no template of its own: a Framework, Standard,
          Compute and Deployment picked together, which a Container names instead of
          the four. It has no reconciler and no status; what it supports is the
          intersection of its entries' supportedTypes, computed where it is read.
          It is owned by the Project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec names the bundle's catalog entries
            properties:
              computeRef:
                description: computeRef names the Compute catalog entry.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deploymentRef:
                description: deploymentRef names the Deployment catalog entry.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              description:
                description: description says what the bundle is for.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name.
                maxLength: 100
                type: string
              frameworkRef:
                description: frameworkRef names the Framework catalog entry.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              standardRef:
                description: standardRef names the Standard catalog entry. It must
                  list the Framework.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - frameworkRef
            type: object
        required:
