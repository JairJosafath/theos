{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: domains.c4.factory.io
spec:
  conversion:
    strategy: None
  group: c4.factory.io
  names:
    categories:
    - c4
    - c4catalog
    kind: Domain
    listKind: DomainList
    plural: domains
    singular: domain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.template.ref
      name: Ref
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    deprecationWarning: c4.factory.io/v1alpha1 is deprecated since v0.30.0; use c4.factory.io/v1beta1.
      A release 90 or more days after v0.30.0 (2027-01-22 at the earliest) may drop
      it (#1963).
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Domain is a catalog entry: what a SoftwareSystem is about, such as a webshop.
          A system names its Domains in spec.domainRefs, and each of its Containers is
          scaffolded with them under docs/agents/domain/<name>/. It is owned by the Project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the template
            properties:
              description:
                description: description says what the domain covers.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name, such as "Webshop".
                maxLength: 100
                type: string
              template:
                description: template is the repository and pinned ref to scaffold
                  from.
                properties:
                  ref:
                    description: ref is a tag or a full commit SHA, never a branch.
                    maxLength: 255
                    minLength: 1
                    type: string
                  url:
                    description: url of the template's Git repository.
                    pattern: ^https?://
                    type: string
                required:
                - ref
                - url
                type: object
            required:
            - template
            type: object
        required:
        - spec
        type: object
    served: true
    storage: false
    subresources: {}
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.template.ref
      name: Ref
      type: string
    - jsonPath: .metadata.creationTimestamp
