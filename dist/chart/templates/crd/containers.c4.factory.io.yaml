{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: containers.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Container
    listKind: ContainerList
    plural: containers
    singular: container
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.checks.state
      name: Checks
      type: string
    - jsonPath: .status.activeSessions
      name: Sessions
      type: integer
    - jsonPath: .status.repositoryURL
      name: Repository
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Container is an application with its own repository. It is owned by its
          SoftwareSystem and scaffolded exactly once.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Container
            properties:
              checks:
                default: EveryChange
                description: |-
                  checks is when CI runs the application's full check: EveryChange runs it on
                  every pull request and push to main; BeforeRelease runs a light check on each
                  change and the full one on the commit a release will be tagged at. It takes
                  effect only when the Standard says it can (checksBeforeRelease); the
                  condition ChecksApplied says when it doesn't.
                enum:
                - EveryChange
                - BeforeRelease
                type: string
              computeRef:
                description: 'computeRef names the Compute catalog entry: resource
                  sizing.'
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deploymentRef:
                description: 'deploymentRef names the Deployment catalog entry: how
                  the application ships.'
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              description:
                description: description says what the application does.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name, such as "Orders
                  API".
                maxLength: 100
                type: string
              frameworkRef:
                description: 'frameworkRef names the Framework catalog entry: language,
                  framework and tooling.'
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              gitProviderRef:
                description: gitProviderRef names the GitProvider that hosts the repository.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              softwareSystemRef:
                description: softwareSystemRef names the SoftwareSystem this Container
                  belongs to. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: softwareSystemRef is immutable
                  rule: self == oldSelf
              standardRef:
                description: |-
                  standardRef names the Standard catalog entry: coding rules, checks and CI. It
                  must list the Framework.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              type:
                description: type is the shape of the application. Every catalog entry
                  used must support it.
                enum:
                - static-site
                - service
                - job
                - worker
                - mobile-app
                - cli
                - extension
                - operator
                type: string
            required:
            - frameworkRef
            - gitProviderRef
            - softwareSystemRef
            - type
            type: object
          status:
            description: status defines the observed state of Container
            properties:
              activeSessions:
                description: activeSessions is the number of Active Sessions on this
                  Container.
                format: int32
                type: integer
              appliedConnectors:
                description: |-
                  appliedConnectors records, for each applied Relationship, the DataStore it
                  pointed at and the Connector that went into the scaffold. A Container
                  scaffolded before this was kept has only appliedRelationships.
                items:
                  description: AppliedConnector is what one Relationship added to
                    a scaffold.
                  properties:
                    connector:
                      description: connector is the DataStore's Connector that was
                        applied.
                      type: string
                    dataStore:
                      description: dataStore is the DataStore the Relationship pointed
                        at.
                      type: string
                    relationship:
                      description: relationship is the Relationship's name.
                      type: string
                  required:
                  - connector
                  - dataStore
                  - relationship
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - relationship
                x-kubernetes-list-type: map
              appliedRelationships:
                description: appliedRelationships lists the Relationships whose Connectors
                  were part of the scaffold.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              checks:
                description: |-
                  checks is the latest CI result on the default branch. Only Containers with a
                  Standard have checks.
                properties:
                  commit:
                    description: commit is the SHA the checks ran on.
                    type: string
                  state:
                    description: state is pending, success, failure or error; empty
                      until a check reports.
                    type: string
                  url:
                    description: url links to the check run.
                    type: string
                type: object
              conditions:
                description: |-
                  conditions: ReferencesResolved, ChoicesValid, RepositoryCreated, Scaffolded
                  and, for a Container with a Standard, StandardUpdated and ChecksApplied.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: phase is Pending, Scaffolding, then Ready or Failed.
                enum:
                - Pending
                - Scaffolding
                - Ready
                - Failed
                type: string
              repositoryURL:
                description: repositoryURL is the web address of the scaffolded repository.
                type: string
              scaffoldedFrom:
                description: scaffoldedFrom lists the templates used, as name@ref,
                  in layer order.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              standard:
                description: |-
                  standard says which ref of its Standard the repository's Standard files are
                  at, and the update in flight. Only a Ready Container with a Standard that
                  was part of its scaffold has it.
                properties:
                  behind:
                    description: |-
                      behind are the Standard's files an update left out, because the
                      repository had changed them in lines the Standard changed too, each with
                      the ref its repository copy was last brought to. Each later update merges
                      them against that ref; they stay until it brings them up to date or a
                      person settles them.
                    items:
                      description: |-
                        StandardFile is one of a Standard's files in the repository, at a ref of the
                        Standard.
                      properties:
                        path:
                          description: path is the file's path in the repository.
                          type: string
                        pullRequestURL:
                          description: |-
                            pullRequestURL is the address of the update's pull request that last
                            left the file out, when one did.
                          type: string
                        ref:
                          description: |-
                            ref is the Standard's template ref the file was last brought to, or
                            kept at.
                          type: string
                      required:
                      - path
                      - ref
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - path
                    x-kubernetes-list-type: map
                  checks:
                    description: |-
                      checks is when the repository's CI runs the full check, as its Standard
                      files were last rendered: the scaffold's, then each merged update's. Empty
                      reads as EveryChange.
                    enum:
                    - EveryChange
                    - BeforeRelease
                    type: string
                  kept:
                    description: |-
                      kept are the Standard's files a person chose to keep as the repository
                      has them, each with the ref it was kept at.
                    items:
                      description: |-
                        StandardFile is one of a Standard's files in the repository, at a ref of the
                        Standard.
                      properties:
                        path:
                          description: path is the file's path in the repository.
                          type: string
                        pullRequestURL:
                          description: |-
                            pullRequestURL is the address of the update's pull request that last
                            left the file out, when one did.
                          type: string
                        ref:
                          description: |-
                            ref is the Standard's template ref the file was last brought to, or
                            kept at.
                          type: string
                      required:
                      - path
                      - ref
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - path
                    x-kubernetes-list-type: map
                  leftOut:
                    description: leftOut are the paths of behind, kept for what reads
                      them.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  name:
                    description: name is the Standard's name.
                    type: string
                  ref:
                    description: |-
                      ref is the Standard's template ref the repository's Standard files are at:
                      the scaffold's, then each merged update's.
                    type: string
                  update:
                    description: update is the Standard update in flight, or the last
                      one, stopped.
                    properties:
                      branch:
                        description: branch is the update's branch, and commit the
                          one commit on it.
                        type: string
                      checks:
                        description: |-
                          checks is when CI runs the full check once the update merges. Empty reads
                          as EveryChange.
                        enum:
                        - EveryChange
                        - BeforeRelease
                        type: string
                      commit:
                        type: string
                      leftOut:
                        description: |-
                          leftOut are the files the update leaves out, because the repository
                          changed them since the Standard's files were last rendered in ways that
                          don't merge with the Standard's changes.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      merged:
                        description: |-
                          merged are the paths the update writes that the repository changed too
                          since the Standard's files were last rendered, in other lines: the update
                          writes the two changes merged.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      paths:
                        description: paths are the files the update writes or removes.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      pullRequest:
                        description: |-
                          pullRequest is the number of the update's pull request, and pullRequestURL
                          its address.
                        format: int32
                        type: integer
                      pullRequestURL:
                        type: string
                      ref:
                        description: ref is the Standard's template ref the update
                          brings the files to.
                        type: string
                      stopped:
                        description: |-
                          stopped is why the update stopped without merging, such as UpdateClosed;
                          a stopped update waits for the Standard's ref or the Container's effective
                          checks to change, except NoLightCheck, which is planned again every pass.
                        type: string
                      take:
                        description: |-
                          take says the pull request takes the Standard's version at ref of the
                          files behind, as a person answered with the standard-take annotation.
                        type: boolean
                    required:
                    - ref
                    type: object
                required:
                - name
                - ref
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
