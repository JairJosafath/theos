{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: deployments.theos.factory.io
spec:
  conversion:
    strategy: None
  group: theos.factory.io
  names:
    categories:
    - theos
    - c4catalog
    kind: Deployment
    listKind: DeploymentList
    plural: deployments
    shortNames:
    - c4deploy
    singular: deployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.supportedTypes
      name: Types
      type: string
    - jsonPath: .spec.template.ref
      name: Ref
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    deprecationWarning: theos.factory.io/v1alpha1 is deprecated since v0.30.0; use
      theos.factory.io/v1beta1. A release 90 or more days after v0.30.0 may drop it
      (#1963).
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Deployment is a catalog entry: how a Container ships, as standard files that existing tools pick up.
          It is owned by the Project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the template and the Container types it supports
            properties:
              description:
                description: description says what this entry adds to a Container.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name.
                maxLength: 100
                type: string
              supportedTypes:
                description: supportedTypes lists the Container types this entry can
                  scaffold.
                items:
                  description: ContainerType is the fixed list of application shapes
                    a Container can take.
                  enum:
                  - static-site
                  - service
                  - job
                  - worker
                  - mobile-app
                  - cli
                  - extension
                  - operator
                  - function
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              template:
                description: template is the repository and pinned ref to scaffold
                  from.
                properties:
                  ref:
                    description: ref is a tag or a full commit SHA, never a branch.
                    maxLength: 255
                    minLength: 1
                    type: string
                  url:
                    description: url of the template's Git repository.
                    pattern: ^https?://
                    type: string
                required:
                - ref
                - url
                type: object
            required:
            - supportedTypes
            - template
            type: object
        required:
        - spec
        type: object
    served: true
    storage: false
    subresources: {}
