{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: crews.c4.factory.io
spec:
  group: c4.factory.io
  names:
    categories:
    - c4
    kind: Crew
    listKind: CrewList
    plural: crews
    singular: crew
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.containerRef.name
      name: Container
      type: string
    - jsonPath: .spec.implementer.name
      name: Implementer
      type: string
    - jsonPath: .spec.reviewer.name
      name: Reviewer
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.parallel
      name: Parallel
      type: integer
    - jsonPath: .status.activeTasks
      name: Tasks
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Crew is the team of Agents that works on a Container's issues: it picks up
          issues labelled ready, in order and once their dependencies are closed, and
          starts a Task for each, up to spec.parallel at once. It is owned by its
          Container.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the Container and the Agents for each role
            properties:
              containerRef:
                description: |-
                  containerRef names the Container whose repository's issues the Crew works
                  on. It can't change.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: containerRef is immutable
                  rule: self == oldSelf
              description:
                description: description says what the Crew is for.
                maxLength: 1000
                type: string
              displayName:
                description: displayName is a human-friendly name.
                maxLength: 100
                type: string
              implementer:
                description: implementer names the Agent that implements each issue.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              parallel:
                default: 1
                description: |-
                  parallel is how many issues the Crew works on at once, each in its own Task
                  and branch. A change that conflicts with one merged before it goes back to
                  its implementer to merge main, without costing a round.
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              paused:
                description: |-
                  paused stops the Crew from picking up new issues. A Task already started
                  runs to its end.
                type: boolean
              reviewer:
                description: |-
                  reviewer names the Agent that reviews each round; usually a stronger model
                  than the implementer's.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - containerRef
            - implementer
            - reviewer
            type: object
          status:
            description: status defines the observed state of Crew
            properties:
              activeTasks:
                description: activeTasks names the Tasks working on the Container
                  now.
                items:
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: 'conditions: Ready says whether the Crew can pick up
                  issues, and why not.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastPolled:
                description: lastPolled is when the Crew last read the issues.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: phase is Waiting, Idle, Working or Paused.
                enum:
                - Waiting
                - Idle
                - Working
                - Paused
                type: string
              ready:
                description: ready lists the ready issues waiting for a free place,
                  in pick-up order.
                items:
                  format: int32
                  type: integer
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              waiting:
                description: |-
                  waiting lists the ready issues that wait: on open dependencies, or for an
                  earlier release (a milestone due sooner) to have no work left.
                items:
                  format: int32
                  type: integer
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
