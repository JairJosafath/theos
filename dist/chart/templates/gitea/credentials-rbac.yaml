{{- if .Values.gitea.enabled }}
{{- $ns := include "theos.giteaNamespace" . }}
# Gitea's pod, through its credentials container, may create Secrets (which
# resourceNames cannot narrow) and read only the one it makes. The shared
# runners' token, Secret gitea-runner, is the seed's (seed.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "theos.giteaAdminSecret" . }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-credentials
subjects:
  - kind: ServiceAccount
    name: gitea
    namespace: {{ $ns }}
{{- end }}
