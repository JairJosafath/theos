{{- if and .Values.gitea.enabled (not .Values.gitea.admin.existingSecret) }}
{{- $ns := include "c4-factory.giteaNamespace" . }}
{{- $generated := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" $ns "gitea-admin" }}
{{- $generated = index .data "password" | b64dec }}
{{- end }}
# The admin, generated on install and kept on upgrade. Gitea's setup container
# makes the admin match it on every start: to rotate the password, delete this
# Secret, run helm upgrade, then restart Deployment gitea.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin
  namespace: {{ $ns }}
  labels:
    {{- include "c4-factory.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.gitea.admin.username | quote }}
  email: {{ .Values.gitea.admin.email | quote }}
  password: {{ $generated | quote }}
{{- end }}
