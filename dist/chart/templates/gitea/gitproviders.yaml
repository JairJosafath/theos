{{- if .Values.gitea.enabled }}
{{- range .Values.gitea.projects | uniq }}
---
# Project {{ . }} scaffolds into its organization in the release's Gitea, with
# the token the seed stored. A hook after the seed: the GitProvider kind exists
# only once the release's CRDs do, as for gitProviders.
apiVersion: c4.factory.io/v1alpha1
kind: GitProvider
metadata:
  name: gitea
  namespace: {{ . }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: gitea
  url: {{ include "c4-factory.giteaURL" $ | quote }}
  owner: {{ . | quote }}
  credentialsSecretRef:
    name: gitea-credentials
{{- end }}
{{- end }}
