{{- if .Values.gitea.enabled }}
{{- $ns := include "theos.giteaNamespace" . }}
# Gitea's settings as GITEA__<section>__<KEY> variables, applied to app.ini on
# every start; the same as config/gitea/gitea.env, with gitea.config on top.
# Reference: https://docs.gitea.com/administration/config-cheat-sheet
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-env
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
data:
  {{- $env := dict
    "GITEA__server__DOMAIN" (printf "gitea.%s.svc.cluster.local" $ns)
    "GITEA__server__HTTP_PORT" "3000"
    "GITEA__server__ROOT_URL" (printf "%s/" (include "theos.giteaURL" .))
    "GITEA__server__DISABLE_SSH" "true"
    "GITEA__server__START_SSH_SERVER" "false"
    "GITEA__server__OFFLINE_MODE" "true"
    "GITEA__database__DB_TYPE" "sqlite3"
    "GITEA__database__PATH" "/var/lib/gitea/data/gitea.db"
    "GITEA__database__SQLITE_JOURNAL_MODE" "WAL"
    "GITEA__security__INSTALL_LOCK" "true"
    "GITEA__service__DISABLE_REGISTRATION" "true"
    "GITEA__service__REQUIRE_SIGNIN_VIEW" "false"
    "GITEA__repository__DEFAULT_BRANCH" "main"
    "GITEA__repository_0X2E_release__FILE_MAX_SIZE" "2048"
    "GITEA__indexer__ISSUE_INDEXER_TYPE" "db"
    "GITEA__log__LEVEL" "Warn"
    "GITEA__actions__ENABLED" "true" }}
  {{- if .Values.gitEvents.enabled }}
  {{- /* Webhooks reach the operator's receiver and no other host (docs/plans/git-events.md, decision 10). */}}
  {{- $_ := set $env "GITEA__webhook__ALLOWED_HOST_LIST" (include "theos.gitEventsHost" .) }}
  {{- end }}
  {{- range $k, $v := mergeOverwrite $env (.Values.gitea.config | default dict) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
