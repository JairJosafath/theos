{{- if .Values.gitea.enabled }}
{{- $ns := include "c4-factory.giteaNamespace" . }}
{{- $generated := randAlphaNum 40 }}
{{- with lookup "v1" "Secret" $ns "gitea-runner" }}
{{- $generated = index .data "token" | b64dec }}
{{- end }}
# The runners' registration token, generated on install and kept on upgrade.
# Gitea takes it as its global registration token on every start
# (GITEA_RUNNER_REGISTRATION_TOKEN), so the runners start without waiting for
# the seed, and helm install --wait sees them ready.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner
  namespace: {{ $ns }}
  labels:
    {{- include "c4-factory.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
type: Opaque
stringData:
  token: {{ $generated | quote }}
{{- end }}
