{{- if .Values.gitea.enabled }}
{{- $ns := include "theos.giteaNamespace" . }}
{{- $seed := .Values.gitea.seed }}
# The seed (hack/seed/seed.sh): the templates organization and its tagged
# template repositories, and an organization, Secret gitea-credentials and,
# when its namespace has none, a Project for each project, whose namespace it
# labels to receive the Secrets the operator shares; and Secret gitea-runner,
# the templates organization's runner registration token, which the shared
# runners register with (runners.yaml). Last, it applies ConfigMap theos-catalog's
# GitProviders, catalog and Agents in place. It runs on every install and
# upgrade: it changes nothing already in place but the fields the chart sets,
# and a new chart version brings new template tags. Not a hook: the runners
# wait for its Secret, and `helm install --wait` waits for the release's
# resources before it runs a post-install hook, so it would wait forever
# (#2030). A release resource instead, named for the revision because a Job's
# template cannot change: each upgrade makes a new Job and helm deletes the
# last one. A failed Job stays for its log until the next upgrade replaces it.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-{{ .Release.Revision }}
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" .) | nindent 4 }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ add $seed.waitSeconds 300 }}
  template:
    metadata:
      labels:
        {{- include "theos.giteaLabels" (dict "name" "seed" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: seed
      restartPolicy: Never
      {{- include "theos.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: "{{ $seed.image.repository }}:{{ $seed.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $seed.image.pullPolicy }}
          env:
            - name: GITEA_URL
              value: {{ include "theos.giteaURL" . | quote }}
            - name: GITEA_WAIT
              value: {{ $seed.waitSeconds | quote }}
            - name: PROJECTS
              value: {{ join " " (include "theos.projectNames" . | fromJsonArray) | quote }}
            - name: RUNNER_SECRET
              value: gitea-runner
            - name: RUNNER_NAMESPACE
              value: {{ $ns | quote }}
            - name: PROJECT_OBJECTS
              value: "true"
            - name: SHARE_SECRETS
              value: "true"
            - name: CATALOG
              value: /catalog/objects.yaml
            - name: GITEA_USERNAME
              valueFrom: {secretKeyRef: {name: {{ include "theos.giteaAdminSecret" . }}, key: username}}
            - name: GITEA_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "theos.giteaAdminSecret" . }}, key: password}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: catalog
              mountPath: /catalog
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: catalog
          configMap:
            name: theos-catalog
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" .) | nindent 4 }}
---
# The seed may create Secrets in Gitea's namespace (create cannot be limited
# by name) and change only gitea-runner, the shared runners' registration
# token (hack/seed/rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-runner-token
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gitea-runner]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-runner-token
  namespace: {{ $ns }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-runner-token
subjects:
  - kind: ServiceAccount
    name: seed
    namespace: {{ $ns }}
{{- with include "theos.projectNames" . | fromJsonArray }}
---
# The seed labels each project's namespace theos.factory.io/shared-secrets=true,
# which opts it in to the Secrets the operator shares: the chart's own
# Namespaces have the label, one made by hand doesn't. Only these namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "theos.resourceName" (dict "suffix" "seed-namespaces" "context" $) }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" $) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [{{ join ", " . }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "theos.resourceName" (dict "suffix" "seed-namespaces" "context" $) }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "theos.resourceName" (dict "suffix" "seed-namespaces" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: seed
    namespace: {{ $ns }}
{{- end }}
{{- range include "theos.projectNames" . | fromJsonArray }}
---
# The seed may create Secret gitea-credentials and change only that one,
# create the project's Project when the namespace has none, and apply the
# GitProvider, catalog and Agents of ConfigMap theos-catalog.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-credentials
  namespace: {{ . }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" $) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gitea-credentials]
    verbs: [get, update, patch]
  - apiGroups: [theos.factory.io]
    resources: [projects]
    verbs: [get, create]
  - apiGroups: [theos.factory.io]
    resources: [gitproviders, agents, frameworks, standards, computes, deployments, connectors, bundles, domains]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-credentials
  namespace: {{ . }}
  labels:
    {{- include "theos.giteaLabels" (dict "name" "seed" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-credentials
subjects:
  - kind: ServiceAccount
    name: seed
    namespace: {{ $ns }}
{{- end }}
{{- end }}
