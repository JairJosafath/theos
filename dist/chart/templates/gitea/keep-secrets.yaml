{{- if and .Values.gitea.enabled .Release.IsUpgrade }}
{{- $ns := include "c4-factory.giteaNamespace" . }}
{{- $seed := .Values.gitea.seed }}
{{- $owned := list }}
{{- range $name := list "gitea-admin" "gitea-runner" }}
{{- with lookup "v1" "Secret" $ns $name }}
{{- if eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" .) $.Release.Name }}
{{- $owned = append $owned $name }}
{{- end }}
{{- end }}
{{- end }}
{{- if $owned }}
# Charts up to 0.2.0 rendered Secrets gitea-admin and gitea-runner; this one
# leaves them to Gitea's pod, so helm upgrade would delete them and the pod
# would make new ones: a new admin password and runner token. Before the
# upgrade, this hook marks the ones an earlier release of this chart made
# helm.sh/resource-policy: keep, which helm reads on the live object and so
# leaves them in place. It reads only their metadata and renders no value, and
# only while such a Secret is there, so helm template never shows it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-keep-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "c4-factory.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-keep-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "c4-factory.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ join ", " $owned }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-keep-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "c4-factory.giteaLabels" (dict "name" "gitea" "context" .) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-keep-secrets
subjects:
  - kind: ServiceAccount
    name: gitea-keep-secrets
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-keep-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "c4-factory.giteaLabels" (dict "name" "gitea-keep-secrets" "context" .) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "c4-factory.giteaLabels" (dict "name" "gitea-keep-secrets" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: gitea-keep-secrets
      restartPolicy: Never
      {{- include "c4-factory.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keep
          image: "{{ $seed.image.repository }}:{{ $seed.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $seed.image.pullPolicy }}
          command: [sh, -ec]
          args:
            - |
              {{- range $owned }}
              kubectl annotate secret {{ . }} helm.sh/resource-policy=keep --overwrite
              {{- end }}
          env:
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
