{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "c4-factory.uiSelectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.ui.service.port }}
    targetPort: http
    protocol: TCP
{{- end }}
