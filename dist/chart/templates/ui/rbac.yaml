{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
---
# The same access as config/ui/rbac.yaml: reading the story, the Sessions, the
# catalog and the factory's work in every namespace, and for the health view
# nodes and their metrics, and pods and theirs where the factory runs. The
# writes are below, by ui.actions.enabled. No status subresources, no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c4-factory.uiName" . }}-reader
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
rules:
- apiGroups: [c4.factory.io]
  resources:
  - projects
  - people
  - softwaresystems
  - containers
  - datastores
  - relationships
  - sessions
  - frameworks
  - computes
  - deployments
  - bundles
  - connectors
  - gitproviders
  - deploytargets
  - standards
  - agents
  - tasks
  - crews
  - briefs
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c4-factory.uiName" . }}-reader
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c4-factory.uiName" . }}-reader
subjects:
- kind: ServiceAccount
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c4-factory.uiName" . }}-health
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list]
- apiGroups: [metrics.k8s.io]
  resources: [nodes]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c4-factory.uiName" . }}-health
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c4-factory.uiName" . }}-health
subjects:
- kind: ServiceAccount
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
---
# Pods and their metrics, bound only in the namespaces of ui.components (and
# Gitea's): each must exist at install. The operator lets the UI read them in
# every project namespace too, for the agent sandboxes (--ui-service-account).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c4-factory.uiName" . }}-pods
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [metrics.k8s.io]
  resources: [pods]
  verbs: [get, list]
{{- $namespaces := list }}
{{- range include "c4-factory.uiComponents" . | fromJsonArray }}
{{- $namespaces = append $namespaces .namespace }}
{{- end }}
{{- range $namespaces | uniq | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "c4-factory.uiName" $ }}-pods
  namespace: {{ . }}
  labels:
    {{- include "c4-factory.uiLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c4-factory.uiName" $ }}-pods
subjects:
- kind: ServiceAccount
  name: {{ include "c4-factory.uiName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- $actions := include "c4-factory.uiActions" . }}
{{- if not $actions }}
---
# With ui.actions.enabled off, the UI's only three writes (ui/server.mjs
# checks them first): create a Brief, the box for an idea, and patch one to
# append a follow-up prompt or to set spec.paused. Nothing else: no update,
# delete or status, no other kind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c4-factory.uiName" . }}-brief-writer
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
rules:
- apiGroups: [c4.factory.io]
  resources: [briefs]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c4-factory.uiName" . }}-brief-writer
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c4-factory.uiName" . }}-brief-writer
subjects:
- kind: ServiceAccount
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
{{- else }}
---
# With ui.actions.enabled, the writes of the UI's action table (design.md, UI
# actions; ui/server.mjs checks each first): create a Brief or a Task, and
# patch a Brief, a Crew, a Container or a Standard. Nothing else: no update,
# delete or status, no other kind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c4-factory.uiName" . }}-actions
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
rules:
- apiGroups: [c4.factory.io]
  resources: [briefs, tasks]
  verbs: [create]
- apiGroups: [c4.factory.io]
  resources: [briefs, crews, containers, standards]
  verbs: [patch]
{{- if eq $actions "service-account" }}
---
# Over port-forward the UI acts as its ServiceAccount: whoever reaches the
# page can already reach the cluster. With ui.auth.oidc it acts as the person
# signed in, so the ServiceAccount gets none of these writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c4-factory.uiName" . }}-actions
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c4-factory.uiName" . }}-actions
subjects:
- kind: ServiceAccount
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
{{- else }}
{{- $oidc := .Values.ui.auth.oidc }}
---
# With ui.auth.oidc every write is made as the person signed in: the UI
# impersonates the names it takes from their ID token, prefixed. RBAC can't
# narrow impersonate to prefixed names, so the UI pod can act as any user or
# group (design.md, UI actions).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c4-factory.uiName" . }}-impersonator
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [users, groups]
  verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c4-factory.uiName" . }}-impersonator
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c4-factory.uiName" . }}-impersonator
subjects:
- kind: ServiceAccount
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
{{- with $oidc.actionGroups }}
{{- $prefix := include "c4-factory.uiOIDC" (list $oidc "groupsPrefix" "oidc:") }}
---
# The people in ui.auth.oidc.actionGroups may take every action; grant others
# with your own bindings to ClusterRole {{ include "c4-factory.uiName" $ }}-actions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c4-factory.uiName" $ }}-actions
  labels:
    {{- include "c4-factory.uiLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c4-factory.uiName" $ }}-actions
subjects:
{{- range . }}
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ printf "%s%s" $prefix . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
