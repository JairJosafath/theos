{{- /* Hand-written, not generated by the helm plugin: config/ui is its own kustomization. */}}
{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "theos.uiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "theos.uiLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "theos.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "theos.uiLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "theos.uiName" . }}
      {{- with .Values.ui.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ui
        image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
        {{- with .Values.ui.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        env:
        - name: PORT
          value: "8080"
        # The health view's components (ui/health.mjs); an empty namespace is
        # the release's.
        - name: FACTORY_COMPONENTS
          value: {{ include "theos.uiComponents" . | quote }}
        {{- with .Values.ui.allowedHosts }}
        # Host names answered besides localhost (an Ingress's).
        - name: UI_ALLOWED_HOSTS
          value: {{ join "," . | quote }}
        {{- end }}
        {{- with include "theos.uiActions" . }}
        # Who makes the action table's writes: service-account or oidc.
        - name: UI_ACTIONS
          value: {{ . | quote }}
        {{- end }}
        {{- if eq (include "theos.uiActions" .) "oidc" }}
        {{- $oidc := .Values.ui.auth.oidc }}
        # Sign-in (ui/oidc.mjs). The client secret comes from the Secret the
        # person made, never from values.
        - name: OIDC_ISSUER_URL
          value: {{ $oidc.issuerURL | quote }}
        - name: OIDC_CLIENT_ID
          value: {{ $oidc.clientID | quote }}
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $oidc.existingSecret }}
              key: {{ $oidc.existingSecretKey | default "client-secret" }}
        {{- with $oidc.redirectURL }}
        - name: OIDC_REDIRECT_URL
          value: {{ . | quote }}
        {{- end }}
        - name: OIDC_SCOPES
          value: {{ join " " ($oidc.scopes | default (list "openid" "email" "profile")) | quote }}
        - name: OIDC_USERNAME_CLAIM
          value: {{ $oidc.usernameClaim | default "email" | quote }}
        - name: OIDC_USERNAME_PREFIX
          value: {{ include "theos.uiOIDC" (list $oidc "usernamePrefix" "oidc:") | quote }}
        - name: OIDC_GROUPS_CLAIM
          value: {{ $oidc.groupsClaim | default "groups" | quote }}
        - name: OIDC_GROUPS_PREFIX
          value: {{ include "theos.uiOIDC" (list $oidc "groupsPrefix" "oidc:") | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          # A busy single-node host can keep a healthy process from answering
          # within the 1 s default; only a real hang should restart it (#957).
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
{{- end }}
