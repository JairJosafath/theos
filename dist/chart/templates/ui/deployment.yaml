{{- /* Hand-written, not generated by the helm plugin: config/ui is its own kustomization. */}}
{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c4-factory.uiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "c4-factory.uiLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "c4-factory.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "c4-factory.uiLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "c4-factory.uiName" . }}
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ui
        image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
        {{- with .Values.ui.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        env:
        - name: PORT
          value: "8080"
        # The health view's components (ui/health.mjs); an empty namespace is
        # the release's.
        - name: FACTORY_COMPONENTS
          value: {{ include "c4-factory.uiComponents" . | quote }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
{{- end }}
