{{- if .Values.agents.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c4-factory.modelProxyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "c4-factory.modelProxyLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "c4-factory.modelProxySelectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
{{- end }}
