# Seeds Gitea (see seed.sh). `make seed` deletes the previous Job, applies this
# one and waits for it; the image is built locally and kind-loaded, never pulled.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: gitea
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/part-of: theos-testenv
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/part-of: theos-testenv
    spec:
      serviceAccountName: seed
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: theos/seed:dev
          imagePullPolicy: Never
          env:
            - name: GITEA_URL
              value: http://gitea.gitea.svc.cluster.local:3000
            - name: PROJECTS
              value: webshop apps
            - name: GITEA_USERNAME
              valueFrom: {secretKeyRef: {name: gitea-admin, key: username}}
            - name: GITEA_PASSWORD
              valueFrom: {secretKeyRef: {name: gitea-admin, key: password}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
