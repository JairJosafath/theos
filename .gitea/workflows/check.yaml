# The factory's own check: make check on every pull request and on main. Plain
# YAML, not a template, so the repository's copy is these bytes. The branch
# protection of main requires a passing "check" context before a merge.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: go
    steps:
      # The commit and main's history come without blobs (a blob is fetched on
      # demand, with the token header kept in the config), so make test and
      # make lint can diff against the base and test only what a change can
      # affect (Fence issue #2058). A pull request diffs against origin/main; a
      # push to main against its previous head, and tests every package when
      # that head is zeros or can't be fetched.
      - name: Check out
        run: |
          git init -q .
          git remote add origin "${{ gitea.server_url }}/${{ gitea.repository }}.git"
          git config http.extraHeader "Authorization: token ${{ gitea.token }}"
          git fetch -q --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main "${{ gitea.sha }}"
          git checkout -q "${{ gitea.sha }}"
          if [ "${{ gitea.event_name }}" = push ]; then
            before="${{ gitea.event.before }}"
            if git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "TEST_BASE=$before" >>"$GITHUB_ENV"
            else
              echo "TEST_ALL=1" >>"$GITHUB_ENV"
            fi
          fi
      # The runner's /tmp and /data/work are memory-backed and small; /data is
      # on the node's disk (Fence issue #2043).
      - name: Scratch on disk
        run: mkdir -p /data/tmp
      - name: make check
        run: |
          python3 - make check <<'PY'
          # A child subreaper: orphans reparent here and are reaped, since the
          # runner's PID 1 reaps nothing (Fence issue #2047).
          import ctypes, os, subprocess, sys
          PR_SET_CHILD_SUBREAPER = 36
          ctypes.CDLL(None, use_errno=True).prctl(PR_SET_CHILD_SUBREAPER, 1, 0, 0, 0)
          child = subprocess.Popen(sys.argv[1:])
          rc = None
          while rc is None:
              try:
                  pid, status = os.wait()
              except ChildProcessError:
                  rc = 1
                  break
              if pid == child.pid:
                  rc = os.waitstatus_to_exitcode(status)
          sys.exit(rc)
          PY
        env:
          LINT_CHANGED_ONLY: "1"
          TMPDIR: /data/tmp
          GOTMPDIR: /data/tmp
